# ── E2E test profile overrides ────────────────────────────────────────────────
# Applied when @ActiveProfiles("e2e") is set on the test class.
# PipelineE2ETest supplies a disposable Testcontainers PostgreSQL database. Any other e2e-profile
# caller must provide an explicit isolated database URL; the ordinary local database is never a
# fallback.

spring:
  datasource:
    url: ${EXECUTESPEC_E2E_DATABASE_URL}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    show-sql: false
  ai:
    # Router-owned native clients and AgentModelConfig create only configured provider clients.
    # Disable unrelated Spring AI auto-configured capabilities in this isolated fixture.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

agent:
  workspace: ./workspace-e2e     # isolated from normal ./workspace

  token-budget:
    low: 1024
    medium: 2048
    high: 4096

  concurrency:
    max-runs: 2

  recovery:
    enabled: false               # prevent stuck-run monitor from interfering with test timing

  context:
    enabled: false               # post-merge context agent not needed in tests

  optimiser:
    enabled: false               # prompt optimiser not needed in tests

  integrations:
    enabled: false               # no integrations needed for pipeline E2E tests

# PipelineE2ETest pins DEEPSEEK/deepseek-v4-flash-native and a $0.10 RunRequest cap in its
# test-context-only reserved submit endpoint. Do not add placeholder provider keys here: live
# dispatch requires -Plive-llm-test plus an exact provider/model/run budget-ledger reservation.

# Qualification exercises BUILD acceptance, not cloud deployment or automatic preview.
preview:
  enabled: false

logging:
  level:
    com.navneet.executespec: INFO   # less noise during test runs; change to DEBUG if debugging
    org.springframework.ai: WARN
