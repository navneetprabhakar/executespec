<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Usage Report</title></head>
<body style="font-family:'SFMono-Regular',ui-monospace,'Cascadia Mono','Segoe UI Mono',monospace;background:#000000;color:#ededed;padding:40px 16px;margin:0">
  <div style="max-width:560px;margin:0 auto">

    <!-- Header -->
    <div style="background:#111111;border:1px solid #252525;border-bottom:none;border-radius:6px 6px 0 0;padding:28px 32px">
      <h1 style="color:#ededed;margin:0;font-size:22px;font-weight:700">executespec</h1>
      <p style="color:#a1a1a1;margin:6px 0 0;font-size:14px">
        <span th:text="${period}">Weekly</span> Usage Report
      </p>
      <p style="color:#666666;margin:4px 0 0;font-size:12px" th:text="${periodRange}">
        Mar 14 – Mar 21, 2026
      </p>
    </div>

    <!-- Body -->
    <div style="background:#111111;border:1px solid #252525;border-top:none;border-radius:0 0 6px 6px;padding:32px">

      <p style="margin:0 0 24px;font-size:14px">
        Hi <span th:text="${firstName}">there</span>, here's your usage summary:
      </p>

      <!-- Stat Cards (3-up) -->
      <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px">
        <tr>
          <td width="33%" style="padding:0 4px 0 0;vertical-align:top">
            <div style="background:#000000;border-radius:6px;padding:16px;text-align:center;border:1px solid #252525">
              <div style="font-size:32px;font-weight:800;color:#ededed;line-height:1" th:text="${totalRuns}">42</div>
              <div style="font-size:10px;color:#a1a1a1;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px">Runs</div>
              <div th:style="'font-size:11px;margin-top:6px;font-weight:600;color:' + (${runsDeltaPositive} ? '#17B169' : '#e5484d')"
                   th:text="${runsDelta}">+15%</div>
            </div>
          </td>
          <td width="33%" style="padding:0 2px;vertical-align:top">
            <div style="background:#000000;border-radius:6px;padding:16px;text-align:center;border:1px solid #252525">
              <div style="font-size:32px;font-weight:800;color:#ededed;line-height:1" th:text="${totalTokens}">1.2M</div>
              <div style="font-size:10px;color:#a1a1a1;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px">Tokens</div>
              <div th:style="'font-size:11px;margin-top:6px;font-weight:600;color:' + (${tokensDeltaPositive} ? '#17B169' : '#e5484d')"
                   th:text="${tokensDelta}">+8%</div>
            </div>
          </td>
          <td width="33%" style="padding:0 0 0 4px;vertical-align:top">
            <div style="background:#000000;border-radius:6px;padding:16px;text-align:center;border:1px solid #252525">
              <div style="font-size:32px;font-weight:800;color:#f5a623;line-height:1" th:text="${estimatedCost}">$12</div>
              <div style="font-size:10px;color:#a1a1a1;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px">Est. Cost</div>
              <div th:style="'font-size:11px;margin-top:6px;font-weight:600;color:' + (${costDeltaPositive} ? '#17B169' : '#e5484d')"
                   th:text="${costDelta}">+5%</div>
            </div>
          </td>
        </tr>
      </table>

      <!-- Run Status Bar -->
      <div style="margin-bottom:24px">
        <div style="font-size:11px;color:#a1a1a1;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Run Outcomes</div>
        <div style="background:#333333;border-radius:4px;height:28px;overflow:hidden;display:flex" th:if="${totalRuns > 0}">
          <div th:style="'width:' + ${completedPct} + '%;background:#17B169;height:100%'"></div>
          <div th:style="'width:' + ${failedPct} + '%;background:#e5484d;height:100%'"></div>
        </div>
        <div style="display:flex;gap:16px;margin-top:6px;font-size:11px">
          <span style="color:#17B169">&#9679; Completed: <span th:text="${completedRuns}">38</span></span>
          <span style="color:#e5484d">&#9679; Failed: <span th:text="${failedRuns}">4</span></span>
        </div>
      </div>

      <!-- Project Breakdown -->
      <div th:if="${hasProjects}" style="margin-bottom:24px">
        <div style="font-size:11px;color:#a1a1a1;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">By Project</div>
        <table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px">
          <tr th:each="p : ${projects}">
            <td style="padding:6px 8px 6px 0;color:#ededed;white-space:nowrap" th:text="${p.name}">My Project</td>
            <td style="padding:6px 8px;color:#a1a1a1;text-align:right;white-space:nowrap">
              <span th:text="${p.runs}">10</span> runs
            </td>
            <td style="padding:6px 0;width:40%">
              <div style="background:#333333;border-radius:4px;height:14px;overflow:hidden">
                <div th:style="'width:' + ${p.pct} + '%;background:#ededed;height:100%;border-radius:4px'"></div>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <!-- CTA -->
      <div style="text-align:center;margin-top:28px">
        <a th:href="${baseUrl + '/runs'}" href="#"
           style="display:inline-block;background:#ededed;color:#000000;text-decoration:none;
                  padding:12px 32px;border-radius:4px;font-weight:600;font-size:14px">
          View Dashboard
        </a>
      </div>

      <!-- Footer -->
      <hr style="border:1px solid #252525;margin:28px 0 16px"/>
      <p style="color:#a1a1a1;font-size:12px;text-align:center;margin:0">
        &copy; 2026 executespec &middot;
        <a th:href="${baseUrl}" style="color:#a1a1a1;text-decoration:underline" href="#">executespec.ai</a>
      </p>
    </div>
  </div>
</body>
</html>
