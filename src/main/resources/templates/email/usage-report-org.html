<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your org's monthly ExecuteSpec usage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0B0D10;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color:#ededed;line-height:1.55;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#0B0D10;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border-collapse:collapse;background:#14171C;border:1px solid #242A33;border-radius:14px;overflow:hidden;">
      <tr><td style="padding:32px 28px 20px;background:linear-gradient(135deg,rgba(91,141,239,0.18),rgba(139,92,246,0.10) 60%,transparent);border-bottom:1px solid #242A33;">
        <div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#ededed;color:#0B0D10;border-radius:6px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:12px;">ES</span>
          <span style="color:#ededed;font-weight:600;font-size:15px;letter-spacing:-0.01em;">ExecuteSpec</span>
        </div>
        <div style="display:inline-block;background:rgba(91,141,239,0.14);border:1px solid rgba(91,141,239,0.45);border-radius:999px;padding:3px 10px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#5B8DEF;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;">Org monthly report</div>
        <h1 style="margin:0;color:#ededed;font-size:24px;line-height:1.18;letter-spacing:-0.025em;font-weight:600;">Team shipping velocity.</h1>
      </td></tr>
      <tr><td style="padding:24px 28px 8px;">
        <p style="margin:0 0 14px;color:#C9D1DB;font-size:14.5px;">Hi <span th:text="${firstName}" style="color:#ededed;font-weight:500;">there</span>,</p>
        <p style="margin:0 0 14px;color:#C9D1DB;font-size:14.5px;">Here's how <strong th:text="${orgName}" style="color:#ededed;">your org</strong> shipped in <strong th:text="${periodLabel}" style="color:#ededed;">January</strong>:</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 18px;background:#111;border:1px solid #242A33;border-radius:8px;font-size:13.5px;">          <tr><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#8A94A6;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">Total runs</td><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#ededed;text-align:right;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;" th:text="${runs}">0</td></tr>          <tr><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#8A94A6;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">Active members</td><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#ededed;text-align:right;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;" th:text="${activeMembers}">0</td></tr>          <tr><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#8A94A6;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">Tokens</td><td style="padding:10px 14px;border-bottom:1px solid #242A33;color:#ededed;text-align:right;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;" th:text="${tokens}">0</td></tr>          <tr><td style="padding:10px 14px;color:#8A94A6;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">Spend</td><td style="padding:10px 14px;color:#10b981;text-align:right;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;" th:text="${spend}">&dollar;0.00</td></tr>        </table>
<table role="presentation" cellspacing="0" cellpadding="0"><tr><td><a th:href="${baseUrl}" href="#" style="display:inline-block;background:#5B8DEF;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:500;font-size:14px;letter-spacing:-0.005em;">Open org dashboard &rarr;</a></td></tr></table>
      </td></tr>
      <tr><td style="padding:18px 28px 22px;border-top:1px solid #242A33;background:#14171C;color:#8A94A6;font-size:11.5px;">
        &copy; 2026 ExecuteSpec &middot; <a th:href="${baseUrl}" style="color:#C9D1DB;text-decoration:none;" href="#">executespec.ai</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
