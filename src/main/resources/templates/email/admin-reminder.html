<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${subject}">ExecuteSpec reminder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0B0D10;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color:#ededed;line-height:1.55;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#0B0D10;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;border-collapse:collapse;background:#14171C;border:1px solid #242A33;border-radius:14px;overflow:hidden;">

      <tr><td style="padding:32px 28px 20px;background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(91,141,239,0.10) 60%,transparent);border-bottom:1px solid #242A33;">
        <div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#ededed;color:#0B0D10;border-radius:6px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:12px;">ES</span>
          <span style="color:#ededed;font-weight:600;font-size:15px;letter-spacing:-0.01em;">ExecuteSpec</span>
        </div>
        <div style="display:inline-block;background:rgba(245,158,11,0.14);border:1px solid rgba(245,158,11,0.45);border-radius:999px;padding:3px 10px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#F59E0B;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;">Reminder</div>
        <h1 style="margin:0;color:#ededed;font-size:22px;line-height:1.2;letter-spacing:-0.022em;font-weight:600;" th:text="${subject}">Reminder</h1>
      </td></tr>

      <tr><td style="padding:24px 28px 10px;color:#C9D1DB;font-size:14.5px;">
        <div style="background:#111;border:1px solid #242A33;border-radius:8px;padding:16px 18px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#ededed;white-space:pre-wrap;word-break:break-word;line-height:1.6;" th:text="${body}">Body text appears here.</div>
      </td></tr>

      <tr><td style="padding:6px 28px 24px;">
        <table role="presentation" cellspacing="0" cellpadding="0"><tr><td>
          <a th:href="${adminUrl}" href="#" style="display:inline-block;background:#5B8DEF;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:500;font-size:14px;letter-spacing:-0.005em;">Open admin dashboard</a>
        </td></tr></table>
      </td></tr>

      <tr><td style="padding:18px 28px 22px;border-top:1px solid #242A33;background:#14171C;color:#8A94A6;font-size:11.5px;">
        Sent by ExecuteSpec reminder scheduler &middot; <a th:href="${baseUrl}" style="color:#C9D1DB;text-decoration:none;" href="#">executespec.ai</a>
      </td></tr>

    </table>
  </td></tr>
</table>
</body></html>
