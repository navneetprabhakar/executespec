<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Invoice</title></head>
<body style="font-family:'SFMono-Regular',ui-monospace,'Cascadia Mono','Segoe UI Mono',monospace;background:#000000;color:#ededed;padding:40px">
  <div style="max-width:480px;margin:0 auto;background:#111111;border:1px solid #252525;border-radius:6px;padding:32px">
    <h1 style="color:#ededed;margin:0 0 8px">executespec</h1>
    <h2 style="margin:0 0 24px;font-size:20px">Your Invoice</h2>
    <p>Hi <span th:text="${firstName}">there</span>,</p>
    <p>Your invoice <strong th:text="${invoiceNumber}">ES-2526-0001</strong> has been generated.</p>
    <table style="width:100%;margin:16px 0;border-collapse:collapse">
      <tr>
        <td style="padding:8px 0;color:#a1a1a1">Invoice Number</td>
        <td style="padding:8px 0;text-align:right;font-weight:600" th:text="${invoiceNumber}">ES-2526-0001</td>
      </tr>
      <tr>
        <td style="padding:8px 0;color:#a1a1a1;border-top:1px solid #252525">Total Amount</td>
        <td style="padding:8px 0;text-align:right;font-weight:600;border-top:1px solid #252525" th:text="${totalFormatted}">&#8377;0.00</td>
      </tr>
      <tr>
        <td style="padding:8px 0;color:#a1a1a1;border-top:1px solid #252525">Status</td>
        <td style="padding:8px 0;text-align:right;font-weight:600;color:#17B169;border-top:1px solid #252525">PAID</td>
      </tr>
    </table>
    <p>The PDF invoice is attached to this email for your records.</p>
    <a th:href="${baseUrl + '/invoices'}" href="#"
       style="display:inline-block;background:#ededed;color:#000000;text-decoration:none;
              padding:12px 28px;border-radius:4px;font-weight:600;margin:16px 0">
      View All Invoices
    </a>
    <hr style="border:1px solid #252525;margin:24px 0"/>
    <p style="color:#a1a1a1;font-size:12px">&copy; 2026 executespec &middot; <a th:href="${baseUrl}" style="color:#a1a1a1;text-decoration:underline" href="#">executespec.ai</a></p>
  </div>
</body>
</html>
