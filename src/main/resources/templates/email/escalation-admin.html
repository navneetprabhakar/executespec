<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cross-domain invite requires approval</title></head>
<body style="font-family:'SFMono-Regular',ui-monospace,'Cascadia Mono','Segoe UI Mono',monospace;background:#000000;color:#ededed;padding:40px">
  <div style="max-width:480px;margin:0 auto;background:#111111;border:1px solid #252525;border-radius:6px;padding:32px">
    <h1 style="color:#ededed;margin:0 0 8px">executespec</h1>
    <h2 style="margin:0 0 24px;font-size:20px">Cross-domain invite approval required</h2>
    <p>Org <strong th:text="${orgName}">Org</strong> wants to invite
       <strong th:text="${invitedEmail}">email@example.com</strong>,
       who is outside their registered email domains.</p>
    <p>Please review and take action:</p>
    <div style="display:flex;gap:12px;margin:20px 0">
      <a th:href="${approveUrl}" href="#"
         style="display:inline-block;background:#17B169;color:#000000;text-decoration:none;
                padding:12px 28px;border-radius:4px;font-weight:600">
        Approve
      </a>
      <a th:href="${rejectUrl}" href="#"
         style="display:inline-block;background:#e5484d;color:#ededed;text-decoration:none;
                padding:12px 28px;border-radius:4px;font-weight:600">
        Reject
      </a>
    </div>
    <p style="color:#a1a1a1;font-size:13px">Or use the <a th:href="${baseUrl + '/admin/invitations'}" style="color:#ededed;text-decoration:underline" href="#">Admin UI</a> to manage escalated invitations.</p>
    <hr style="border:1px solid #252525;margin:24px 0"/>
    <p style="color:#a1a1a1;font-size:12px">&copy; 2026 executespec &middot; <a th:href="${baseUrl}" style="color:#a1a1a1;text-decoration:underline" href="#">executespec.ai</a></p>
  </div>
</body>
</html>
