slug: dark-mode-toggle
name: Dark-mode toggle
tagline: System-aware light/dark switcher with persistence
description: |
  Adds a theme toggle that reads `prefers-color-scheme` for the
  initial value, persists user choice in localStorage, and applies
  the data-theme attribute to <html> with no flash on load.
category: build-the-ui
macro_group: ui-and-growth
tags: [ui, theme, dark-mode, accessibility]
kind: PRIMITIVE
tier: FREE
source: FIRST_PARTY
status: LISTED
icon_url: /icons/moon.svg
est_files: [2, 4]
est_credits: [0.5, 1.5]
slots: []
variants:
  - language: typescript
    framework: nextjs
    options: {router: app}
    spec_template: |
      Add a dark-mode toggle to this Next.js app.  Use the
      next-themes library (no flash).  Add a <ThemeToggle/>
      component using a sun/moon icon.  Wrap RootLayout with
      ThemeProvider, suppressHydrationWarning on <html>.
    scaffold_key: node-frontend
  - language: typescript
    framework: vite-react
    options: {}
    spec_template: |
      Add a dark-mode toggle to this Vite + React app.  Apply
      data-theme on <html>.  Read prefers-color-scheme on first load
      and persist choice to localStorage with no flash (set the
      attribute synchronously in index.html before React mounts).
    scaffold_key: node-frontend
