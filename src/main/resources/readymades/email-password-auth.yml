slug: email-password-auth
name: Email + password sign-in
tagline: Bcrypt-hashed credentials with verification email + reset flow
description: |
  Adds a full email/password authentication flow — register, login,
  email verification token, forgot-password reset link.  Reuses
  your existing User entity if one is detected; otherwise installs
  one.  Hashes with bcrypt, stores rate-limit counters in the data
  layer, and ships sensible defaults for token TTLs.
category: sign-in-and-users
macro_group: people-and-money
tags: [auth, email, password, bcrypt]
kind: PRIMITIVE
tier: FREE
source: FIRST_PARTY
status: LISTED
icon_url: /icons/lock.svg
est_files: [4, 10]
est_credits: [1.0, 3.0]
slots:
  - name: from_email
    display_name: Verification sender
    type: TEXT
    required: true
    default_value: noreply@example.com
    description: Address that verification + reset emails come from.
    display_order: 0
  - name: jwt_secret_env
    display_name: JWT secret env var
    type: TEXT
    required: false
    default_value: JWT_SECRET
    description: Name of the env var that holds the JWT signing secret.
    display_order: 1
variants:
  - language: typescript
    framework: express
    options: {db: postgres}
    spec_template: |
      Add email + password auth to this Express app.  Endpoints:
      POST /auth/register, /auth/login, /auth/verify-email,
      /auth/forgot-password, /auth/reset-password.  Hash passwords
      with bcrypt (cost 12).  Sign JWTs from {{jwt_secret_env}}.
      Send verification + reset emails from {{from_email}}.
    scaffold_key: node-backend
  - language: typescript
    framework: nextjs
    options: {router: app, auth_lib: nextauth}
    spec_template: |
      Add email + password auth to this Next.js (App Router) app
      using NextAuth's Credentials provider.  Hash with bcrypt.
      Add /auth/register + /auth/verify-email + /auth/reset-password
      routes.  Sender: {{from_email}}.  JWT secret env: {{jwt_secret_env}}.
    scaffold_key: node-frontend
  - language: python
    framework: fastapi
    options: {db: postgres}
    spec_template: |
      Add email + password auth to this FastAPI app.  Use passlib
      bcrypt for hashing, python-jose for JWTs (secret env
      {{jwt_secret_env}}).  Endpoints under /auth.  Verification +
      reset emails from {{from_email}}.
    scaffold_key: python
