slug: posthog-analytics
name: Product analytics via PostHog
tagline: Event tracking + funnels + session replay
description: |
  Wires PostHog as the product-analytics provider.  Adds the
  client-side SDK with autocapture, server-side event-forwarding
  for sensitive flows, identify() on login, and a few starter
  funnel events (signup → first-action → activation).
category: track-usage
macro_group: ui-and-growth
tags: [analytics, posthog, events, funnels]
kind: PRIMITIVE
tier: FREE
source: FIRST_PARTY
status: LISTED
icon_url: /icons/posthog.svg
est_files: [3, 6]
est_credits: [1.0, 2.5]
slots:
  - name: project_api_key
    display_name: PostHog Project API Key
    type: SECRET
    required: true
    description: From posthog.com → Project Settings → Project API Key.
    display_order: 0
  - name: api_host
    display_name: PostHog API host
    type: TEXT
    required: false
    default_value: https://us.i.posthog.com
    description: us.i.posthog.com (default) or eu.i.posthog.com.
    display_order: 1
variants:
  - language: typescript
    framework: nextjs
    options: {router: app}
    spec_template: |
      Add posthog-js to this Next.js app.  Project key
      {{project_api_key}}, host {{api_host}}.  Initialize in a
      client-only PostHogProvider component.  Wire identify(userId)
      after login.  Track signup_completed + first_action +
      activation events on the relevant flows.
    scaffold_key: node-frontend
  - language: typescript
    framework: vite-react
    options: {}
    spec_template: |
      Add posthog-js to this Vite + React app.  Init with
      {{project_api_key}} pointing at {{api_host}}.  PostHogProvider
      at the root.
    scaffold_key: node-frontend
