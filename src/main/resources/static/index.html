         developer-tool / terminal-style aesthetic. Marketing site uses
         the same family so landing → product typography is identical.

         Mobile-sharpness fix (iter-3, 2026-05-10): the CSS link below
         was being blocked by the prod CSP (`style-src 'self'
         'unsafe-inline' https://cdn.jsdelivr.net` did not include
         fonts.googleapis.com). On mobile the font silently fell back
         to ui-monospace / SF Mono / Menlo — none of which are tuned
         for the body chain and render fuzzily on iOS Safari at 2x/3x

         backend/SecurityProperties.java now allows
         fonts.googleapis.com so the @font-face block resolves. -->
