slug: js-to-typescript
name: JavaScript → TypeScript
tagline: Convert your JS codebase to TypeScript with type inference
description: |
  Bulk-renames .js → .ts (and .jsx → .tsx), adds tsconfig.json,
  generates per-file types via inference, and fixes import paths.
  Preserves runtime behaviour; adds compile-time safety.
source_stack:
  language: javascript
target_stack:
  language: typescript
affected_files_glob: "src/**/*.{js,jsx}"
category: language-migration
tags: [typescript, javascript, types]
tier: PRO
source: FIRST_PARTY
status: LISTED
ai_fallback_prompt_path: prompts/migrations/js-to-typescript-fallback.md
preservation_contract:
  preserve_runtime_behaviour: true
  preserve_export_surface: true
est_files: [20, 200]
est_credits: [10.0, 80.0]
slots:
  - name: tsconfig_strict
    display_name: Use strict tsconfig
    type: BOOLEAN
    required: false
    default_value: "true"
    description: When true, generated tsconfig has strict + noImplicitAny enabled.
    display_order: 0
variants:
  - options_signature: default
    options: {}
    spec_template: |
      Convert this JavaScript codebase to TypeScript.
      - Rename every .js → .ts and .jsx → .tsx file
      - Generate tsconfig.json (strict={{tsconfig_strict}})
      - Infer types per function / class / variable; fall back to `unknown`
        when inference is ambiguous
      - Fix every import path to drop the .js extension (or update to .ts)
      - Preserve runtime behaviour exactly; do not refactor logic
      - Update package.json scripts to compile via tsc before run
