# ══════════════════════════════════════════════════════════════════════════════
# ExecuteSpec — Dev profile (GCE VM deployment)
# ══════════════════════════════════════════════════════════════════════════════
# Activate with: --spring.profiles.active=dev
# Provider weights: balanced 4:3:3 (Anthropic:Google:OpenAI)
# OTLP tracing disabled (no collector on dev VM)
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ ENVIRONMENT VARIABLES (all have safe defaults — app starts without them)   │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ ANTHROPIC_API_KEY      Claude API key                                      │
# │ OPENAI_API_KEY         OpenAI API key                                      │
# │ GOOGLE_API_KEY         Gemini API key (for LLM fallback chain)             │
# │ JWT_SECRET             JWT signing key (≥256 bits for HS256)               │
# │ SMTP_PASSWORD          Gmail app password for email notifications          │
# │ GITHUB_PAT             GitHub Personal Access Token                        │
# │ GITHUB_OWNER           Default GitHub repo owner                           │
# │ POSTGRES_HOST          PostgreSQL host (default: localhost)                 │
# │ POSTGRES_PORT          PostgreSQL port (default: 5432)                     │
# │ POSTGRES_DB            PostgreSQL database (default: executespec)           │
# │ POSTGRES_USER          PostgreSQL user (default: postgres)                 │
# │ POSTGRES_PASSWORD      PostgreSQL password (default: postgres)             │
# │ REDIS_HOST             Redis host (default: localhost)                     │
# │ REDIS_PORT             Redis port (default: 6379)                          │
# │ RAZORPAY_KEY_ID        Razorpay key ID (billing)                           │
# │ RAZORPAY_KEY_SECRET    Razorpay key secret (billing)                       │
# │ RAZORPAY_WEBHOOK_SECRET Razorpay webhook secret                            │
# │ GCS_WORKSPACE_BUCKET   GCS bucket for workspaces (default: executespec-workspaces) │
# │ CORS_ALLOWED_ORIGINS   CORS origins (default: https://dev.executespec.ai)  │
# │ PREVIEW_FALLBACK_HOST  Preview fallback (e.g. http://dev.executespec.ai)   │
# │ DASHBOARD_URL          Dashboard URL for integration links                 │
# │ SLACK_CLIENT_ID        Slack app client ID                                 │
# │ SLACK_CLIENT_SECRET    Slack app client secret                             │
# │ SLACK_SIGNING_SECRET   Slack signing secret                                │
# │ JIRA_WEBHOOK_SECRET    JIRA webhook secret                                 │
# └─────────────────────────────────────────────────────────────────────────────┘

# ── LLM Provider Keys ────────────────────────────────────────────────────────
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:executespec}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:1061994342941-5rrf50jalmdkg0l5rck95ucc0fenh0vr.apps.googleusercontent.com}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET: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}
            scope: openid, email, profile
            redirect-uri: https://dev.executespec.ai/api/auth/oauth2/callback/{registrationId}
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:Ov23lijrPPx9fhPemczg}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:46033466197599eb1fc74d321b141a816fdcb1f5}
            scope: user:email, read:user
            redirect-uri: https://dev.executespec.ai/api/auth/oauth2/callback/{registrationId}
        provider:
          github:
            user-name-attribute: login

# ── Agent & GitHub ────────────────────────────────────────────────────────────
agent:
  github:
    pat: ${GITHUB_PAT:}
    default-owner: ${GITHUB_OWNER:}
  deployment:
    gcp-project: ${GCP_PROJECT:executespecv1}
    gcp-region: ${GCP_REGION:us-east4}
    artifact-registry:
      repository: ${AR_REPOSITORY:executespec-dev-docker}
      host: ${AR_HOST:us-east4-docker.pkg.dev}
    workspace:
      gcs-bucket: ${GCS_WORKSPACE_BUCKET:executespec-workspaces}
  integrations:
    jira:
      webhook-secret: ${JIRA_WEBHOOK_SECRET:}
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
    confluence:
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
    slack:
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:https://dev.executespec.ai/api/integrations/slack/oauth/callback}
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
  recovery:
    enabled: false

# ── Preview ───────────────────────────────────────────────────────────────────
preview:
  mode: cloud-run
  preview-ttl-minutes: 10
  fallback-host: ${PREVIEW_FALLBACK_HOST:https://dev.executespec.ai}
  proxy:
    enabled: false

# ── App (JWT, CORS, Mail) ────────────────────────────────────────────────────
app:
  mail:
    base-url: https://dev.executespec.ai
    smtp:
      password: ${SMTP_PASSWORD:smdpsanatyrtlcxa}
  jwt:
    secret: ${JWT_SECRET:executespec-dev-secret-key-must-be-at-least-256-bits-long-for-HS256}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.executespec.ai}

# ── Billing ───────────────────────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# ── Observability (disabled — no collector on dev VM) ─────────────────────────
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: false
    sampling:
      probability: 0
  metrics:
    tags:
      environment: dev
