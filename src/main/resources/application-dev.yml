# ══════════════════════════════════════════════════════════════════════════════
# ExecuteSpec — Dev profile (GCE VM deployment)
# ══════════════════════════════════════════════════════════════════════════════
# Activate with: --spring.profiles.active=dev
# Provider weights: balanced 4:3:3 (Anthropic:Google:OpenAI)
# OTLP tracing disabled (no collector on dev VM)
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ ENVIRONMENT VARIABLES (all have safe defaults — app starts without them)   │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ ANTHROPIC_API_KEY      Claude API key                                      │
# │ OPENAI_API_KEY         OpenAI API key                                      │
# │ GOOGLE_API_KEY         Gemini API key (for LLM fallback chain)             │
# │ JWT_SECRET             JWT signing key (≥256 bits for HS256)               │
# │ SMTP_PASSWORD          Gmail app password for email notifications          │
# │ GITHUB_PAT             GitHub Personal Access Token                        │
# │ GITHUB_OWNER           Default GitHub repo owner                           │
# │ POSTGRES_HOST          PostgreSQL host (default: localhost)                 │
# │ POSTGRES_PORT          PostgreSQL port (default: 5432)                     │
# │ POSTGRES_DB            PostgreSQL database (default: executespec)           │
# │ POSTGRES_USER          PostgreSQL user (default: postgres)                 │
# │ POSTGRES_PASSWORD      PostgreSQL password (default: postgres)             │
# │ REDIS_HOST             Redis host (default: localhost)                     │
# │ REDIS_PORT             Redis port (default: 6379)                          │
# │ RAZORPAY_KEY_ID        Razorpay key ID (billing)                           │
# │ RAZORPAY_KEY_SECRET    Razorpay key secret (billing)                       │
# │ RAZORPAY_WEBHOOK_SECRET Razorpay webhook secret                            │
# │ GCS_WORKSPACE_BUCKET   GCS bucket for workspaces (default: executespec-workspaces) │
# │ CORS_ALLOWED_ORIGINS   CORS origins (default: https://dev.executespec.ai)  │
# │ PREVIEW_FALLBACK_HOST  Preview fallback (e.g. http://dev.executespec.ai)   │
# │ DASHBOARD_URL          Dashboard URL for integration links                 │
# │ SLACK_CLIENT_ID        Slack app client ID                                 │
# │ SLACK_CLIENT_SECRET    Slack app client secret                             │
# │ SLACK_SIGNING_SECRET   Slack signing secret                                │
# │ JIRA_WEBHOOK_SECRET    JIRA webhook secret                                 │
# └─────────────────────────────────────────────────────────────────────────────┘

# ── LLM Provider Keys ────────────────────────────────────────────────────────
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:executespec}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    out-of-order: true   # Safety net: v2 branch added V68 after V69-V73 were applied on some envs
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:1061994342941-5rrf50jalmdkg0l5rck95ucc0fenh0vr.apps.googleusercontent.com}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET: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}
            scope: openid, email, profile
            redirect-uri: https://dev.executespec.ai/api/auth/oauth2/callback/{registrationId}
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:Ov23lijrPPx9fhPemczg}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:46033466197599eb1fc74d321b141a816fdcb1f5}
            scope: user:email, read:user
            redirect-uri: https://dev.executespec.ai/api/auth/oauth2/callback/{registrationId}
        provider:
          github:
            user-name-attribute: login

# ── Server (Tomcat / forwarded headers) ──────────────────────────────────────
# The GCE LB / Caddy in front of the JVM terminates TLS and forwards
# X-Forwarded-Proto: https. Without this, Spring sees every request as
# http and rebuilds absolute URLs (e.g. RedirectView Location headers,
# OAuth client redirect_uri when {baseUrl} is used) with the wrong
# scheme. `framework` uses Spring's ForwardedHeaderFilter — safer than
# `native` (Tomcat RemoteIpValve) because it composes with the security
# filter chain ordering we already have.
server:
  forward-headers-strategy: framework

# ── Agent & GitHub ────────────────────────────────────────────────────────────
agent:
  github:
    pat: ${GITHUB_PAT:}
    default-owner: ${GITHUB_OWNER:}
  deployment:
    gcp-project: ${GCP_PROJECT:executespecv1}
    gcp-region: ${GCP_REGION:us-east4}
    artifact-registry:
      repository: ${AR_REPOSITORY:executespec-dev-docker}
      host: ${AR_HOST:us-east4-docker.pkg.dev}
    workspace:
      gcs-bucket: ${GCS_WORKSPACE_BUCKET:executespec-workspaces}
  integrations:
    jira:
      webhook-secret: ${JIRA_WEBHOOK_SECRET:}
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
    confluence:
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
    slack:
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:https://dev.executespec.ai/api/integrations/slack/oauth/callback}
      dashboard-url: ${DASHBOARD_URL:https://dev.executespec.ai}
  recovery:
    enabled: true
    auto-resume-on-startup: true
    startup-resume-delay-seconds: 30

# ── Preview ───────────────────────────────────────────────────────────────────
# 2026-04-20 full-cutover from legacy SSH'd shell-script flow (`mode: vm`) to
# the Spring Boot preview-engine service running on preview-gw. Main-app now
# talks to preview-engine over HTTPS using X-Preview-Api-Key.
preview:
  mode: ${PREVIEW_MODE:docker}                                      # docker-out-of-docker via preview-engine
  preview-ttl-minutes: 15
  fallback-host: ${PREVIEW_FALLBACK_HOST:https://dev.executespec.ai}
  proxy:
    enabled: ${PREVIEW_PROXY_ENABLED:true}
  # Route preview handoff through preview-engine. The old vm.enabled path is off.
  engine:
    route-via: ${PREVIEW_ENGINE_ROUTE_VIA:true}
    base-url:     ${PREVIEW_ENGINE_URL:https://preview-engine.executespec.ai}
    registry-url: ${PREVIEW_ENGINE_REGISTRY_URL:us-east4-docker.pkg.dev/CHANGE_ME/preview-images}
    api-key:      ${PREVIEW_ENGINE_API_KEY:}                         # required; deploy-time env var
    timeout-seconds: 300
  vm:
    enabled: false                                                  # disabled — replaced by preview-engine

# ── App (JWT, CORS, Mail) ────────────────────────────────────────────────────
app:
  mail:
    base-url: https://dev.executespec.ai
    smtp:
      password: ${SMTP_PASSWORD:smdpsanatyrtlcxa}
  jwt:
    secret: ${JWT_SECRET:executespec-dev-secret-key-must-be-at-least-256-bits-long-for-HS256}
  cors:
    # Plan 1 (this-week #5): include staging clones of the future surface
    # subdomains so a Phase-2 dev rollout doesn't need a config push.
    #
    # R-337 follow-up (2026-04-29): added the marketing-site origins
    # (executespec.ai + www.executespec.ai) so the static landing page
    # hosted on Cloudflare can fetch the public V3 landing endpoints
    # (/api/v3/landing/stats, /api/v3/landing/sample-runs,
    # /api/v3/public/exec-snapshot) for the chat-first composer hero.
    # The endpoints are already permitAll; this opens the CORS gate
    # for cross-origin XHR.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.executespec.ai,https://app.dev.executespec.ai,https://build.dev.executespec.ai,https://executespec.ai,https://www.executespec.ai}
  product-routing:
    # Phase 1 dev: the existing dev.* host is logically the executespec
    # (B2B) surface. The vibe origin lands on a not-yet-deployed staging
    # subdomain — wired now so OAuthSurfaceResolver works the day the
    # consumer surface boots, no config change needed.
    app-origin: ${APP_SURFACE_ORIGIN:https://app.dev.executespec.ai}
    build-origin: ${BUILD_SURFACE_ORIGIN:https://dev.executespec.ai}
    app-return-url: ${APP_SURFACE_RETURN_URL:https://app.dev.executespec.ai/auth/callback}
    build-return-url: ${BUILD_SURFACE_RETURN_URL:https://dev.executespec.ai/auth/callback}

# ── Billing ───────────────────────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  webhook-url: ${RAZORPAY_WEBHOOK_URL:https://dev.executespec.ai/api/webhooks/razorpay}

# ── Observability (disabled — no collector on dev VM) ─────────────────────────
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: false
    sampling:
      probability: 0
  metrics:
    tags:
      environment: dev
