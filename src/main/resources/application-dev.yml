# ── Dev profile: GCE VM deployment ─────────────────────────────────────────
# Provider weights: balanced 4:3:3 (Anthropic:Google:OpenAI)
# OTLP tracing disabled (no collector on dev VM)
# API keys: set via environment variables on the dev VM

executespec:
  routing:
    provider-weights:
      anthropic: 4
      google: 3
      openai: 3

spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpAutoConfiguration

app:
  mail:
    smtp:
      password: ${SMTP_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.executespec.ai}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: false
    sampling:
      probability: 0
