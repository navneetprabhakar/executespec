management:
  endpoints:
    web:
      exposure:
        include: health     # Required for LB health check: GET /actuator/health
  endpoint:
    health:
      show-details: never   # Don't expose DB credentials in health response

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:executespec}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate        # Hibernate only validates — Flyway manages all schema
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true   # Safe for existing databases
    baseline-version: 0         # Baseline before V1
    locations: classpath:db/migration

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY: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}
      chat:
        options:
          model: claude-haiku-4-5-20251001  # budget default; worker tasks override via assigned_model
          max-tokens: 16000                  # safe limit — Haiku/Sonnet both support ≥16k output
    openai:
      api-key: ${OPENAI_API_KEY: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}
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 16000                  # gpt-4o / gpt-4o-mini both support 16k output
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:AIzaSyCjIge3pbAvhejI5vELeDe0AWpmH9-P1UU}          # empty default — Gemini is 3rd fallback only
        chat:
          options:
            model: gemini-3.1-flash-lite-preview         # default; ARCHITECT chain overrides to gemini-2.5-pro

agent:
  workspace: ./workspace
  roles:
    planner: anthropic
    worker: anthropic
    reviewer: anthropic
  token-budget:
    max-tokens: 16000        # Must match spring.ai.*.chat.options.max-tokens
    low: 2048                # LOW complexity output-token limit
    medium: 4096             # MEDIUM complexity output-token limit
    high: 8192               # HIGH complexity output-token limit
    hard-ceiling-pct: 0.90   # 14,400 tokens — absolute max, forces FORCE_REPORT
  compaction:
    warn-pct: 0.25     # warn at 50k tokens input (was 0.65 = 130k — too late)
    compact-pct: 0.35  # compact at 70k tokens input (was 0.75 = 150k — accumulated too much history)
    hard-stop-pct: 0.55 # hard-stop at 110k (was 0.90 = 180k)
  concurrency:
    max-runs: 10   # Gate-waiting runs release their slot; this limits actively computing runs only
    max-iterations: 80       # Global fallback cap (used when complexity is unknown)
    max-iterations-low: 30   # LOW complexity tasks (boilerplate, configs, simple CRUD)
    max-iterations-medium: 55 # MEDIUM complexity tasks (standard services, controllers)
    max-iterations-high: 80  # HIGH complexity tasks (complex logic, multi-component)
    extension-threshold-pct: 80  # check progress at 80% of base cap
    extension-pct: 50            # extend by 50% of base cap per grant
    absolute-ceiling-multiplier: 2  # never exceed 2× base cap
  github:
    pat: ${GITHUB_PAT:}
    default-owner: ${GITHUB_OWNER:}
  shell:
    sandbox-enabled: true
    timeout-seconds: 300
    additional-allowed-commands: []
    additional-blocked-patterns: []
  recovery:
    enabled: true
    warn-threshold-minutes: 15
    act-threshold-minutes: 30
    max-task-retries: 1
    evaluator-log-window: 20
    loop-repeat-threshold: 3
    require-restart-approval: false
    max-transient-retries: 3
    rate-limit-backoff-seconds: 30
    server-error-backoff-seconds: 10
    max-auto-restarts: 3
    auto-restart-backoff-seconds: 60
    default-provider: anthropic
    capable-models:
      anthropic: claude-haiku-4-5-20251001
      openai: gpt-4o
    alternate-provider:
      anthropic: openai
      openai: anthropic
  context:
    enabled: true
    model: claude-haiku-4-5-20251001   # The Scout: text summarization, no code generation
    provider: anthropic
    run-interval: 1
  optimiser:
    enabled: true
    run-interval: 10
    analysis-window-runs: 20
    failure-rate-threshold: 0.20
    pattern-min-occurrences: 2
    model: claude-haiku-4-5-20251001   # The Scout: pattern analysis, text edits only
    provider: anthropic
  deployment:
    enabled: true
    gcp-project: ${GCP_PROJECT:cs-poc-wndx76juxpe1pups25gw6tj}
    gcp-region: us-central1
    artifact-registry:
      repository: agent-demos
      host: us-central1-docker.pkg.dev
    cloud-run:
      cpu: "1"
      memory: 512Mi
      max-instances: 1
      allow-unauthenticated: true
    ttl-days: 7
    cleanup-cron: "0 3 * * * *"
    docker:
      build-timeout-seconds: 300
    static-site:
      nginx-image: nginx:1.25-alpine
    spring-boot:
      base-image: eclipse-temurin:21-jre-alpine
    workspace:
      retention-days: 30
      gcs-bucket: ${GCS_WORKSPACE_BUCKET:executespec-workspaces}  # GCS bucket for archived workspaces
      archive-after-hours: 24                                       # hours after completion before archiving to GCS

  # ── Tier 8: Compile agent, API spec generator, frontend preview ──────────────
  compiler:
    enabled: true
    max-attempts: 3
    timeout-seconds: 300
    model: claude-haiku-4-5-20251001    # haiku: fast, budget-friendly compiler error analysis
    provider: anthropic
  api-test-suite:
    enabled: true
    model: claude-haiku-4-5-20251001    # haiku: fast, budget-friendly OpenAPI spec generation
    provider: anthropic

  preview:
    enabled: true

  # ── Tier 7: External Integrations (all disabled by default) ─────────────────
  integrations:
    enabled: true             # Master switch — set true to register /api/integrations/* endpoints
    jira:
      enabled: false
      base-url: ${JIRA_BASE_URL:}
      email: ${JIRA_EMAIL:}
      api-token: ${JIRA_API_TOKEN:}
      webhook-secret: ${JIRA_WEBHOOK_SECRET:}
      trigger-status: "Ready for Coding"   # issue status name that fires the pipeline
      in-progress-status: "In Progress"    # transition to on run start (null = skip)
      in-review-status: "In Review"        # transition to on run complete (null = skip)
      reopen-status: "Backlog"             # transition to on run failed (null = skip)
      dashboard-url: http://localhost:8080
      skip-approval: true
    confluence:
      enabled: false
      base-url: ${CONFLUENCE_BASE_URL:}
      email: ${CONFLUENCE_EMAIL:}
      api-token: ${CONFLUENCE_API_TOKEN:}
      trigger-label: "agent-run"           # page label that fires the pipeline
      space-key: "KAN"                     # default space for child pages
      dashboard-url: http://localhost:8080
      skip-approval: true
    servicenow:
      enabled: false
      base-url: ${SNOW_BASE_URL:}
      username: ${SNOW_USERNAME:}
      password: ${SNOW_PASSWORD:}
      trigger-categories:
        - "application"
        - "database"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    pagerduty:
      enabled: false
      api-token: ${PD_API_TOKEN:}
      webhook-secret: ${PD_WEBHOOK_SECRET:}
      from-email: ${PD_FROM_EMAIL:}        # required for PATCH requests
      trigger-types:
        - "incident.trigger"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    slack:
      enabled: false
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/integrations/slack/oauth/callback}
      dashboard-url: ${DASHBOARD_URL:http://localhost:8080}

app:
  # Gmail API OAuth2 sender config (replaces SMTP)
  gmail:
    enabled: ${GMAIL_ENABLED:true}
    # Path to the credentials.json downloaded from Google Cloud Console
    credentials-path: ${GMAIL_CREDENTIALS_PATH:credentials.json}
    # Where to persist OAuth tokens after the first browser consent (never commit this dir)
    tokens-dir: ${GMAIL_TOKENS_DIR:${user.home}/.executespec/gmail-tokens}
    # Gmail address that will appear as From: — must be the authenticated account
    sender-email: ${GMAIL_SENDER_EMAIL:admin@executespec.ai}
    app-name: executespec
  mail:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:executespec-dev-secret-key-must-be-at-least-256-bits-long-for-HS256}
    access-token-expiry-minutes: 1440
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tiers:
    free:
      monthly-run-limit: 5
      concurrent-run-limit: 1
    pro:
      monthly-run-limit: 100
      concurrent-run-limit: 3
    enterprise:
      monthly-run-limit: -1    # -1 = unlimited
      concurrent-run-limit: 10

executespec:
  validator:
    enabled: true
    per-task-validation: true
    per-task-level: TYPE
    project-validation-level: FULL
    max-retries: 3
    default-timeout: 30s

logging:
  level:
    com.navneet.executespec: INFO
    org.springframework.ai: WARN
