# RL-2026-05-041 (audit #2) — mid-run durability. When enabled (default), the workspace is
# checkpointed to GCS at each task boundary (GcsTaskCheckpointService) so a node loss mid-run is
# recoverable (StartupRunResumer / resumeAfterCrash restore from the latest checkpoint via
# WorkspaceRestoreService) instead of failing WORKSPACE_GONE. No-op when GCS is unconfigured
# (local dev), so it costs nothing there. Set false to disable the per-task GCS writes.
durability:
  task-checkpoint:
    enabled: true

agent:
  workspace: ./workspace
  roles:
    planner: anthropic
    worker: anthropic
    reviewer: anthropic
  token-budget:
    max-tokens: 64000        # Fallback ceiling for hard-ceiling-pct calculation
    hard-ceiling-pct: 0.90   # 90% of model max — absolute max, forces FORCE_REPORT
    # Output ceilings are fixed in TokenBudgetMonitor (LOW=8K, MED=12K, HIGH=16K)
  compaction:
    warn-pct: 0.45     # warn at 90k tokens input (balanced: was 0.25=50k too early, 0.65=130k too late)
    compact-pct: 0.60  # compact at 120k tokens input (balanced: was 0.35=70k too frequent, 0.75=150k too late)
    hard-stop-pct: 0.80 # hard-stop at 160k (balanced: was 0.55=110k too conservative, 0.90=180k too late)
  triage:
    enabled: true    # Phase 1: Single-shot fast path — set false to route all requests through planner
  concurrency:
    max-runs: 50   # Temporarily increased for load testing (was 10)
    max-task-duration-minutes: 25  # Increased for HIGH complexity tasks (was 15)
    safety-iteration-cap: 500     # Hard iteration cap — pure safety net, should never trigger
    task-max-retries: 3           # Auto-retry failed tasks/subtasks up to 3 times before marking FAILED
  # provider-pools: REMOVED (RL-2026-05-041, audit risk #3). ProviderRunPoolProperties had ZERO
  # consumers — per-provider concurrency/queues were never enforced (no Semaphore in the dispatch
  # path). Deleted the dead binder + this config rather than imply a control that doesn't exist.
  # Real per-provider/tier concurrency limiting is scoped as a separate change (see
  # docs/reviews/audit-remediation-2026-05-26.md). Per-tier concurrent-run-limit (TierConfig) is
  # unrelated + retained.
  cost:
    credit-multiplier-usd: 5.0    # $5 of LLM compute per run credit
    estimation-buffer: 1.10        # 10% buffer on cost estimate for retry overhead
    budget-margin: 1.5             # Safety ceiling = credits × multiplier × margin (silent hard cap)
    max-credits-free: 1            # FREE tier: 1-credit specs only (blocks multi-credit runs)
    batch:
      enabled: true
      poll-interval-seconds: 30     # Polling interval for pending batch runs
      max-wait-hours: 4             # Max wait before timeout
      discount: 0.50                # Universal 50% batch discount
      max-output-token-multiplier: 1.5  # Batch tasks get 1.5x output tokens
      google-inline-task-limit: 10  # Google: inline <10 tasks, JSONL >=10
  github:
    default-owner: ""
  shell:
    sandbox-enabled: true
    timeout-seconds: 300
    path-prepend: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin"
    additional-allowed-commands: []
    additional-blocked-patterns: []
  recovery:
    enabled: true    # Re-enabled — Thread.join() timeout + act-threshold tuning prevent false positives
    warn-threshold-minutes: 8      # warn after 8 min idle (was 5 — too noisy)
    act-threshold-minutes: 15      # recover after 15 min idle (was 10 — align with maxTaskDurationMinutes)
    max-task-retries: 1
    evaluator-log-window: 20
    loop-repeat-threshold: 3
    require-restart-approval: false
    max-transient-retries: 3
    rate-limit-backoff-seconds: 30
    server-error-backoff-seconds: 10
    max-auto-restarts: 2           # reduced from 3 to limit cascading restarts
    auto-restart-backoff-seconds: 90  # increased from 60 — give more cooldown between restarts
    orphaned-run-threshold-minutes: 8  # increased from 5 — reduce false positives during slow builds
    auto-resume-on-startup: false  # Keep disabled — manual resume via UI to avoid surprise restarts
    startup-resume-delay-seconds: 30
    default-provider: anthropic
    capable-models:
      anthropic: claude-haiku-4-5-20251001
      openai: gpt-5.4
    alternate-provider:
      anthropic: openai
      openai: anthropic
  context:
    enabled: true
    # model: uses ModelConstants.HAIKU (Scout: text summarization)
    run-interval: 1
  optimiser:
    enabled: true
    run-interval: 10
    analysis-window-runs: 20
    failure-rate-threshold: 0.20
    pattern-min-occurrences: 2
    # model: uses ModelConstants.HAIKU (Scout: pattern analysis)
  deployment:
    enabled: true
    gcp-project: executespecv1
    gcp-region: us-east4
    artifact-registry:
      repository: executespec-dev-docker
      host: us-east4-docker.pkg.dev
    cloud-run:
      cpu: "1"
      memory: 512Mi
      max-instances: 1
      allow-unauthenticated: true
    ttl-days: 3
    cleanup-cron: "0 3 * * * *"
    docker:
      build-timeout-seconds: 300
    static-site:
      nginx-image: nginx:1.25-alpine
    spring-boot:
      base-image: eclipse-temurin:21-jre-alpine
    workspace:
      retention-days: 30
      gcs-bucket: executespec-workspaces
      archive-after-hours: 24
      gcs-enabled: false

  # ── Tier 8: Compile agent, API spec generator, frontend preview ──────────────
  compiler:
    enabled: true
    max-attempts: 3
    timeout-seconds: 300
    # model: uses ModelConstants.HAIKU (compiler error analysis)
  api-test-suite:
    enabled: true
    # model: uses ModelConstants.HAIKU (OpenAPI spec generation)

  preview:
    enabled: true

  # ── Tier 7: External Integrations (all disabled by default) ─────────────────
  integrations:
    enabled: true             # Master switch — set true to register /api/integrations/* endpoints
    jira:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      webhook-secret: ""
      trigger-status: "Ready for Coding"   # issue status name that fires the pipeline
      in-progress-status: "In Progress"    # transition to on run start (null = skip)
      in-review-status: "In Review"        # transition to on run complete (null = skip)
      reopen-status: "Backlog"             # transition to on run failed (null = skip)
      dashboard-url: http://localhost:8080
      skip-approval: false
    confluence:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      trigger-label: "agent-run"           # page label that fires the pipeline
      space-key: "KAN"                     # default space for child pages
      dashboard-url: http://localhost:8080
      skip-approval: false
    servicenow:
      enabled: false
      base-url: ""
      username: ""
      password: ""
      trigger-categories:
        - "application"
        - "database"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    pagerduty:
      enabled: false
      api-token: ""
      webhook-secret: ""
      from-email: ""        # required for PATCH requests
      trigger-types:
        - "incident.trigger"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    bitbucket:
      enabled: false
      # Credentials resolved from user table (per-user, configured via Integrations page)
      webhook-secret: ""
      dashboard-url: http://localhost:8080
      skip-approval: false
    slack:
      enabled: false
      client-id: ""
      client-secret: ""
      signing-secret: ""
      redirect-uri: http://localhost:8080/api/integrations/slack/oauth/callback
      dashboard-url: http://localhost:8080
  # 2026-05-02 — dependency-install security policy. Layered enforcement:
  #   LOW    (default for most installs today): legacy ShellSandboxPolicy allowlist only.
  #   MEDIUM: every JS install command (npm/bun/pnpm/yarn) MUST carry --ignore-scripts +
  #           lockfile-strict mode + must NOT pull from off-registry (git+, github tarball,
  #           http URL, file://). Worker LLM that omits these flags gets a clear error +
  #           retries with the right shape. Closes lifecycle-script RCE + lockfile-drift +
  #           off-registry typosquats.
  #   HIGH:   + audit step REQUIRED on the chained command (npm: --audit-level=high; bun /
  #           pnpm / yarn: separate audit subcommand chained via &&) + pre-release versions
  #           (alpha / beta / rc / canary / nightly) blocked + --registry= flag must point at
  #           an allowed registry. Closes known-CVE deps + supply-chain pre-release attacks
  #           + registry hijacks.
  # Active level resolves via the existing GuardrailLevelResolver feature flag (key:
  # "security.guardrail_level"). Each switch below is independently flippable so an org can
  # tighten one threat class without flipping the global guardrail.
  security:
    deps:
      require-ignore-scripts: ${AGENT_SECURITY_DEPS_IGNORE_SCRIPTS:true}
      require-lockfile: ${AGENT_SECURITY_DEPS_LOCKFILE:true}
      require-audit: ${AGENT_SECURITY_DEPS_AUDIT:true}
      allow-prerelease: ${AGENT_SECURITY_DEPS_PRERELEASE:false}
      allowed-registries: ${AGENT_SECURITY_DEPS_REGISTRIES:https://registry.npmjs.org,https://registry.bun.sh,https://registry.pnpm.io,https://registry.yarnpkg.com}
      # Supply-chain scanner config. NOTE (RL-2026-05-041): the SupplyChainScanner interface +
      # NoopSupplyChainScanner impl were removed as unwired dead code (advertised "defense layer"
      # with zero callers — it never ran). These keys remain only as a config hook for a future
      # real integration; the LIVE deps protection is the registry-allowlist + audit policy above.
      scanner:
        vendor: ${AGENT_SECURITY_DEPS_SCANNER_VENDOR:none}

# ── Preview ────────────────────────────────────────────────────────────────
preview:
  enabled: true
  mode: ${PREVIEW_MODE:docker}           # "docker" (Docker Compose, local), "cloud-run" (GCP Cloud Run), or "vm" (GCE VM)
  total-startup-timeout-seconds: 480   # 8-minute total deadline (Spring Boot cold builds need extra time)
  preview-ttl-minutes: 30             # auto-shutdown after 30 min (extended for PRODUCTION validation: 10-25 min)
  port-range-start: 10000              # Docker Compose host port range
  port-range-end: 10100
  preview-domain: executespec.ai       # single-level: preview-{id}.executespec.ai
  fallback-host: ""                    # e.g. "http://dev.executespec.ai" — used when Caddy proxy is disabled
  proxy:
    enabled: false                     # set true on GCE VM with Caddy installed
  concurrency:
    free-max: 1
    pro-max: 3
    enterprise-max: 10

  # ── Preview-engine handoff (external preview service) ──────────────────
  # When route-via=true AND mode=docker, main app builds + pushes the image
  # to the registry then hands off to preview-engine's /from-image endpoint.
  # preview-engine pulls + runs + owns the container for its lifetime.
  # Legacy docker-compose path stays the default.
  #
  # Flip route-via=false (or remove the block) to revert to the legacy path.
  engine:
    route-via: ${PREVIEW_ENGINE_ROUTE_VIA:true}
    base-url: ${PREVIEW_ENGINE_URL:http://localhost:8090}
    registry-url: ${PREVIEW_ENGINE_REGISTRY_URL:localhost:5500}
    api-key: ${PREVIEW_ENGINE_API_KEY:change-me-in-prod}
    timeout-seconds: 300

  vm:
    enabled: false                       # set true to enable VM-based preview deployment
    default-ttl-minutes: 20
    gateway:
      ip: ${PREVIEW_GATEWAY_IP:}
      internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
      user: ${PREVIEW_SSH_USER:ubuntu}
      ssh-key-path: ${PREVIEW_SSH_KEY_PATH:}
      vm-id: preview-gw
    vms:
      - id: preview-gw
        external-ip: ${PREVIEW_GATEWAY_IP:}
        internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
        max-concurrent: 10
        role: gateway
      # Add worker VMs when scaling:
      # - id: preview-worker-1
      #   external-ip: ${PREVIEW_W1_IP:}
      #   internal-ip: ${PREVIEW_W1_INTERNAL_IP:}
      #   max-concurrent: 10
      #   role: worker

app:
  security:
    csp:
      enabled: true
      # Override policy string per environment if needed
      # policy: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net ..."
    hsts:
      enabled: true
      max-age-seconds: 31536000
      include-sub-domains: true
    frame-options:
      enabled: true
      mode: SAMEORIGIN    # SAMEORIGIN allows preview iframes; DENY blocks all framing
  mail:
    # Transport: "smtp" (recommended for server) or "gmail-api" (OAuth, local dev)
    transport: smtp
    base-url: http://localhost:5173
    from: admin@executespec.ai
    # v2.6.0 — recipient for new-signup alerts + weekly admin summary
    admin-address: ${ADMIN_NOTIFICATION_EMAIL:admin@executespec.ai}
    # v2.6.0 — shared secret for /api/internal/reminder/send (remote-trigger hits this).
    # Leave blank in prod to disable the endpoint (returns 503).
    admin-reminder-token: ${ADMIN_REMINDER_TOKEN:}
    # ── SMTP config (used when transport=smtp) ──────────────────────────────
    smtp:
      host: smtp.gmail.com
      port: 587
      username: admin@executespec.ai
      password: ""                     # set via env var in profile files
    # ── Gmail API OAuth2 config (used when transport=gmail-api) ─────────────
    gmail-api:
      enabled: false
      credentials-path: credentials.json
      tokens-dir: ${user.home}/.executespec/gmail-tokens
      app-name: executespec
  contact:
    fallback-email: admin@executespec.ai
    jira:
      base-url: ${CONTACT_JIRA_BASE_URL:}
      email: ${CONTACT_JIRA_EMAIL:}
      api-token: ${CONTACT_JIRA_API_TOKEN:}
      project-key: ${CONTACT_JIRA_PROJECT_KEY:SUP}
      issue-type: Task
  jwt:
    secret: executespec-local-dev-secret-key-must-be-at-least-256-bits-long-for-HS256
    access-token-expiry-minutes: 360
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: http://localhost:5173
  # V143 product-routing config retired (V179, single-surface
  # retirement 2026-05-06). The dual app/build surface was the
  # consumer/B2B split that's no longer on the GA roadmap.
    app-return-url: ${APP_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
    build-return-url: ${BUILD_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
  tiers:
    free:
      monthly-run-limit: 5
      concurrent-run-limit: 1
    pro:
      monthly-run-limit: 100
      concurrent-run-limit: 3
    enterprise:
      monthly-run-limit: -1    # -1 = unlimited
      concurrent-run-limit: 10

executespec:
  designs:
    root-path: /opt/executespec/designs/design-md
    cache-ttl: 30m
    max-tokens: 2500
    default-style: vercel
    curated-styles:
      - airbnb
      - claude
      - figma
      - linear.app
      - notion
      - stripe
      - supabase
      - vercel
      - spotify
      - posthog
      - resend
      - mintlify

  # R-323 (D-125 #3) — repo-size gate enforced when a repo is attached.
  # GitHub returns repo `size` in KB (KiB-ish, but close enough for a
  # clone-time-budget heuristic). Default 250 MB ≈ 250 000 KB; ops can
  # bump this per environment without a redeploy. Per-tier overrides +
  # an opt-in bypass land with R-325 alongside the multi-repo work.
  repo:
    max-size-kb: ${EXECUTESPEC_REPO_MAX_SIZE_KB:250000}

  rate-limit:
    enabled: true

  crypto:
    enabled: false
    gcp-secret-name: projects/${GCP_PROJECT:executespecv1}/secrets/executespec-crypto-key/versions/latest
    local-key: ${CRYPTO_LOCAL_KEY:}  # Only for local dev — leave empty in prod

  validator:
    enabled: true
    per-task-validation: true
    per-task-level: TYPE
    project-validation-level: FULL
    max-retries: 3
    default-timeout: 30s

billing:
  terms-version: "2026-03-v1"
  # default-gateway: dev default is razorpay so local dev works without Stripe secrets.
  # In prod (application-prod.yml) we override to 'stripe' for US-first traffic.
  # Per-request routing still honours BillingEntity.paymentGateway; the default is the
  # tie-breaker when the entity has no preference + the currency has no map entry.
  default-gateway: ${BILLING_DEFAULT_GATEWAY:razorpay}
  founder-pricing:
    max-slots: 100
    discount-pct: 30
  stripe:
    enabled: false
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    enterprise-price-id: ${STRIPE_ENTERPRISE_PRICE_ID:}
    # v2.6.1 Wave 1 — TEAM tier per-seat pricing. Must be a Stripe Price with
    # per-unit pricing enabled (LineItem.setQuantity honours the seat count).
    # INR variant is optional; falls back to the monthly plan in database.
    team-price-id: ${STRIPE_TEAM_PRICE_ID:}
    team-price-id-inr: ${STRIPE_TEAM_PRICE_ID_INR:}
  razorpay:
    enabled: true
  currency-gateway-map:
    INR: RAZORPAY
    USD: STRIPE
    EUR: STRIPE
    GBP: STRIPE

logging:
  level:
    "[com.navneet.executespec]": INFO
    "[com.navneet.executespec.agent]": INFO
    "[com.navneet.executespec.compiler]": INFO
    "[com.navneet.executespec.reviewer]": INFO
    "[com.navneet.executespec.testgen]": INFO
    "[org.springframework.ai]": WARN
    "[org.springframework.ai.chat.client]": INFO
    "[io.opentelemetry]": WARN
    "[io.micrometer.tracing]": INFO

# ── Product analytics (Wave 2.1 — 6-event activation funnel) ──────────────────
# When posthog.api-key is blank, EventTrackingService is a no-op (safe for
# local dev). Prod: set POSTHOG_API_KEY + POSTHOG_HOST env vars.
# Full plan: docs/plans/activation-instrumentation-plan.md.
analytics:
  posthog:
    enabled: ${POSTHOG_ENABLED:false}
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://us.i.posthog.com}

# ── Observability (Actuator + OTel + Metrics) ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: false
        endpoint: http://localhost:4318/v1/metrics
        step: 60s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request.duration: true
        spring.ai.chat.client.duration: true
      minimum-expected-value:
        http.server.request.duration: 1ms
      maximum-expected-value:
        http.server.request.duration: 30s
    tags:
      application: executespec
      environment: local

---
# ── Local profile: silence the OTLP exporter loop ────────────────────────────
# Audit r5 (P1-6, 2026-05-06) — without these overrides, the JVM ships
# every span to http://localhost:4318/v1/traces (the path inherited from
# the base management.otlp.tracing.endpoint above). When no Tempo / Otel
# collector is running locally — the default — the exporter retries
# every 5–30s indefinitely, logs a stack trace per attempt, and (in
# extreme cases like the 2026-05-06 product-review walk-through) piled
# up enough off-heap pressure to kill the JVM silently mid-session.
# Local dev does not need traces shipped anywhere; flip the exporters
# off so `mvn spring-boot:run -Dspring-boot.run.profiles=local` is
# quiet by default. To turn them back on, run with `--spring.profiles
# .active=local,observability` after starting the local Grafana stack
# via `cd observability && docker compose up -d`. Lives in the base
# application.yml (not application-local.yml) because that file is
# .gitignored — every developer needs this default, not just whoever
# happens to set it locally.
spring:
  config:
    activate:
      on-profile: local
management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

---
# ── GCP profile: use Cloud Trace + Cloud Monitoring instead of OTLP/Prometheus ─
spring:
  config:
    activate:
      on-profile: gcp

  threads:
    virtual:
      enabled: true
management:
  otlp:
    tracing:
      enabled: false
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false
