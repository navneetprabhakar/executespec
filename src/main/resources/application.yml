# ══════════════════════════════════════════════════════════════════════════════
# ExecuteSpec — Base configuration (local development)
# ══════════════════════════════════════════════════════════════════════════════
# This file contains hardcoded LOCAL defaults. No environment variables needed.
# All ${VAR} references live in profile-specific files:
#   application-dev.yml   → dev VM (GCE)     — activate with: --spring.profiles.active=dev
#   application-prod.yml  → production (GCE) — activate with: --spring.profiles.active=prod
# Health check: GET /api/health (custom HealthController — no actuator dependency)

spring:
  application:
    name: executespec
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          min-idle: 5
          test-on-borrow: true
          test-while-idle: true

  datasource:
    url: jdbc:postgresql://localhost:5432/executespec
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30          # reduced — 80 exceeded PG max_connections on dev VM
      minimum-idle: 5                # keep warm connections ready
      connection-timeout: 10000      # 10s — fail fast instead of 30s default blocking
      idle-timeout: 120000           # 2 min — reclaim idle connections faster
      max-lifetime: 600000           # 10 min — rotate connections before DB-side timeouts
      validation-timeout: 3000       # 3s — quick validation for health checks
      # v2.6.1 — bumped 60s → 90s. Async apply-suggestion dispatch (see
      # RunConversationController.applyExecutor) means the worker loop no
      # longer pins a connection, but short JPA reads inside the loop
      # (runRepo.findById, etc.) can still brush up against 60s under p99
      # slow-query conditions. 90s reduces false positives while still
      # flagging real leaks early.
      leak-detection-threshold: 90000
  mvc:
    async:
      # v2.6.1 — 15 min. The apply-suggestion endpoint dispatches async
      # (CompletableFuture) and the worker can burn up to ~25 iterations ×
      # ~20 s/Sonnet call = ~8 min in the worst case. Default Tomcat
      # async timeout (30 s) would cancel these before they finish.
      request-timeout: 900000
  jpa:
    # v2.6.1 — OSIV flipped OFF after audit (2026-04-25). It was enabled in
    # v2.5.1 to silence lazy-init crashes in execution + project view
    # controllers, but a code-walk showed every concerning lazy walk is now
    # covered by either entity-level FetchType.EAGER (ExecutionSolution
    # dependencies + repoMappings) or @EntityGraph queries
    # (ExecutionRunRepository.findListByProjectId / findDetailById +
    # ExecutionSolutionRepository.findWith*) — and the DTO-walk endpoints
    # in ProjectLaunchController are wrapped in @Transactional(readOnly=true).
    # OSIV's session-scoped EM was the last reason connections were held
    # across long async work (chat /apply); turning it off pairs with the
    # connection.handling_mode change to release each connection at tx commit.
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate        # Hibernate only validates — Flyway manages all schema
    show-sql: false
    properties:
      hibernate:
        connection:
          # v2.6.1 — release the JDBC connection back to Hikari on every tx
          # commit instead of holding it for the whole EM lifetime. Without
          # this, OSIV's request-scoped session pins the connection from the
          # first @Transactional read (e.g. guard.requireRunAccess → findRun)
          # until the request completes — on async endpoints like
          # /runs/{id}/apply that's the full worker loop (~1-8 min). Trade-off:
          # lazy-loads outside an explicit tx re-acquire a connection per
          # query (Hikari handles the churn fine at pool-size 30).
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  flyway:
    enabled: true
    baseline-on-migrate: true   # Safe for existing databases
    baseline-version: 0         # Baseline before V1
    locations: classpath:db/migration
    # v2.6.0 — V119 was `preview_platform_v2_schema.sql` on Apr 19 when dev/prod
    # DBs were migrated. That file belonged to preview-engine; when preview-engine
    # moved to its own repo (commit cdc26e11), the SQL was removed from this tree
    # but the DB still has the row. The rename_provider_google_to_gemini migration
    # originally conflicted as V119; we renamed it V120 (see V120__*) to dodge
    # the collision.
    #
    # Flyway's ignore-migration-patterns syntax is "<type>:<state>". Two hard
    # constraints tripped me up:
    #   1. type MUST be `*`, `repeatable`, or `versioned` — NOT a version number.
    #      (My earlier "119:missing" crashed boot with "Invalid migration
    #      type '119'". See commit 3faa2f13.)
    #   2. `repeatable` + `versioned` are Flyway Redgate (paid) Edition features.
    #      The OSS edition we use (via spring-boot-starter) only accepts `*`.
    #      (My follow-up "versioned:missing" crashed boot with
    #      "Flyway Redgate Edition Required". Caught by local-boot test, not CI.)
    #
    # Final pattern: `*:missing` — tolerate any applied-but-missing migration.
    # This covers the V119 orphan from the preview-engine repo split (V119 was
    # `preview_platform_v2_schema.sql` when preview-engine shared this DB; it
    # moved to its own repo at cdc26e11, but dev + prod DBs still have the row).
    # The rename_provider_google_to_gemini migration originally conflicted as
    # V119; we renamed it V120 to dodge the collision.
    #
    # Safety trade-off: we lose automatic detection of *any* missing migration
    # (versioned or repeatable). Mitigation: PR review is mandatory on any
    # change under src/main/resources/db/migration/*.sql.
    #
    # Exit strategy: once dev + prod DBs are rebuilt, or we run a targeted
    # `flyway repair` to drop the orphan V119 row from flyway_schema_history,
    # remove this line to restore the full missing-migration safety net.
    ignore-migration-patterns: "*:missing"

  # ── OAuth2 Login (Google + GitHub) ──────────────────────────────────────────
  # Set GOOGLE_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_ID env vars to enable.
  # When unset, OAuth2 auto-config is excluded (see SecurityConfig).

  ai:
    retry:
      max-attempts: 3               # down from default 10 — LlmRouter handles its own fallback chain
      backoff:
        initial-interval: 2000      # 2s
        multiplier: 2               # 2s → 4s → 8s (total ~14s vs default ~23 min)
        max-interval: 10000         # 10s cap
    anthropic:
      api-key: ""                   # set via env var in profile files
      chat:
        options:
          model: claude-haiku-4-5-20251001  # budget default; worker tasks override via assigned_model
          max-tokens: 16384                  # Haiku default; per-call limits applied by TokenBudgetMonitor
    openai:
      api-key: ""                   # set via env var in profile files
      chat:
        options:
          model: gpt-5.4-mini
          max-tokens: 16384                  # gpt-5.4 max; per-call limits applied by TokenBudgetMonitor
    google:
      genai:
        api-key: ""                 # set via env var in profile files
        chat:
          options:
            model: gemini-2.5-flash          # default; all tiers use gemini-2.5-flash

# ── Model Matrix (user-selected provider × agent tier → model) ────────────────
model-matrix:
  providers:
    anthropic:
      planning: claude-sonnet-4-6
      # 2026-04-19 — bumped workhorse from haiku-4.5 to sonnet-4.6 for better
      # code quality on MEDIUM tasks. Higher $/call but planner classifies most
      # tasks as LOW (lightweight stays haiku) so net cost rise is modest.
      workhorse: claude-sonnet-4-6
      lightweight: claude-haiku-4-5-20251001
    gemini:
      # v2.5.9 Bug #3 — gemini-2.5-flash emits Python-style tool calls
      # ("print(default_api.submitPlan(...))") causing MALFORMED_FUNCTION_CALL.
      # gemini-3-flash-preview is the newer tool-call-reliable model.
      #
      # 2026-05-04 — eval-matrix data showed Gemini was 3.5-4× slower than
      # Anthropic/OpenAI on the medium band (1049s vs 295s/225s) when ALL
      # tiers were on flash. Bumping PLANNING + WORKHORSE to gemini-3-pro-
      # preview to match the strength of Anthropic Sonnet / OpenAI gpt-5.4
      # in those tiers; LIGHTWEIGHT stays on flash since LOW-band scaffolds
      # don't benefit from Pro and the cost/speed trade-off favours flash
      # for plumbing tasks. Pro is ~6-8× per-token vs flash; medium-band
      # runs jump from ~$0.10 to ~$0.70 — still cheaper than equivalent
      # Anthropic Sonnet runs.
      #
      # NOTE: gemini-3-pro is preview-only as of 2026-05-04. Codebase was
      # already on gemini-3-flash-preview so the preview-tier risk envelope
      # is unchanged. Stable fallback would be gemini-2.5-pro (older
      # generation but no preview suffix).
      planning: gemini-3-pro-preview
      workhorse: gemini-3-pro-preview
      lightweight: gemini-3-flash-preview
    openai:
      planning: gpt-5.4
      workhorse: gpt-5.4-mini
      lightweight: gpt-5.4-mini

  # ── Canonical model registry (single source of truth for all model metadata) ──
  models:
    claude-opus-4-6:
      provider: anthropic
      chain-tier: ARCHITECT
      context-limit: 200000
      max-output-tokens: 32000
      pricing:
        input-per-1m: 5.00
        cached-input-per-1m: 0.50
        output-per-1m: 25.00
      notes: "Reserved for escalation."
    claude-sonnet-4-6:
      provider: anthropic
      chain-tier: CAPABLE
      context-limit: 200000
      max-output-tokens: 64000
      pricing:
        input-per-1m: 3.00
        cached-input-per-1m: 0.30
        output-per-1m: 15.00
      notes: "PLANNING + WORKHORSE tiers for Anthropic."
    claude-haiku-4-5-20251001:
      provider: anthropic
      chain-tier: UTILITY
      context-limit: 200000
      max-output-tokens: 8192
      pricing:
        input-per-1m: 1.00
        cached-input-per-1m: 0.10
        output-per-1m: 5.00
      notes: "LIGHTWEIGHT tier for Anthropic."
    "[gemini-2.5-flash]":
      provider: gemini
      chain-tier: UTILITY
      context-limit: 1048576
      max-output-tokens: 65536
      pricing:
        input-per-1m: 0.30
        cached-input-per-1m: 0.03
        output-per-1m: 2.50
      notes: "Gemini 2.5 Flash — legacy, replaced by gemini-3-flash-preview for all tiers."
    "[gemini-3-flash-preview]":
      provider: gemini
      chain-tier: CAPABLE
      context-limit: 1048576
      max-output-tokens: 65536
      pricing:
        input-per-1m: 0.50
        # 2026-05-06 — Gemini context-cache reads are billed at 25% of input rate per
        # Vertex AI pricing (https://cloud.google.com/vertex-ai/generative-ai/pricing).
        # Prior value 0.05 (10%) was wrong and was being overridden by a hardcoded
        # 0.25 multiplier inside RunCostTracker. After the 2026-05-06 consolidation
        # YAML is the only knob; updating to the real rate restores cost accuracy.
        cached-input-per-1m: 0.125
        output-per-1m: 3.00
      notes: "Gemini 3 Flash Preview — LIGHTWEIGHT tier for Google (LOW-band scaffolds)."
    "[gemini-3-pro-preview]":
      provider: gemini
      chain-tier: ARCHITECT
      context-limit: 1048576
      max-output-tokens: 65536
      pricing:
        # 2026-05-04 — Pro pricing per Google AI list (~6-8× flash). Verified
        # on https://ai.google.dev/gemini-api/docs/pricing (preview tier).
        input-per-1m: 3.50
        # 2026-05-06 — 25% of input per Vertex AI cached-read rate.
        cached-input-per-1m: 0.875
        output-per-1m: 21.00
      notes: "Gemini 3 Pro Preview — PLANNING + WORKHORSE tier for Google (medium/high band)."
    "[gpt-5.4]":
      provider: openai
      chain-tier: CAPABLE
      context-limit: 200000
      max-output-tokens: 16384
      pricing:
        input-per-1m: 2.50
        # 2026-05-06 — OpenAI prompt caching bills cached_tokens at 50% of input rate
        # for the gpt-4o / gpt-5.x family (https://platform.openai.com/docs/guides/prompt-caching).
        # The o1 / o3 reasoning family is 25% but those aren't in the matrix today.
        # Prior value 0.25 (10%) was wrong and was being overridden by a hardcoded
        # 0.50 multiplier inside RunCostTracker — fixed after the 2026-05-06 consolidation.
        cached-input-per-1m: 1.25
        output-per-1m: 15.00
      notes: "All tiers for OpenAI (PLANNING + WORKHORSE + LIGHTWEIGHT)."
    "[gpt-5.4-mini]":
      provider: openai
      chain-tier: UTILITY
      context-limit: 200000
      max-output-tokens: 16384
      pricing:
        input-per-1m: 0.75
        # 2026-05-06 — 50% of input per gpt-5.x family rate (see gpt-5.4 above).
        cached-input-per-1m: 0.375
        output-per-1m: 4.50
      notes: "Legacy — replaced by gpt-5.4 for all tiers. Retained for backward compat."

  # ── Legacy model name aliases (for in-flight runs and DB backward compat) ─────
  legacy-aliases:
    claude-opus-4-5: claude-opus-4-6
    claude-sonnet-4-5: claude-sonnet-4-6
    claude-haiku-4-5: claude-haiku-4-5-20251001
    gpt-4o: gpt-5.4
    gpt-4o-mini: gpt-5.4-mini
    gemini-3-flash: gemini-3-flash-preview
    gemini-3.1-pro-preview: gemini-3-flash-preview

  # ── Fallback chains by tier (replaces hardcoded LlmRouter chains) ─────────────
  fallback-chains:
    ARCHITECT:
      - { provider: anthropic, model: claude-opus-4-6 }
      - { provider: openai, model: gpt-5.4 }
      - { provider: gemini, model: gemini-3-pro-preview }
    CAPABLE:
      - { provider: anthropic, model: claude-sonnet-4-6 }
      - { provider: openai, model: gpt-5.4 }
      - { provider: gemini, model: gemini-3-pro-preview }
    UTILITY:
      - { provider: anthropic, model: claude-haiku-4-5-20251001 }
      - { provider: gemini, model: gemini-3-flash-preview }
      - { provider: openai, model: gpt-5.4 }

  # ── FREE tier model lock ──────────────────────────────────────────────────────
  free-tier:
    provider: openai
    model: gpt-5.4-mini

  agent-tier-map:
    # V2 agents
    OutlinePlannerAgent: PLANNING           # v2.6.2 hierarchical-planner phase 1
    TaskExpanderAgent: WORKHORSE            # v2.6.2 hierarchical-planner phase 2 (parallel)
    CoherencePlannerAgent: LIGHTWEIGHT      # v2.6.2 hierarchical-planner phase 3
    ReviewerAgentV3: PLANNING
    SmartClassifierAgent: LIGHTWEIGHT       # v2.6.2 hierarchical-planner phase 0
    WorkerAgent: WORKHORSE
    # Shared non-tool-calling agents (use LlmRouter)
    TestPlannerAgent: WORKHORSE
    TestWorkerAgent: WORKHORSE
    ApiTestSuiteAgent: WORKHORSE
    ContextAgent: LIGHTWEIGHT
    RunLedgerAgent: LIGHTWEIGHT
    RunTitleSummarizer: LIGHTWEIGHT
    ProjectChatCompiler: PLANNING
    ProjectChatCompactor: LIGHTWEIGHT       # v2.6.1 — chat history compaction
    ProjectBriefService: LIGHTWEIGHT
    # v2.5.12 — 3-step architecture pipeline (bumped to PLANNING v2.6.1 — Haiku/WORKHORSE missed cross-repo wiring and mangled spec compilation)
    RepoArchitectureGenerator: PLANNING      # per-repo HLD+LLD from codemap
    ArchitectureDocGenerator: PLANNING       # cross-repo synthesis from per-repo docs
    ProjectDocGeneratorService: WORKHORSE    # EXPLANATION / SETUP docs
    ConversationAgent: LIGHTWEIGHT
    PromptOptimiserAgent: WORKHORSE
    TestReportGenerator: LIGHTWEIGHT
    ValidationReportGenerator: WORKHORSE
    # v2.6.4 — PR review + code review agents. Both PLANNING because review-class
    # quality is the whole point; cost is amortised across a single review per PR
    # (PR Review) or a single scan per repo (Code Review LLM augmentation pass).
    PrReviewAgent: PLANNING
    CodeReviewAgent: PLANNING
  failover-order:
    # v2.6.0 — was `google`; enum was renamed GOOGLE → GEMINI in v2.5.13 but
    # this yaml list was missed. `ModelResolver.selectAdaptiveProvider` calls
    # `LlmProvider.valueOf(name.toUpperCase())` on each list entry and crashed
    # the planner with "No enum constant LlmProvider.GOOGLE". See memory rule
    # feedback_v2_provider_naming.md: "V2 uses 'gemini' not 'google'".
    anthropic:
      - openai
      - gemini
    gemini:
      - openai
      - anthropic
    openai:
      - gemini
      - anthropic

agent:
  workspace: ./workspace
  roles:
    planner: anthropic
    worker: anthropic
    reviewer: anthropic
  token-budget:
    max-tokens: 64000        # Fallback ceiling for hard-ceiling-pct calculation
    hard-ceiling-pct: 0.90   # 90% of model max — absolute max, forces FORCE_REPORT
    # Output ceilings are fixed in TokenBudgetMonitor (LOW=8K, MED=12K, HIGH=16K)
  compaction:
    warn-pct: 0.45     # warn at 90k tokens input (balanced: was 0.25=50k too early, 0.65=130k too late)
    compact-pct: 0.60  # compact at 120k tokens input (balanced: was 0.35=70k too frequent, 0.75=150k too late)
    hard-stop-pct: 0.80 # hard-stop at 160k (balanced: was 0.55=110k too conservative, 0.90=180k too late)
  triage:
    enabled: true    # Phase 1: Single-shot fast path — set false to route all requests through planner
  concurrency:
    max-runs: 50   # Temporarily increased for load testing (was 10)
    max-task-duration-minutes: 25  # Increased for HIGH complexity tasks (was 15)
    safety-iteration-cap: 500     # Hard iteration cap — pure safety net, should never trigger
    task-max-retries: 3           # Auto-retry failed tasks/subtasks up to 3 times before marking FAILED
  provider-pools:
    default-concurrency: 3        # Per-provider concurrent run limit (default for any unspecified provider)
    default-queue-capacity: 10    # Max runs waiting per provider before HTTP 429
    providers:
      ANTHROPIC:
        concurrency: 3
        queue-capacity: 15        # Slightly larger — Anthropic is primary/premium provider
      GEMINI:                     # v2.6.0 — renamed from GOOGLE to match LlmProvider enum.
        concurrency: 3            # ProviderRunPoolProperties.forProvider(LlmProvider) does
        queue-capacity: 10        # providers.get(provider.name()) — GOOGLE key never matched,
      OPENAI:                     # silently fell back to defaults. Now functional.
        concurrency: 3
        queue-capacity: 10
  cost:
    credit-multiplier-usd: 5.0    # $5 of LLM compute per run credit
    estimation-buffer: 1.10        # 10% buffer on cost estimate for retry overhead
    budget-margin: 1.5             # Safety ceiling = credits × multiplier × margin (silent hard cap)
    max-credits-free: 1            # FREE tier: 1-credit specs only (blocks multi-credit runs)
    batch:
      enabled: true
      poll-interval-seconds: 30     # Polling interval for pending batch runs
      max-wait-hours: 4             # Max wait before timeout
      discount: 0.50                # Universal 50% batch discount
      max-output-token-multiplier: 1.5  # Batch tasks get 1.5x output tokens
      google-inline-task-limit: 10  # Google: inline <10 tasks, JSONL >=10
  github:
    pat: ""
    default-owner: ""
  shell:
    sandbox-enabled: true
    timeout-seconds: 300
    path-prepend: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin"
    additional-allowed-commands: []
    additional-blocked-patterns: []
  recovery:
    enabled: true    # Re-enabled — Thread.join() timeout + act-threshold tuning prevent false positives
    warn-threshold-minutes: 8      # warn after 8 min idle (was 5 — too noisy)
    act-threshold-minutes: 15      # recover after 15 min idle (was 10 — align with maxTaskDurationMinutes)
    max-task-retries: 1
    evaluator-log-window: 20
    loop-repeat-threshold: 3
    require-restart-approval: false
    max-transient-retries: 3
    rate-limit-backoff-seconds: 30
    server-error-backoff-seconds: 10
    max-auto-restarts: 2           # reduced from 3 to limit cascading restarts
    auto-restart-backoff-seconds: 90  # increased from 60 — give more cooldown between restarts
    orphaned-run-threshold-minutes: 8  # increased from 5 — reduce false positives during slow builds
    auto-resume-on-startup: false  # Keep disabled — manual resume via UI to avoid surprise restarts
    startup-resume-delay-seconds: 30
    default-provider: anthropic
    capable-models:
      anthropic: claude-haiku-4-5-20251001
      openai: gpt-5.4
    alternate-provider:
      anthropic: openai
      openai: anthropic
  context:
    enabled: true
    # model: uses ModelConstants.HAIKU (Scout: text summarization)
    run-interval: 1
  optimiser:
    enabled: true
    run-interval: 10
    analysis-window-runs: 20
    failure-rate-threshold: 0.20
    pattern-min-occurrences: 2
    # model: uses ModelConstants.HAIKU (Scout: pattern analysis)
  deployment:
    enabled: true
    gcp-project: executespecv1
    gcp-region: us-east4
    artifact-registry:
      repository: executespec-dev-docker
      host: us-east4-docker.pkg.dev
    cloud-run:
      cpu: "1"
      memory: 512Mi
      max-instances: 1
      allow-unauthenticated: true
    ttl-days: 3
    cleanup-cron: "0 3 * * * *"
    docker:
      build-timeout-seconds: 300
    static-site:
      nginx-image: nginx:1.25-alpine
    spring-boot:
      base-image: eclipse-temurin:21-jre-alpine
    workspace:
      retention-days: 30
      gcs-bucket: executespec-workspaces
      archive-after-hours: 24
      gcs-enabled: false

  # ── Tier 8: Compile agent, API spec generator, frontend preview ──────────────
  compiler:
    enabled: true
    max-attempts: 3
    timeout-seconds: 300
    # model: uses ModelConstants.HAIKU (compiler error analysis)
  api-test-suite:
    enabled: true
    # model: uses ModelConstants.HAIKU (OpenAPI spec generation)

  preview:
    enabled: true

  # ── Tier 7: External Integrations (all disabled by default) ─────────────────
  integrations:
    enabled: true             # Master switch — set true to register /api/integrations/* endpoints
    jira:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      webhook-secret: ""
      trigger-status: "Ready for Coding"   # issue status name that fires the pipeline
      in-progress-status: "In Progress"    # transition to on run start (null = skip)
      in-review-status: "In Review"        # transition to on run complete (null = skip)
      reopen-status: "Backlog"             # transition to on run failed (null = skip)
      dashboard-url: http://localhost:8080
      skip-approval: false
    confluence:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      trigger-label: "agent-run"           # page label that fires the pipeline
      space-key: "KAN"                     # default space for child pages
      dashboard-url: http://localhost:8080
      skip-approval: false
    servicenow:
      enabled: false
      base-url: ""
      username: ""
      password: ""
      trigger-categories:
        - "application"
        - "database"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    pagerduty:
      enabled: false
      api-token: ""
      webhook-secret: ""
      from-email: ""        # required for PATCH requests
      trigger-types:
        - "incident.trigger"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    bitbucket:
      enabled: false
      # Credentials resolved from user table (per-user, configured via Integrations page)
      webhook-secret: ""
      dashboard-url: http://localhost:8080
      skip-approval: false
    slack:
      enabled: false
      client-id: ""
      client-secret: ""
      signing-secret: ""
      redirect-uri: http://localhost:8080/api/integrations/slack/oauth/callback
      dashboard-url: http://localhost:8080
  # 2026-05-02 — dependency-install security policy. Layered enforcement:
  #   LOW    (default for most installs today): legacy ShellSandboxPolicy allowlist only.
  #   MEDIUM: every JS install command (npm/bun/pnpm/yarn) MUST carry --ignore-scripts +
  #           lockfile-strict mode + must NOT pull from off-registry (git+, github tarball,
  #           http URL, file://). Worker LLM that omits these flags gets a clear error +
  #           retries with the right shape. Closes lifecycle-script RCE + lockfile-drift +
  #           off-registry typosquats.
  #   HIGH:   + audit step REQUIRED on the chained command (npm: --audit-level=high; bun /
  #           pnpm / yarn: separate audit subcommand chained via &&) + pre-release versions
  #           (alpha / beta / rc / canary / nightly) blocked + --registry= flag must point at
  #           an allowed registry. Closes known-CVE deps + supply-chain pre-release attacks
  #           + registry hijacks.
  # Active level resolves via the existing GuardrailLevelResolver feature flag (key:
  # "security.guardrail_level"). Each switch below is independently flippable so an org can
  # tighten one threat class without flipping the global guardrail.
  security:
    deps:
      require-ignore-scripts: ${AGENT_SECURITY_DEPS_IGNORE_SCRIPTS:true}
      require-lockfile: ${AGENT_SECURITY_DEPS_LOCKFILE:true}
      require-audit: ${AGENT_SECURITY_DEPS_AUDIT:true}
      allow-prerelease: ${AGENT_SECURITY_DEPS_PRERELEASE:false}
      allowed-registries: ${AGENT_SECURITY_DEPS_REGISTRIES:https://registry.npmjs.org,https://registry.bun.sh,https://registry.pnpm.io,https://registry.yarnpkg.com}
      # Vendor-neutral supply-chain scanner (Socket.dev / Snyk / Phylum / Sonatype). Default
      # binding is NoopSupplyChainScanner — wire a real one as a Spring bean to enable.
      scanner:
        vendor: ${AGENT_SECURITY_DEPS_SCANNER_VENDOR:none}

# ── Preview ────────────────────────────────────────────────────────────────
preview:
  enabled: true
  mode: ${PREVIEW_MODE:docker}           # "docker" (Docker Compose, local), "cloud-run" (GCP Cloud Run), or "vm" (GCE VM)
  total-startup-timeout-seconds: 480   # 8-minute total deadline (Spring Boot cold builds need extra time)
  preview-ttl-minutes: 30             # auto-shutdown after 30 min (extended for PRODUCTION validation: 10-25 min)
  port-range-start: 10000              # Docker Compose host port range
  port-range-end: 10100
  preview-domain: executespec.ai       # single-level: preview-{id}.executespec.ai
  fallback-host: ""                    # e.g. "http://dev.executespec.ai" — used when Caddy proxy is disabled
  proxy:
    enabled: false                     # set true on GCE VM with Caddy installed
  concurrency:
    free-max: 1
    pro-max: 3
    enterprise-max: 10

  # ── Preview-engine handoff (external preview service) ──────────────────
  # When route-via=true AND mode=docker, main app builds + pushes the image
  # to the registry then hands off to preview-engine's /from-image endpoint.
  # preview-engine pulls + runs + owns the container for its lifetime.
  # Legacy docker-compose path stays the default.
  #
  # Flip route-via=false (or remove the block) to revert to the legacy path.
  engine:
    route-via: ${PREVIEW_ENGINE_ROUTE_VIA:true}
    base-url: ${PREVIEW_ENGINE_URL:http://localhost:8090}
    registry-url: ${PREVIEW_ENGINE_REGISTRY_URL:localhost:5500}
    api-key: ${PREVIEW_ENGINE_API_KEY:change-me-in-prod}
    timeout-seconds: 300

  vm:
    enabled: false                       # set true to enable VM-based preview deployment
    default-ttl-minutes: 20
    gateway:
      ip: ${PREVIEW_GATEWAY_IP:}
      internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
      user: ${PREVIEW_SSH_USER:ubuntu}
      ssh-key-path: ${PREVIEW_SSH_KEY_PATH:}
      vm-id: preview-gw
    vms:
      - id: preview-gw
        external-ip: ${PREVIEW_GATEWAY_IP:}
        internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
        max-concurrent: 10
        role: gateway
      # Add worker VMs when scaling:
      # - id: preview-worker-1
      #   external-ip: ${PREVIEW_W1_IP:}
      #   internal-ip: ${PREVIEW_W1_INTERNAL_IP:}
      #   max-concurrent: 10
      #   role: worker

app:
  security:
    csp:
      enabled: true
      # Override policy string per environment if needed
      # policy: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net ..."
    hsts:
      enabled: true
      max-age-seconds: 31536000
      include-sub-domains: true
    frame-options:
      enabled: true
      mode: SAMEORIGIN    # SAMEORIGIN allows preview iframes; DENY blocks all framing
  mail:
    # Transport: "smtp" (recommended for server) or "gmail-api" (OAuth, local dev)
    transport: smtp
    base-url: http://localhost:5173
    from: admin@executespec.ai
    # v2.6.0 — recipient for new-signup alerts + weekly admin summary
    admin-address: ${ADMIN_NOTIFICATION_EMAIL:admin@executespec.ai}
    # v2.6.0 — shared secret for /api/internal/reminder/send (remote-trigger hits this).
    # Leave blank in prod to disable the endpoint (returns 503).
    admin-reminder-token: ${ADMIN_REMINDER_TOKEN:}
    # ── SMTP config (used when transport=smtp) ──────────────────────────────
    smtp:
      host: smtp.gmail.com
      port: 587
      username: admin@executespec.ai
      password: ""                     # set via env var in profile files
    # ── Gmail API OAuth2 config (used when transport=gmail-api) ─────────────
    gmail-api:
      enabled: false
      credentials-path: credentials.json
      tokens-dir: ${user.home}/.executespec/gmail-tokens
      app-name: executespec
  contact:
    fallback-email: admin@executespec.ai
    jira:
      base-url: ${CONTACT_JIRA_BASE_URL:}
      email: ${CONTACT_JIRA_EMAIL:}
      api-token: ${CONTACT_JIRA_API_TOKEN:}
      project-key: ${CONTACT_JIRA_PROJECT_KEY:SUP}
      issue-type: Task
  jwt:
    secret: executespec-local-dev-secret-key-must-be-at-least-256-bits-long-for-HS256
    access-token-expiry-minutes: 360
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: http://localhost:5173
  product-routing:
    # Localhost defaults for the OAuth surface bridge. Both surfaces
    # collapse to the same dev frontend on :5173 because we don't run
    # multiple frontends locally. dev/prod profiles override with their
    # real subdomains. Without this block, OAuthSurfaceResolver falls
    # back to its hardcoded prod @Value defaults
    # (https://build.executespec.ai/...) and Google login on localhost
    # lands on production.
    app-origin: ${APP_SURFACE_ORIGIN:http://localhost:5173}
    build-origin: ${BUILD_SURFACE_ORIGIN:http://localhost:5173}
    app-return-url: ${APP_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
    build-return-url: ${BUILD_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
  tiers:
    free:
      monthly-run-limit: 5
      concurrent-run-limit: 1
    pro:
      monthly-run-limit: 100
      concurrent-run-limit: 3
    enterprise:
      monthly-run-limit: -1    # -1 = unlimited
      concurrent-run-limit: 10

executespec:
  designs:
    root-path: /opt/executespec/designs/design-md
    cache-ttl: 30m
    max-tokens: 2500
    default-style: vercel
    curated-styles:
      - airbnb
      - claude
      - figma
      - linear.app
      - notion
      - stripe
      - supabase
      - vercel
      - spotify
      - posthog
      - resend
      - mintlify

  # R-323 (D-125 #3) — repo-size gate enforced when a repo is attached.
  # GitHub returns repo `size` in KB (KiB-ish, but close enough for a
  # clone-time-budget heuristic). Default 250 MB ≈ 250 000 KB; ops can
  # bump this per environment without a redeploy. Per-tier overrides +
  # an opt-in bypass land with R-325 alongside the multi-repo work.
  repo:
    max-size-kb: ${EXECUTESPEC_REPO_MAX_SIZE_KB:250000}

  rate-limit:
    enabled: true

  crypto:
    enabled: false
    gcp-secret-name: projects/${GCP_PROJECT:executespecv1}/secrets/executespec-crypto-key/versions/latest
    local-key: ${CRYPTO_LOCAL_KEY:}  # Only for local dev — leave empty in prod

  validator:
    enabled: true
    per-task-validation: true
    per-task-level: TYPE
    project-validation-level: FULL
    max-retries: 3
    default-timeout: 30s

billing:
  terms-version: "2026-03-v1"
  # default-gateway: dev default is razorpay so local dev works without Stripe secrets.
  # In prod (application-prod.yml) we override to 'stripe' for US-first traffic.
  # Per-request routing still honours BillingEntity.paymentGateway; the default is the
  # tie-breaker when the entity has no preference + the currency has no map entry.
  default-gateway: ${BILLING_DEFAULT_GATEWAY:razorpay}
  founder-pricing:
    max-slots: 100
    discount-pct: 30
  stripe:
    enabled: false
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    enterprise-price-id: ${STRIPE_ENTERPRISE_PRICE_ID:}
    # v2.6.1 Wave 1 — TEAM tier per-seat pricing. Must be a Stripe Price with
    # per-unit pricing enabled (LineItem.setQuantity honours the seat count).
    # INR variant is optional; falls back to the monthly plan in database.
    team-price-id: ${STRIPE_TEAM_PRICE_ID:}
    team-price-id-inr: ${STRIPE_TEAM_PRICE_ID_INR:}
  razorpay:
    enabled: true
  currency-gateway-map:
    INR: RAZORPAY
    USD: STRIPE
    EUR: STRIPE
    GBP: STRIPE

logging:
  level:
    "[com.navneet.executespec]": INFO
    "[com.navneet.executespec.agent]": INFO
    "[com.navneet.executespec.compiler]": INFO
    "[com.navneet.executespec.reviewer]": INFO
    "[com.navneet.executespec.testgen]": INFO
    "[org.springframework.ai]": WARN
    "[org.springframework.ai.chat.client]": INFO
    "[io.opentelemetry]": WARN
    "[io.micrometer.tracing]": INFO

# ── Product analytics (Wave 2.1 — 6-event activation funnel) ──────────────────
# When posthog.api-key is blank, EventTrackingService is a no-op (safe for
# local dev). Prod: set POSTHOG_API_KEY + POSTHOG_HOST env vars.
# Full plan: docs/plans/activation-instrumentation-plan.md.
analytics:
  posthog:
    enabled: ${POSTHOG_ENABLED:false}
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://us.i.posthog.com}

# ── Observability (Actuator + OTel + Metrics) ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: false
        endpoint: http://localhost:4318/v1/metrics
        step: 60s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request.duration: true
        spring.ai.chat.client.duration: true
      minimum-expected-value:
        http.server.request.duration: 1ms
      maximum-expected-value:
        http.server.request.duration: 30s
    tags:
      application: executespec
      environment: local

---
# ── GCP profile: use Cloud Trace + Cloud Monitoring instead of OTLP/Prometheus ─
spring:
  config:
    activate:
      on-profile: gcp

  threads:
    virtual:
      enabled: true
management:
  otlp:
    tracing:
      enabled: false
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false
