# Health check: GET /api/health (custom HealthController — no actuator dependency)

spring:
  application:
    name: executespec
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:executespec}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 80          # increased for 50 concurrent runs load testing (was 20)
      minimum-idle: 10               # keep warm connections ready
      connection-timeout: 10000      # 10s — fail fast instead of 30s default blocking
      idle-timeout: 300000           # 5 min — reclaim idle connections
      max-lifetime: 600000           # 10 min — rotate connections before DB-side timeouts
      validation-timeout: 3000       # 3s — quick validation for health checks
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate        # Hibernate only validates — Flyway manages all schema
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true   # Safe for existing databases
    baseline-version: 0         # Baseline before V1
    locations: classpath:db/migration

  ai:
    retry:
      max-attempts: 3               # down from default 10 — LlmRouter handles its own fallback chain
      backoff:
        initial-interval: 2000      # 2s
        multiplier: 2               # 2s → 4s → 8s (total ~14s vs default ~23 min)
        max-interval: 10000         # 10s cap
    anthropic:
      api-key: ${ANTHROPIC_API_KEY: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}
      chat:
        options:
          model: claude-haiku-4-5-20251001  # budget default; worker tasks override via assigned_model
          max-tokens: 16000                  # safe limit — Haiku/Sonnet both support ≥16k output
    openai:
      api-key: ${OPENAI_API_KEY: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}
      chat:
        options:
          model: gpt-4o-mini
          max-tokens: 16000                  # gpt-4o / gpt-4o-mini both support 16k output
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:AIzaSyALFxfueAKS7kXXp-2h7wflYY0QN1Q958c}          # empty default — Gemini is 3rd fallback only
        chat:
          options:
            model: gemini-3-flash-preview                 # default UTILITY; CAPABLE uses flash-lite, ARCHITECT uses customtools

agent:
  workspace: ./workspace
  roles:
    planner: anthropic
    worker: anthropic
    reviewer: anthropic
  token-budget:
    max-tokens: 16000        # Must match spring.ai.*.chat.options.max-tokens
    low: 2048                # LOW complexity output-token limit
    medium: 4096             # MEDIUM complexity output-token limit
    high: 8192               # HIGH complexity output-token limit
    hard-ceiling-pct: 0.90   # 14,400 tokens — absolute max, forces FORCE_REPORT
  compaction:
    warn-pct: 0.25     # warn at 50k tokens input (was 0.65 = 130k — too late)
    compact-pct: 0.35  # compact at 70k tokens input (was 0.75 = 150k — accumulated too much history)
    hard-stop-pct: 0.55 # hard-stop at 110k (was 0.90 = 180k)
  concurrency:
    max-runs: 50   # Temporarily increased for load testing (was 10)
    max-task-duration-minutes: 25  # Increased for HIGH complexity tasks (was 15)
    safety-iteration-cap: 500     # Hard iteration cap — pure safety net, should never trigger
  github:
    pat: ${GITHUB_PAT:}
    default-owner: ${GITHUB_OWNER:}
  shell:
    sandbox-enabled: true
    timeout-seconds: 300
    additional-allowed-commands: []
    additional-blocked-patterns: []
  recovery:
    enabled: true
    warn-threshold-minutes: 5
    act-threshold-minutes: 10
    max-task-retries: 1
    evaluator-log-window: 20
    loop-repeat-threshold: 3
    require-restart-approval: false
    max-transient-retries: 3
    rate-limit-backoff-seconds: 30
    server-error-backoff-seconds: 10
    max-auto-restarts: 3
    auto-restart-backoff-seconds: 60
    orphaned-run-threshold-minutes: 5
    auto-resume-on-startup: true
    startup-resume-delay-seconds: 30
    default-provider: anthropic
    capable-models:
      anthropic: claude-haiku-4-5-20251001
      openai: gpt-4o
    alternate-provider:
      anthropic: openai
      openai: anthropic
  context:
    enabled: true
    # model: uses ModelConstants.HAIKU (Scout: text summarization)
    provider: anthropic
    run-interval: 1
  optimiser:
    enabled: true
    run-interval: 10
    analysis-window-runs: 20
    failure-rate-threshold: 0.20
    pattern-min-occurrences: 2
    # model: uses ModelConstants.HAIKU (Scout: pattern analysis)
    provider: anthropic
  deployment:
    enabled: true
    gcp-project: ${GCP_PROJECT:executespecv1}
    gcp-region: ${GCP_REGION:asia-south1}
    artifact-registry:
      repository: ${AR_REPOSITORY:executespec-dev-docker}
      host: ${AR_HOST:asia-south1-docker.pkg.dev}
    cloud-run:
      cpu: "1"
      memory: 512Mi
      max-instances: 1
      allow-unauthenticated: true
    ttl-days: 7
    cleanup-cron: "0 3 * * * *"
    docker:
      build-timeout-seconds: 300
    static-site:
      nginx-image: nginx:1.25-alpine
    spring-boot:
      base-image: eclipse-temurin:21-jre-alpine
    workspace:
      retention-days: 30
      gcs-bucket: ${GCS_WORKSPACE_BUCKET:executespec-workspaces}  # GCS bucket for archived workspaces
      archive-after-hours: 24                                       # hours after completion before archiving to GCS

  # ── Tier 8: Compile agent, API spec generator, frontend preview ──────────────
  compiler:
    enabled: true
    max-attempts: 3
    timeout-seconds: 300
    # model: uses ModelConstants.HAIKU (compiler error analysis)
    provider: anthropic
  api-test-suite:
    enabled: true
    # model: uses ModelConstants.HAIKU (OpenAPI spec generation)
    provider: anthropic

  preview:
    enabled: true

  # ── Tier 7: External Integrations (all disabled by default) ─────────────────
  integrations:
    enabled: true             # Master switch — set true to register /api/integrations/* endpoints
    jira:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      webhook-secret: ${JIRA_WEBHOOK_SECRET:}
      trigger-status: "Ready for Coding"   # issue status name that fires the pipeline
      in-progress-status: "In Progress"    # transition to on run start (null = skip)
      in-review-status: "In Review"        # transition to on run complete (null = skip)
      reopen-status: "Backlog"             # transition to on run failed (null = skip)
      dashboard-url: ${DASHBOARD_URL:http://localhost:8080}
      skip-approval: false
    confluence:
      enabled: false
      # Credentials resolved from org table (per-org, configured via Settings UI)
      trigger-label: "agent-run"           # page label that fires the pipeline
      space-key: "KAN"                     # default space for child pages
      dashboard-url: ${DASHBOARD_URL:http://localhost:8080}
      skip-approval: false
    servicenow:
      enabled: false
      base-url: ${SNOW_BASE_URL:}
      username: ${SNOW_USERNAME:}
      password: ${SNOW_PASSWORD:}
      trigger-categories:
        - "application"
        - "database"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    pagerduty:
      enabled: false
      api-token: ${PD_API_TOKEN:}
      webhook-secret: ${PD_WEBHOOK_SECRET:}
      from-email: ${PD_FROM_EMAIL:}        # required for PATCH requests
      trigger-types:
        - "incident.trigger"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    slack:
      enabled: false
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/integrations/slack/oauth/callback}
      dashboard-url: ${DASHBOARD_URL:http://localhost:8080}

# ── Cloud Run-based preview ─────────────────────────────────────────────────
preview:
  enabled: true
  total-startup-timeout-seconds: 300   # 5-minute total deadline (covers build + start + health check)
  preview-ttl-minutes: 10              # auto-shutdown after 10 minutes
  port-range-start: 10000              # Docker Compose host port range
  port-range-end: 10100
  preview-domain: preview.executespec.ai  # wildcard domain (*.preview.executespec.ai)
  proxy:
    enabled: false                     # set true on GCE VM with Caddy installed
  concurrency:
    free-max: 1
    pro-max: 3
    enterprise-max: 10

app:
  mail:
    # Transport: "smtp" (recommended for server) or "gmail-api" (OAuth, local dev)
    transport: ${MAIL_TRANSPORT:smtp}
    base-url: ${APP_BASE_URL:http://localhost:5173}
    from: ${MAIL_FROM:admin@executespec.ai}
    # ── SMTP config (used when transport=smtp) ──────────────────────────────
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}          # Gmail App Password (16 chars, no spaces)
    # ── Gmail API OAuth2 config (used when transport=gmail-api) ─────────────
    gmail-api:
      enabled: ${GMAIL_ENABLED:false}
      credentials-path: ${GMAIL_CREDENTIALS_PATH:credentials.json}
      tokens-dir: ${GMAIL_TOKENS_DIR:${user.home}/.executespec/gmail-tokens}
      app-name: executespec
  jwt:
    secret: ${JWT_SECRET:executespec-dev-secret-key-must-be-at-least-256-bits-long-for-HS256}
    access-token-expiry-minutes: 1440
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tiers:
    free:
      monthly-run-limit: 5
      concurrent-run-limit: 1
    pro:
      monthly-run-limit: 100
      concurrent-run-limit: 3
    enterprise:
      monthly-run-limit: -1    # -1 = unlimited
      concurrent-run-limit: 10

executespec:
  validator:
    enabled: true
    per-task-validation: true
    per-task-level: TYPE
    project-validation-level: FULL
    max-retries: 3
    default-timeout: 30s

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  base-url: https://api.razorpay.com/v1

billing:
  terms-version: "2026-03-v1"
  founder-pricing:
    max-slots: 100
    discount-pct: 30

logging:
  level:
    com.navneet.executespec: INFO
    org.springframework.ai: WARN
    io.opentelemetry: WARN
    io.micrometer.tracing: INFO

# ── Observability (Actuator + OTel + Metrics) ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  observations:
    annotations:
      enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 60s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request.duration: true
        spring.ai.chat.client.duration: true
      minimum-expected-value:
        http.server.request.duration: 1ms
      maximum-expected-value:
        http.server.request.duration: 30s
    tags:
      application: executespec
      environment: ${SPRING_PROFILES_ACTIVE:local}

---
# ── GCP profile: use Cloud Trace + Cloud Monitoring instead of OTLP/Prometheus ─
spring:
  config:
    activate:
      on-profile: gcp

management:
  otlp:
    tracing:
      enabled: false
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      enabled: false
