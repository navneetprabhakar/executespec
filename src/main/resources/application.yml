spring:
  application:
    name: executespec
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          min-idle: 5
          test-on-borrow: true
          test-while-idle: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://localhost:5432/executespec
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 600000
      validation-timeout: 3000
      leak-detection-threshold: 90000
  mvc:
    async:
      request-timeout: 900000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"

  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 10000
    anthropic:
      api-key: ""
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 16384
    openai:
      api-key: ""
      chat:
        options:
          model: gpt-5.4-mini
          max-tokens: 16384
    google:
      genai:
        api-key: ""
        chat:
          options:
            model: gemini-3-flash-preview
    openrouter:
      base-url: https://openrouter.ai/api
      api-key: ""
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ""
    fireworks:
      base-url: https://api.fireworks.ai/inference/v1
      api-key: ""
    sarvam:
      base-url: https://api.sarvam.ai/v1
      api-key: ""

execution:
  continuation:
    # Goal continuation policy knobs. Selected-candidate step-up / step-down / provider-change
    # reruns are automatic by default, bounded by the limits below, unless confirmation is required.
    required-quality-threshold: 70.0
    required-quality-thresholds:
      task-low: -1
      task-medium: -1
      task-high: -1
      greenfield-build: -1
      project-patch: -1
      bug-fix: -1
      test-fix: -1
      refactor: -1
      benchmark-patch: -1
      terminal-task: -1
      read-only-help: -1
    max-provider-switches-per-run: 1
    max-model-step-ups-per-task: 1
    max-model-step-downs-per-task: 1
    max-no-progress-iterations: 28
    max-false-done-claims: 2
    max-repeated-failures: 3
    max-edit-churn: 6
    max-stale-explanations: 2
    max-parallel-tasks: 3
    benchmark-min-sample-tasks: 20
    parallel-read-tools-enabled: true
    parallel-provider-evaluation-enabled: true
    max-total-cost-usd: -1
    max-total-tokens: -1
    max-task-wall-clock-ms: -1
    require-confirmation-before-expensive-continuation: false
    require-benchmark-prior-for-automatic-continuation: true
    acting:
      enabled: true
    max-reruns-per-task: 1

managed-ai:
  enabled: true
  tiers:
    # Run-count retirement (2026-06-22): FREE is gated by a small managed ES-credit
    # grant instead of a monthly run cap. 200 credits == $2.00 raw COGS at 1.00x.
    FREE:
      included-credits: 200
      raw-cogs-cap-usd: 2.00
      frontier-raw-cap-usd: 0.50
      value-mode-after-raw-usd: 0.50
      cheap-only-after-raw-usd: 1.50
      hard-stop-after-raw-usd: 2.00
      retail-multiplier: 1.00
      concurrency-enforced: false
      rate-limits-enabled: false
      notification-thresholds-pct: [50, 75, 90, 100]
    PRO:
      included-credits: 2000
      raw-cogs-cap-usd: 16.00
      frontier-raw-cap-usd: 4.00
      value-mode-after-raw-usd: 4.00
      cheap-only-after-raw-usd: 12.00
      hard-stop-after-raw-usd: 16.00
      retail-multiplier: 1.25
      concurrency-enforced: false
      rate-limits-enabled: false
      notification-thresholds-pct: [50, 75, 90, 100]
    TEAM:
      included-credits: 0
      raw-cogs-cap-usd: 0.00
      frontier-raw-cap-usd: 0.00
      value-mode-after-raw-usd: 0.00
      cheap-only-after-raw-usd: 0.00
      hard-stop-after-raw-usd: 0.00
      retail-multiplier: 1.00
      concurrency-enforced: false
      rate-limits-enabled: false
    ENTERPRISE:
      included-credits: 0
      raw-cogs-cap-usd: 0.00
      frontier-raw-cap-usd: 0.00
      value-mode-after-raw-usd: 0.00
      cheap-only-after-raw-usd: 0.00
      hard-stop-after-raw-usd: 0.00
      retail-multiplier: 1.00
      concurrency-enforced: false
      rate-limits-enabled: false

model-matrix:
  providers:
    # RL-2026-06-052 — LIGHTWEIGHT is now a genuinely cheaper model per provider (was all-flagship
    # since 2026-06-02). It serves the genuinely-light NON-worker agents (classifier / chat
    # compactors / titles / ledger). The WORKER never lands here: SequentialExecutor.tierConfigFor
    # routes LOW-complexity worker tasks to WORKHORSE (flagship), so re-tiering LIGHTWEIGHT cheap
    # does NOT reintroduce the prior cheap-worker eval regression. SpecChatService is bumped to
    # WORKHORSE in agent-tier-map so the user-facing spec-build chat stays on the flagship.
    anthropic:
      planning: claude-sonnet-4-6
      workhorse: claude-sonnet-4-6
      lightweight: claude-haiku-4-5-20251001
    gemini:
      planning: gemini-3.5-flash
      workhorse: gemini-3.5-flash
      lightweight: gemini-3-flash-preview
    openai:
      planning: gpt-5.4
      workhorse: gpt-5.4
      lightweight: gpt-5.4-mini
    openrouter:
      # RL-2026-06-053: OpenRouter now defaults to DeepSeek (was Claude). deepseek-v4-pro for
      # planning/workhorse, deepseek-v4-flash for the light tier — all via the OpenRouter gateway.
      planning: deepseek-v4-pro
      workhorse: deepseek-v4-pro
      lightweight: deepseek-v4-flash
    deepseek:
      # RL-2026-06-053: DeepSeek V4 Pro via the native api.deepseek.com route (~3-4x faster than the
      # OpenRouter hop). Verified live 2026-06-18: Pro works multi-turn with tools on auto, and the
      # reasoning_content echo is NOT required. Flash-native stays for the cheap light tier.
      planning: deepseek-v4-pro-native
      workhorse: deepseek-v4-pro-native
      lightweight: deepseek-v4-flash-native
    fireworks:
      planning: deepseek-v4-pro-fw
      workhorse: deepseek-v4-pro-fw
      lightweight: deepseek-v4-flash-fw
    sarvam:
      # 2026-06-26 — disabled/dark only. Sarvam quality is not production-ready (worker eval
      # produced zero-byte patches), so ModelAccessService rejects the provider and ModelController
      # hides it from catalogs. Keep matrix breadcrumbs only so explicit stale ids fail closed.
      planning: sarvam-105b
      workhorse: sarvam-105b
      lightweight: sarvam-30b

