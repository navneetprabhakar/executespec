durability:
  task-checkpoint:
    enabled: true

agent:
  workspace: ./workspace
  roles:
    planner: anthropic
    worker: anthropic
    reviewer: anthropic
  token-budget:
    max-tokens: 64000
    hard-ceiling-pct: 0.90
  compaction:
    warn-pct: 0.45
    compact-pct: 0.60
    hard-stop-pct: 0.80
  triage:
    enabled: true
  concurrency:
    max-runs: 50
    max-task-duration-minutes: 25
    safety-iteration-cap: 500
    task-max-retries: 3
  cost:
    credit-multiplier-usd: 5.0
    estimation-buffer: 1.10
    budget-margin: 1.5
    max-credits-free: 1
    batch:
      enabled: true
      poll-interval-seconds: 30
      max-wait-hours: 4
      discount: 0.50
      max-output-token-multiplier: 1.5
      google-inline-task-limit: 10
  github:
    default-owner: ""
  shell:
    sandbox-enabled: true
    timeout-seconds: 300
    path-prepend: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin"
    additional-allowed-commands: []
    additional-blocked-patterns: []
  recovery:
    enabled: true
    warn-threshold-minutes: 8
    act-threshold-minutes: 15
    max-task-retries: 1
    evaluator-log-window: 20
    loop-repeat-threshold: 3
    require-restart-approval: false
    max-transient-retries: 3
    rate-limit-backoff-seconds: 30
    server-error-backoff-seconds: 10
    max-auto-restarts: 2
    auto-restart-backoff-seconds: 90
    orphaned-run-threshold-minutes: 8
    auto-resume-on-startup: false
    startup-resume-delay-seconds: 30
    default-provider: anthropic
    capable-models:
      anthropic: claude-haiku-4-5-20251001
      openai: gpt-5.4
    alternate-provider:
      anthropic: openai
      openai: anthropic
  context:
    enabled: true
    run-interval: 1
  optimiser:
    enabled: true
    run-interval: 10
    analysis-window-runs: 20
    failure-rate-threshold: 0.20
    pattern-min-occurrences: 2
  deployment:
    enabled: true
    gcp-project: executespecv1
    gcp-region: us-east4
    artifact-registry:
      repository: executespec-dev-docker
      host: us-east4-docker.pkg.dev
    cloud-run:
      cpu: "1"
      memory: 512Mi
      max-instances: 1
      allow-unauthenticated: true
    ttl-days: 3
    cleanup-cron: "0 3 * * * *"
    docker:
      build-timeout-seconds: 300
    static-site:
      nginx-image: nginx:1.25-alpine
    spring-boot:
      base-image: eclipse-temurin:21-jre-alpine
    workspace:
      retention-days: 30
      gcs-bucket: executespec-workspaces
      archive-after-hours: 24
      gcs-enabled: false

  compiler:
    enabled: true
    max-attempts: 3
    timeout-seconds: 300
  api-test-suite:
    enabled: true

  preview:
    enabled: true

  integrations:
    enabled: true
    jira:
      enabled: false
      webhook-secret: ""
      trigger-status: "Ready for Coding"
      in-progress-status: "In Progress"
      in-review-status: "In Review"
      reopen-status: "Backlog"
      dashboard-url: http://localhost:8080
      skip-approval: false
    confluence:
      enabled: false
      trigger-label: "agent-run"
      space-key: "KAN"
      dashboard-url: http://localhost:8080
      skip-approval: false
    servicenow:
      enabled: false
      base-url: ""
      username: ""
      password: ""
      trigger-categories:
        - "application"
        - "database"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    pagerduty:
      enabled: false
      api-token: ""
      webhook-secret: ""
      from-email: ""
      trigger-types:
        - "incident.trigger"
      auto-resolve: false
      dashboard-url: http://localhost:8080
      skip-approval: false
    bitbucket:
      enabled: false
      webhook-secret: ""
      dashboard-url: http://localhost:8080
      skip-approval: false
    slack:
      enabled: false
      client-id: ""
      client-secret: ""
      signing-secret: ""
      redirect-uri: http://localhost:8080/api/integrations/slack/oauth/callback
      dashboard-url: http://localhost:8080
  security:
    deps:
      require-ignore-scripts: ${AGENT_SECURITY_DEPS_IGNORE_SCRIPTS:true}
      require-lockfile: ${AGENT_SECURITY_DEPS_LOCKFILE:true}
      require-audit: ${AGENT_SECURITY_DEPS_AUDIT:true}
      allow-prerelease: ${AGENT_SECURITY_DEPS_PRERELEASE:false}
      allowed-registries: ${AGENT_SECURITY_DEPS_REGISTRIES:https://registry.npmjs.org,https://registry.bun.sh,https://registry.pnpm.io,https://registry.yarnpkg.com}
      scanner:
        vendor: ${AGENT_SECURITY_DEPS_SCANNER_VENDOR:none}

preview:
  enabled: true
  mode: ${PREVIEW_MODE:docker}
  total-startup-timeout-seconds: 480
  preview-ttl-minutes: 30
  port-range-start: 10000
  port-range-end: 10100
  preview-domain: executespec.ai
  fallback-host: ""
  proxy:
    enabled: false
  concurrency:
    free-max: 1
    pro-max: 3
    enterprise-max: 10

  engine:
    route-via: ${PREVIEW_ENGINE_ROUTE_VIA:true}
    base-url: ${PREVIEW_ENGINE_URL:http://localhost:8090}
    registry-url: ${PREVIEW_ENGINE_REGISTRY_URL:localhost:5500}
    api-key: ${PREVIEW_ENGINE_API_KEY:change-me-in-prod}
    timeout-seconds: 300

  vm:
    enabled: false
    default-ttl-minutes: 20
    gateway:
      ip: ${PREVIEW_GATEWAY_IP:}
      internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
      user: ${PREVIEW_SSH_USER:ubuntu}
      ssh-key-path: ${PREVIEW_SSH_KEY_PATH:}
      vm-id: preview-gw
    vms:
      - id: preview-gw
        external-ip: ${PREVIEW_GATEWAY_IP:}
        internal-ip: ${PREVIEW_GW_INTERNAL_IP:}
        max-concurrent: 10
        role: gateway

app:
  security:
    csp:
      enabled: true
    hsts:
      enabled: true
      max-age-seconds: 31536000
      include-sub-domains: true
    frame-options:
      enabled: true
      mode: SAMEORIGIN
  mail:
    transport: smtp
    base-url: http://localhost:5173
    from: admin@executespec.ai
    admin-address: ${ADMIN_NOTIFICATION_EMAIL:admin@executespec.ai}
    admin-reminder-token: ${ADMIN_REMINDER_TOKEN:}
    smtp:
      host: smtp.gmail.com
      port: 587
      username: admin@executespec.ai
      password: ""
    gmail-api:
      enabled: false
      credentials-path: credentials.json
      tokens-dir: ${user.home}/.executespec/gmail-tokens
      app-name: executespec
  contact:
    fallback-email: admin@executespec.ai
    jira:
      base-url: ${CONTACT_JIRA_BASE_URL:}
      email: ${CONTACT_JIRA_EMAIL:}
      api-token: ${CONTACT_JIRA_API_TOKEN:}
      project-key: ${CONTACT_JIRA_PROJECT_KEY:SUP}
      issue-type: Task
  jwt:
    secret: executespec-local-dev-secret-key-must-be-at-least-256-bits-long-for-HS256
    access-token-expiry-minutes: 360
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
    app-return-url: ${APP_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
    build-return-url: ${BUILD_SURFACE_RETURN_URL:http://localhost:5173/auth/callback}
  tiers:
    free:
      monthly-run-limit: 5
      concurrent-run-limit: 1
    pro:
      monthly-run-limit: 100
      concurrent-run-limit: 3
    enterprise:
      monthly-run-limit: -1
      concurrent-run-limit: 10

