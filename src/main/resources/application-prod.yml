# ══════════════════════════════════════════════════════════════════════════════
# ExecuteSpec — Prod profile (production GCE deployment)
# ══════════════════════════════════════════════════════════════════════════════
# Activate with: --spring.profiles.active=prod
# Stricter concurrency limits, full observability
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ ENVIRONMENT VARIABLES (all have safe defaults — app starts without them)   │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ ANTHROPIC_API_KEY      Claude API key                                      │
# │ OPENAI_API_KEY         OpenAI API key                                      │
# │ GOOGLE_API_KEY         Gemini API key (for LLM fallback chain)             │
# │ JWT_SECRET             JWT signing key (≥256 bits for HS256) — OVERRIDE!   │
# │ SMTP_PASSWORD          Gmail app password for email notifications          │
# │ GITHUB_PAT             GitHub Personal Access Token                        │
# │ GITHUB_OWNER           Default GitHub repo owner                           │
# │ POSTGRES_HOST          PostgreSQL host (default: localhost)                 │
# │ POSTGRES_PORT          PostgreSQL port (default: 5432)                     │
# │ POSTGRES_DB            PostgreSQL database (default: executespec)           │
# │ POSTGRES_USER          PostgreSQL user (default: postgres)                 │
# │ POSTGRES_PASSWORD      PostgreSQL password (default: postgres)             │
# │ REDIS_HOST             Redis host (default: localhost)                     │
# │ REDIS_PORT             Redis port (default: 6379)                          │
# │ RAZORPAY_KEY_ID        Razorpay key ID (billing)                           │
# │ RAZORPAY_KEY_SECRET    Razorpay key secret (billing)                       │
# │ RAZORPAY_WEBHOOK_SECRET Razorpay webhook secret                            │
# │ GCS_WORKSPACE_BUCKET   GCS bucket for workspaces (default: executespec-workspaces) │
# │ CORS_ALLOWED_ORIGINS   CORS origins (default: https://executespec.ai)      │
# │ PREVIEW_FALLBACK_HOST  Preview fallback (e.g. http://executespec.ai)       │
# │ DASHBOARD_URL          Dashboard URL for integration links                 │
# │ OTEL_SAMPLING_PROBABILITY  Trace sampling rate (default: 0.1)              │
# │ OTEL_EXPORTER_OTLP_ENDPOINT  OTLP collector endpoint                      │
# │ SLACK_CLIENT_ID        Slack app client ID                                 │
# │ SLACK_CLIENT_SECRET    Slack app client secret                             │
# │ SLACK_SIGNING_SECRET   Slack signing secret                                │
# │ JIRA_WEBHOOK_SECRET    JIRA webhook secret                                 │
# └─────────────────────────────────────────────────────────────────────────────┘

# ── LLM Provider Keys ────────────────────────────────────────────────────────
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:executespec}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
    # OpenRouter (Enterprise gateway) — RL-2026-05-052. Env-var-bound on prod so the operator
    # sets OPENROUTER_API_KEY without touching YAML. Empty key disables the route — provider stays
    # registered but every call short-circuits with "OpenRouter api-key not configured."
    openrouter:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY:}
    # DeepSeek native (api.deepseek.com) — RL-2026-05-052. Same shape as OpenRouter. Empty key
    # disables the route. Tier-pinned to deepseek-v4-flash-native today (pro-native registered but
    # not tier-active — see application.yml notes).
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:none}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:none}
            scope: openid, email, profile
            redirect-uri: https://executespec.ai/api/auth/oauth2/callback/{registrationId}
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:Ov23lijrPPx9fhPemczg}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
            scope: user:email, read:user
            redirect-uri: https://executespec.ai/api/auth/oauth2/callback/{registrationId}
        provider:
          github:
            user-name-attribute: login

# ── Server (Tomcat / forwarded headers) ──────────────────────────────────────
# The prod LB terminates TLS and forwards X-Forwarded-Proto: https. Without
# this, Spring sees every request as http and rebuilds absolute URLs
# (RedirectView Location headers, OAuth client {baseUrl}) with the wrong
# scheme. `framework` uses Spring's ForwardedHeaderFilter.
server:
  forward-headers-strategy: framework

# ── Agent (stricter concurrency for prod) ─────────────────────────────────────
agent:
  concurrency:
    max-runs: 20
    max-task-duration-minutes: 25
  recovery:
    enabled: true
    warn-threshold-minutes: 8
    act-threshold-minutes: 15
    max-auto-restarts: 2
    auto-resume-on-startup: false
  github:
    default-owner: ${GITHUB_OWNER:}
  deployment:
    gcp-project: ${GCP_PROJECT:executespecv1}
    gcp-region: ${GCP_REGION:us-east4}
    artifact-registry:
      repository: ${AR_REPOSITORY:executespec-docker}
      host: ${AR_HOST:us-east4-docker.pkg.dev}
    workspace:
      gcs-bucket: ${GCS_WORKSPACE_BUCKET:executespec-workspaces}
  integrations:
    jira:
      webhook-secret: ${JIRA_WEBHOOK_SECRET:}
      dashboard-url: ${DASHBOARD_URL:https://executespec.ai}
    confluence:
      dashboard-url: ${DASHBOARD_URL:https://executespec.ai}
    slack:
      client-id: ${SLACK_CLIENT_ID:}
      client-secret: ${SLACK_CLIENT_SECRET:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
      redirect-uri: ${SLACK_REDIRECT_URI:https://executespec.ai/api/integrations/slack/oauth/callback}
      dashboard-url: ${DASHBOARD_URL:https://executespec.ai}

# ── Preview ───────────────────────────────────────────────────────────────────
# 2026-04-20 — prod routes through preview-engine (on preview-gw VM) over HTTPS.
# PREVIEW_ENGINE_API_KEY must be set (no default) — it's the shared secret with
# preview-engine's own PREVIEW_API_KEY in /etc/preview-engine.env.
preview:
  mode: ${PREVIEW_MODE:docker}
  fallback-host: ${PREVIEW_FALLBACK_HOST:http://executespec.ai}
  proxy:
    enabled: ${PREVIEW_PROXY_ENABLED:true}
  engine:
    route-via: ${PREVIEW_ENGINE_ROUTE_VIA:true}
    base-url:     ${PREVIEW_ENGINE_URL:https://preview-engine.executespec.ai}
    registry-url: ${PREVIEW_ENGINE_REGISTRY_URL}                     # required in prod — no default
    api-key:      ${PREVIEW_ENGINE_API_KEY}                           # required in prod
    timeout-seconds: 300
  vm:
    enabled: false

# ── App (JWT, CORS, Mail) ────────────────────────────────────────────────────
app:
  mail:
    base-url: https://executespec.ai
    smtp:
      password: ${SMTP_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:executespec-prod-secret-MUST-BE-OVERRIDDEN-via-env-var}
  cors:
    # Plan 1 (this-week #5): pre-emptive Phase-2 surface allow-list. Both
    # subdomains are listed by default so the eventual frontend split
    # doesn't need a config push — just a DNS + deploy. Ops can still
    # override via the env var to lock down to one origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://executespec.ai,https://www.executespec.ai,https://app.executespec.ai,https://build.executespec.ai}
  # V143 product-routing config retired (V179, single-surface
  # retirement 2026-05-06).

# ── Auth ──────────────────────────────────────────────────────────────────────
# Refresh-token cookie carries Secure (HTTPS-only) in prod — served over HTTPS
# behind Cloudflare. Local dev (HTTP) keeps this false via the base profile. C1.
auth:
  refresh-cookie:
    secure: true

# ── Crypto ────────────────────────────────────────────────────────────────────
# Encrypt credential fields at rest (GitHub PAT, AI keys, Slack/Jira/Confluence/
# Bitbucket tokens) via SimpleKeyEncryptionService + the GCP Secret Manager key
# configured in the base profile. Safe fallback: if the key can't be loaded the
# service logs a WARN and runs passthrough (no crash — no worse than before). C7.
# NOTE(operator): once `executespec-crypto-key` is confirmed present + readable,
# set require-encryption: true here to fail-fast instead of silently storing plaintext.
executespec:
  crypto:
    enabled: true

# ── Billing ───────────────────────────────────────────────────────────────────
# 2026-04-21 — US-first launch. Stripe is the prod default gateway for USD traffic.
# Razorpay continues to serve INR customers via currency-based routing (see
# PaymentGatewayRouter + BillingController). If STRIPE_* env vars are not set,
# set BILLING_STRIPE_ENABLED=false and flip BILLING_DEFAULT_GATEWAY=razorpay.
billing:
  default-gateway: ${BILLING_DEFAULT_GATEWAY:stripe}
  stripe:
    enabled: ${BILLING_STRIPE_ENABLED:true}
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    enterprise-price-id: ${STRIPE_ENTERPRISE_PRICE_ID:}
    team-price-id: ${STRIPE_TEAM_PRICE_ID:}
    team-price-id-inr: ${STRIPE_TEAM_PRICE_ID_INR:}
  razorpay:
    enabled: ${BILLING_RAZORPAY_ENABLED:true}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  webhook-url: ${RAZORPAY_WEBHOOK_URL:https://executespec.ai/api/webhooks/razorpay}

# ── Observability (full tracing + metrics in prod) ────────────────────────────
logging:
  level:
    com.navneet.executespec: INFO
    org.springframework.ai: WARN

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: true
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
  metrics:
    tags:
      environment: prod
