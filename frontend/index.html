<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- R-171 — PWA manifest + iOS home-screen support. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Fix K (2026-05-03): apple-mobile-web-app-capable is deprecated as of
         iOS 16. The standard meta name is mobile-web-app-capable; we keep the
         apple-* one for back-compat with older iOS PWA installers. Both must
         carry the same value. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExecuteSpec" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- 2026-05-10 — JetBrains Mono everywhere (body + mono) for the
         developer-tool / terminal-style aesthetic. Marketing site uses
         the same family so landing → product typography is identical.

         Mobile-sharpness fix (iter-3, 2026-05-10): the CSS link below
         was being blocked by the prod CSP (`style-src 'self'
         'unsafe-inline' https://cdn.jsdelivr.net` did not include
         fonts.googleapis.com). On mobile the font silently fell back
         to ui-monospace / SF Mono / Menlo — none of which are tuned
         for the body chain and render fuzzily on iOS Safari at 2x/3x
         DPR. The `style-src` directive in
         backend/SecurityProperties.java now allows
         fonts.googleapis.com so the @font-face block resolves. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>ExecuteSpec — AI that ships pull requests your team actually merges</title>
    <!-- 2026-06-10 launch truth pass: the app served zero meta/OG tags, so every
         shared link (incl. public /shared/:token verified reports — the main
         organic growth surface) unfurled blank in Slack/Discord/X. SPA = one
         site-wide tag set; og-hero.png is served by the marketing site. -->
    <meta
      name="description"
      content="Write a spec in plain English. ExecuteSpec plans it, codes it across your repos, runs your tests, and opens a pull request with a deterministic 0–100 verified score. You approve the plan — and the price — before execution starts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExecuteSpec" />
    <meta
      property="og:title"
      content="ExecuteSpec — AI that ships pull requests your team actually merges"
    />
    <meta
      property="og:description"
      content="Spec in, verified PR out. Approve the plan and price up front; every run ships with a deterministic 0–100 verified score."
    />
    <meta property="og:image" content="https://executespec.ai/images/og-hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ExecuteSpec — AI that ships pull requests your team actually merges"
    />
    <meta
      name="twitter:description"
      content="Spec in, verified PR out. Approve the plan and price up front; deterministic verified score on every run."
    />
    <meta name="twitter:image" content="https://executespec.ai/images/og-hero.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
