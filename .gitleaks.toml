title = "ExecuteSpec secret scanning"
minVersion = "v8.25.0"

[extend]
useDefault = true

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Exact synthetic fixtures in WorkerAgentArgumentSignatureTest.java"
condition = "AND"
paths = ["(?:^|/)src/test/java/com/navneet/executespec/engine/WorkerAgentArgumentSignatureTest\\.java$"]
regexTarget = "secret"
regexes = ["^es\\-secret\\-canary$"]

[[rules]]
id = "executespec-personal-access-token"
description = "ExecuteSpec personal access token"
regex = 'es_pat_[A-Za-z0-9_-]{32,}'
entropy = 3.0
keywords = ["es_pat_"]

[[rules.allowlists]]
description = "Exact synthetic fixtures in JwtAuthenticationFilterPatTransportTest.java"
condition = "AND"
paths = ["(?:^|/)src/test/java/com/navneet/executespec/auth/security/JwtAuthenticationFilterPatTransportTest\\.java$"]
regexTarget = "secret"
regexes = ["^es_pat_query_secret_that_must_not_be_logged$"]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact synthetic fixtures in ProjectDocGeneratorServiceCacheHitTest.java"
condition = "AND"
paths = ["(?:^|/)src/test/java/com/navneet/executespec/codeintel/ProjectDocGeneratorServiceCacheHitTest\\.java$"]
regexTarget = "secret"
regexes = ["^xoxb\\-1234567890\\-abcdefghijklmnop$"]

