          description: Database not reachable

  # ──────────────────────────────────────────────────
  # WEBHOOKS
  # ──────────────────────────────────────────────────
  /webhooks/razorpay:
    post:
      tags: [Billing]
      summary: Razorpay payment webhook (HMAC verified)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed

  /webhooks/stripe:
    post:
      tags: [Billing]
      summary: Stripe payment webhook (Stripe-Signature verified)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: Webhook processed

  # ──────────────────────────────────────────────────
  # FEATURE FLAGS
  # ──────────────────────────────────────────────────
  /admin/validation-reports/backfill-verified-score:
    post:
      tags: [Admin]
      summary: Backfill verified scores on existing validation reports (SUPER_ADMIN)
      description: >
        Recomputes historical `validation_report.verified_score` and `rubric_score`
        rows with the current scoring logic. The operation is idempotent; use
        `dryRun=true` before a broad pass.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runId:
                  type: string
                  description: Optional single run id to backfill.
                limit:
                  type: integer
                  minimum: 1
                  description: Optional maximum number of reports to process.
                dryRun:
                  type: boolean
                  description: When true, compute changes without saving rows.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRows:
                    type: integer
                  processedRows:
                    type: integer
                  updatedRows:
                    type: integer
                  skippedRows:
                    type: integer
                  failedRows:
                    type: integer
                  dryRun:
                    type: boolean
                  samples:
                    type: array
                    items:
                      type: object

  /admin/feature-flags:
    get:
      tags: [Admin]
      summary: List all feature flags (SUPER_ADMIN)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    flagKey:
                      type: string
                    flagValue:
                      type: string
                    valueType:
                      type: string
                    scope:
                      type: string
                    description:
                      type: string
                    updatedBy:
                      type: string
                    updatedAt:
                      type: string

  /admin/feature-flags/{key}:
    put:
      tags: [Admin]
      summary: Update feature flag value (SUPER_ADMIN)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────────
  # ADMIN
  # ──────────────────────────────────────────────────
  /admin/payment-audit:
    get:
      tags: [Admin]
      summary: Payment audit log (paginated, SUPER_ADMIN)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /admin/payment-audit/export:
    get:
      tags: [Admin]
      summary: Export payment audit as CSV (SUPER_ADMIN)
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string

  /admin/webhook-events:
    get:
      tags: [Admin]
      summary: Webhook event log (filterable, SUPER_ADMIN)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: gateway
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /billing/payment-history:
    get:
      tags: [Billing]
      summary: Org-scoped payment history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────────
  # OAUTH2
  # ──────────────────────────────────────────────────
  /auth/oauth2/authorize:
    get:
      tags: [Auth]
      summary: OAuth2 authorization redirect (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "302":
          description: Redirect to OAuth2 provider

  /auth/oauth2/callback/{provider}:
    get:
      tags: [Auth]
      summary: OAuth2 callback (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JWT issued on success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  # ──────────────────────────────────────────────────
  # ONBOARDING (Wave 2)
  # ──────────────────────────────────────────────────
  /onboarding/sample-specs:
    get:
      tags: [Onboarding]
      summary: List onboarding sample specs
      description: Returns the curated sample-spec catalog (web-api / frontend / cli) used by the post-signup welcome flow.
      responses:
        "200":
          description: Sample specs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    surface:
                      { type: string, enum: [HTTP, CLI, STATIC_WEB, LIBRARY] }
                    description: { type: string }
                    expectedTimeMinutes: { type: integer }
                    tags:
                      type: array
                      items: { type: string }

  /onboarding/pick-sample:
    post:
      tags: [Onboarding]
      summary: Launch a sample spec into the caller's sandbox project
      description: Provisions (or reuses) the sandbox project, drops the sample spec into a new run, dispatches via V2RunOrchestrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleId]
              properties:
                sampleId: { type: string }
      responses:
        "202":
          description: Run submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string, format: uuid }
                  projectId: { type: string, format: uuid }

  /onboarding/sandbox-status:
    get:
      tags: [Onboarding]
      summary: Return the caller's sandbox project status
      responses:
        "200":
          description: Sandbox status
          content:
            application/json:
              schema:
                type: object
                properties:
                  provisioned: { type: boolean }
                  projectId: { type: string, format: uuid, nullable: true }
                  lastActivity:
                    { type: string, format: date-time, nullable: true }
                  expiresAt: { type: string, format: date-time, nullable: true }

  # ──────────────────────────────────────────────────
  # TIER LIFECYCLE (Wave 1, SUPER_ADMIN)
  # ──────────────────────────────────────────────────
  /admin/tiers:
    get:
      tags: [Tier Lifecycle]
      summary: List tiers with lifecycle state
      responses:
        "200":
          description: Tier lifecycle rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/TierLifecycleRow"

  /admin/tiers/{tier}:
    put:
      tags: [Tier Lifecycle]
      summary: Transition a tier between LISTED | HIDDEN | SUNSETTING
      description: |
        SUNSETTING transitions require a 14-day `HIDDEN` observation window (enforced
        as 409 Conflict when not yet elapsed). The request body must repeat the
        tier name in `reason` as a typed-name confirmation guard.
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: string
            enum: [FREE, PRO, TEAM, MAX, ENTERPRISE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [LISTED, HIDDEN, SUNSETTING] }
                reason: { type: string }
                observationDays: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated lifecycle row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierLifecycleRow"
        "409":
          description: Transition rejected (e.g. SUNSETTING before 14-day HIDDEN window elapses)

  # ──────────────────────────────────────────────────
  # TEAM TRIAL (Wave 3)
  # ──────────────────────────────────────────────────
  /org/trial-request:
    post:
      tags: [Team Trial]
      summary: Submit a TEAM tier trial request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, contactEmail, intendedSeats]
              properties:
                orgId: { type: string, format: uuid }
                contactEmail: { type: string, format: email }
                intendedSeats: { type: integer, minimum: 2, maximum: 20 }
                notes: { type: string }
      responses:
        "201":
          description: Trial request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, APPROVED, REJECTED] }

# ──────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (1h TTL). Obtain via POST /auth/login. Refresh token (7d TTL) set as httpOnly cookie.

  parameters:
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required: [email, firstName, lastName, password]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          minLength: 8
        signupSource:
          type: string
          description: Wave 2 — attribution tag (e.g. `product-hunt`, `direct`, `organic`). Written to `app_user.signup_source`.
        utmSource:
          type: string
        utmMedium:
          type: string
        utmCampaign:
          type: string
        referrer:
          type: string
          description: Wave 2 — caller-captured `document.referrer` at registration time.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserDto"
        accessToken:
          type: string

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tier:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        role:
          type: string
        orgId:
          type: string
          nullable: true
        githubOwner:
          type: string
          nullable: true
        hasGithubPat:
          type: boolean
        hasOpenAiKey:
          type: boolean
        hasAnthropicKey:
          type: boolean
        hasGeminiKey:
          type: boolean
        hasDeepSeekKey:
          type: boolean
        hasFireworksKey:
          type: boolean
        hasJiraCredentials:
          type: boolean
        hasConfluenceCredentials:
          type: boolean
        viewMode:
          type: string
          enum: [vibe, pro]
        emailVerified:
          type: boolean

    TierPermissions:
      type: object
      properties:
        canCreateRun:
          type: boolean
        canChat:
          type: boolean
        canApplySuggestions:
          type: boolean
        canPreview:
          type: boolean
        canDeploy:
          type: boolean
        monthlyRunLimit:
          type: integer
        runsUsed:
          type: integer
        runsRemaining:
          type: integer

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string

    ProviderPreferenceRequest:
      type: object
      properties:
        provider:
          type: string
          description: "Canonical values ANTHROPIC / OPENAI / GEMINI (plus the BYOK routes OPENROUTER / DEEPSEEK / FIREWORKS). GOOGLE is accepted as input and rewritten to GEMINI before persistence."
          enum:
            [ANTHROPIC, OPENAI, GEMINI, GOOGLE, OPENROUTER, DEEPSEEK, FIREWORKS]

    ProviderPreferenceResponse:
      type: object
      properties:
        provider:
          type: string
          nullable: true
          description: The persisted canonical provider, or null when no preference is set.
          enum: [ANTHROPIC, OPENAI, GEMINI, OPENROUTER, DEEPSEEK, FIREWORKS]

    CreatePatRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Human label for the token (required, non-blank).
        expiresInDays:
          type: integer
          nullable: true
          description: Optional positive number of days until expiry. Omit / null for a token that never expires.

    CreatePatResponse:
      type: object
      properties:
        token:
          type: string
          description: The plaintext credential (`es_pat_…`). Returned exactly once, here, and never retrievable again.
        meta:
          $ref: "#/components/schemas/PatDto"

    PatDto:
      type: object
      description: Secret-free view of a Personal Access Token.
      properties:
        id:
          type: string
        name:
          type: string
        tokenPrefix:
          type: string
          description: Display-only prefix of the plaintext (e.g. `es_pat_AbCdEf`); not the full secret.
        scopes:
          type: string
          description: Currently always `full`.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean

    RunRequest:
      type: object
      required: [userRequest]
      properties:
        userRequest:
          type: string
        executionMode:
          type: string
          enum: [PROTOTYPE, PRODUCTION]
        skipApproval:
          type: boolean
        autoMerge:
          type: boolean
        modelName:
          type: string
        aiProvider:
          type: string
          description: "Canonical value is GEMINI; GOOGLE still accepted as back-compat input alias (rewritten to GEMINI on persist). OpenRouter, DeepSeek, and Fireworks are BYOK/aggregator routes."
          enum:
            [ANTHROPIC, GEMINI, OPENAI, GOOGLE, OPENROUTER, DEEPSEEK, FIREWORKS]
        projectId:
          type: string
          format: uuid
        repoMode:
          type: string
          enum: [FRESH, EXISTING]
        repoUrl:
          type: string
        localExecution:
          type: boolean
          description: >
            P3 local-hands (RL-2026-06-014) — request CLI local-hands mode (worker tool calls
            proxied to the caller's machine; clone / smoke / reviewer / auto-push skipped).
            PAT-only and gated by the `worker.local-hands.enabled` flag; rejected for browser/JWT
            sessions (403) and when the flag is off (409). Transient (not persisted). Default false.
        requireConfirmationBeforeExpensiveContinuation:
          type: boolean
          description: >
            Per-run tightening guard for automatic continuation. When true, selected-candidate
            model step-up / step-down / provider-change recommendations stop as confirmation-required
            before spending on the rerun. This cannot disable an operator-level confirmation
            requirement from server configuration.
        requireBenchmarkPriorForAutomaticContinuation:
          type: boolean
          description: >
            Optional per-run benchmark-confidence guard for automatic continuation. When true,
            selected-candidate model/provider reruns require a compatible benchmark quality prior.
            When false, the run may automatically use the quality-ranked selected candidate even
            when it is unbenchmarked for the task category. Omit to use the server default.

    RunSummary:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            [
              QUEUED,
              PLANNING,
              AWAITING_APPROVAL,
              AWAITING_CLARIFICATION,
              WORKING,
              COMPILING,
              MERGING,
              REVIEWING,
              TESTING,
              COMPLETE,
              PARTIAL,
              FAILED,
              CANCELLED,
              PAUSED,
            ]
        statusReason:
          type: string
          nullable: true
          description: >
            v2.5.10 — explicit reason for the terminal status so the UI can
            explain "PARTIAL because X" instead of a silent badge. One of
            CLEAN_COMPLETION, CLEAN_WITH_INTERMEDIATE_WARNINGS,
            FINAL_BUILD_FAILED, TESTS_FAILED:N_OF_M, REVIEWER_UNRESOLVED,
            REVIEWER_FAILED, ALL_TASKS_FAILED, LEGACY_UNKNOWN. Null on
            in-flight runs and on pre-v2.5.10 terminal runs that were never
            backfilled. Populated by V2RunOrchestrator when scoring.v2-verified
            is on.
        userRequest:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          nullable: true
        aiProvider:
          type: string
        executionMode:
          type: string
        approvedExecutionMode:
          type: string
          nullable: true
          description: "REALTIME or BATCH. Null for pre-V61 runs or runs not yet approved."
        localExecutionRequested:
          type: boolean
          nullable: true
          description: CLI local-hands handshake — true only on submit/detail responses where the client requested local tool execution for this run.
        localExecutionAccepted:
          type: boolean
          nullable: true
          description: CLI local-hands handshake — true only when the backend accepted LOCAL mode and will proxy worker tool calls back to the client.

