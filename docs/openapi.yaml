              properties:
                email:
                  type: string
                  format: email
                orgRole:
                  type: string
                projectIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string

  /org/me/invitations:
    get:
