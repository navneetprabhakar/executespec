      description: |
        Returns a gateway-specific checkout payload. Wave 1 (v2.6.1) adds an
        optional `seats` parameter (1-20) for TEAM tier — Stripe threads it into
        the Checkout Session line_items quantity; Razorpay ignores it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                gateway:
                  type: string
                  enum: [stripe, razorpay]
                successUrl:
                  type: string
                cancelUrl:
                  type: string
                seats:
                  type: integer
                  minimum: 2
                  maximum: 20
                  description: TEAM tier only. Omit for per-seat-quantity=1 (PRO/MAX).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
