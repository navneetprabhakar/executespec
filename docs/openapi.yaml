                    type: string
                  checkoutUrl:
                    type: string
                    description: Stripe — redirect target
                  sessionId:
                    type: string
                    description: Stripe session id
                  gatewaySubscriptionId:
                    type: string
                    description: Razorpay subscription id
                  shortUrl:
                    type: string
                    description: Razorpay checkout short URL
                  razorpayKeyId:
                    type: string

