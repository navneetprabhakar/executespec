  # ──────────────────────────────────────────────────
  # OAUTH2
  # ──────────────────────────────────────────────────
  /auth/oauth2/authorize:
    get:
      tags: [Auth]
      summary: OAuth2 authorization redirect (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        '302':
          description: Redirect to OAuth2 provider

  /auth/oauth2/callback/{provider}:
    get:
      tags: [Auth]
      summary: OAuth2 callback (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JWT issued on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  # ──────────────────────────────────────────────────
  # ONBOARDING (Wave 2)
  # ──────────────────────────────────────────────────
  /onboarding/sample-specs:
    get:
      tags: [Onboarding]
      summary: List onboarding sample specs
      description: Returns the curated sample-spec catalog (web-api / frontend / cli) used by the post-signup welcome flow.
      responses:
        '200':
          description: Sample specs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    surface: { type: string, enum: [HTTP, CLI, STATIC_WEB, LIBRARY] }
                    description: { type: string }
                    expectedTimeMinutes: { type: integer }
                    tags:
                      type: array
                      items: { type: string }

  /onboarding/pick-sample:
    post:
      tags: [Onboarding]
      summary: Launch a sample spec into the caller's sandbox project
      description: Provisions (or reuses) the sandbox project, drops the sample spec into a new run, dispatches via V2RunOrchestrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleId]
              properties:
                sampleId: { type: string }
      responses:
        '202':
          description: Run submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string, format: uuid }
                  projectId: { type: string, format: uuid }

  /onboarding/sandbox-status:
    get:
      tags: [Onboarding]
      summary: Return the caller's sandbox project status
      responses:
        '200':
          description: Sandbox status
          content:
            application/json:
              schema:
                type: object
                properties:
                  provisioned: { type: boolean }
                  projectId: { type: string, format: uuid, nullable: true }
                  lastActivity: { type: string, format: date-time, nullable: true }
                  expiresAt: { type: string, format: date-time, nullable: true }

  # ──────────────────────────────────────────────────
  # TIER LIFECYCLE (Wave 1, SUPER_ADMIN)
  # ──────────────────────────────────────────────────
  /admin/tiers:
    get:
      tags: [Tier Lifecycle]
      summary: List tiers with lifecycle state
      responses:
        '200':
          description: Tier lifecycle rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/TierLifecycleRow'

  /admin/tiers/{tier}:
    put:
      tags: [Tier Lifecycle]
      summary: Transition a tier between LISTED | HIDDEN | SUNSETTING
      description: |
        SUNSETTING transitions require a 14-day `HIDDEN` observation window (enforced
        as 409 Conflict when not yet elapsed). The request body must repeat the
        tier name in `reason` as a typed-name confirmation guard.
      parameters:
        - name: tier
          in: path
          required: true
          schema:
            type: string
            enum: [FREE, PRO, TEAM, MAX, ENTERPRISE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [LISTED, HIDDEN, SUNSETTING] }
                reason: { type: string }
                observationDays: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated lifecycle row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierLifecycleRow'
        '409':
          description: Transition rejected (e.g. SUNSETTING before 14-day HIDDEN window elapses)

  # ──────────────────────────────────────────────────
  # TEAM TRIAL (Wave 3)
  # ──────────────────────────────────────────────────
  /org/trial-request:
    post:
      tags: [Team Trial]
      summary: Submit a TEAM tier trial request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, contactEmail, intendedSeats]
              properties:
                orgId: { type: string, format: uuid }
                contactEmail: { type: string, format: email }
                intendedSeats: { type: integer, minimum: 2, maximum: 20 }
                notes: { type: string }
      responses:
        '201':
          description: Trial request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, APPROVED, REJECTED] }

# ──────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (1h TTL). Obtain via POST /auth/login. Refresh token (7d TTL) set as httpOnly cookie.

  parameters:
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required: [email, firstName, lastName, password]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          minLength: 8
        signupSource:
          type: string
          description: Wave 2 — attribution tag (e.g. `product-hunt`, `direct`, `organic`). Written to `app_user.signup_source`.
        utmSource:
          type: string
        utmMedium:
          type: string
        utmCampaign:
          type: string
        referrer:
          type: string
          description: Wave 2 — caller-captured `document.referrer` at registration time.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        accessToken:
          type: string

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tier:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        role:
          type: string
        orgId:
          type: string
          nullable: true
        githubOwner:
          type: string
          nullable: true
        hasGithubPat:
          type: boolean
        hasOpenAiKey:
          type: boolean
        hasAnthropicKey:
          type: boolean
        hasGeminiKey:
          type: boolean
        hasDeepSeekKey:
          type: boolean
        hasFireworksKey:
          type: boolean
        hasJiraCredentials:
          type: boolean
        hasConfluenceCredentials:
          type: boolean
        viewMode:
          type: string
          enum: [vibe, pro]
        emailVerified:
          type: boolean

    TierPermissions:
      type: object
      properties:
        canCreateRun:
          type: boolean
        canChat:
          type: boolean
        canApplySuggestions:
          type: boolean
        canPreview:
          type: boolean
        canDeploy:
          type: boolean
        monthlyRunLimit:
          type: integer
        runsUsed:
          type: integer
        runsRemaining:
          type: integer

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string

    RunRequest:
      type: object
      required: [userRequest]
      properties:
        userRequest:
          type: string
        executionMode:
          type: string
          enum: [PROTOTYPE, PRODUCTION]
        skipApproval:
          type: boolean
        autoMerge:
          type: boolean
        modelName:
          type: string
        aiProvider:
          type: string
          description: "Canonical value is GEMINI; GOOGLE still accepted as back-compat input alias (rewritten to GEMINI on persist). OpenRouter, DeepSeek, and Fireworks are BYOK/aggregator routes."
          enum: [ANTHROPIC, GEMINI, OPENAI, GOOGLE, OPENROUTER, DEEPSEEK, FIREWORKS]
        projectId:
          type: string
          format: uuid
        repoMode:
          type: string
          enum: [FRESH, EXISTING]
        repoUrl:
          type: string

    RunSummary:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, PLANNING, AWAITING_APPROVAL, AWAITING_CLARIFICATION, WORKING, COMPILING, MERGING, REVIEWING, TESTING, COMPLETE, PARTIAL, FAILED, CANCELLED, PAUSED]
        statusReason:
          type: string
          nullable: true
          description: >
            v2.5.10 — explicit reason for the terminal status so the UI can
            explain "PARTIAL because X" instead of a silent badge. One of
            CLEAN_COMPLETION, CLEAN_WITH_INTERMEDIATE_WARNINGS,
            FINAL_BUILD_FAILED, TESTS_FAILED:N_OF_M, REVIEWER_UNRESOLVED,
            REVIEWER_FAILED, ALL_TASKS_FAILED, LEGACY_UNKNOWN. Null on
            in-flight runs and on pre-v2.5.10 terminal runs that were never
            backfilled. Populated by V2RunOrchestrator when scoring.v2-verified
            is on.
        userRequest:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          nullable: true
        aiProvider:
          type: string
        executionMode:
          type: string
        approvedExecutionMode:
          type: string
          nullable: true
          description: "REALTIME or BATCH. Null for pre-V61 runs or runs not yet approved."

