  # ──────────────────────────────────────────────────
  # VALIDATION REPORT
  # ──────────────────────────────────────────────────
  /runs/{runId}/report:
    get:
      tags: [Validation Report]
      summary: Get validation report
      description: >
        Response includes `verifiedScore` (additive score over delivered code,
        build, tests, reviewer, and critical-issue signals, with trust caps for
        failed review/build/test evidence) plus `accuracyScore` (LLM-inferred,
        secondary). `verifiedScore` is the primary UI badge; `accuracyScore` is
        "Est. requirement coverage". The response also exposes the underlying
        signal fields, `verificationLedger[]`, and `runGoalDecision` so the
        frontend can show which claims are deterministic, LLM-assessed,
        LLM-assisted counts, or internal score summaries, plus whether that
        final evidence proves run completion.
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  id: { type: string }
                  runId: { type: string, format: uuid }
                  filesGenerated: { type: integer }
                  languages:
                    type: array
                    items: { type: string }
                  pipelineResult:
                    type: string
                    enum: [PASSED, PASSED_WITH_FIXES, NEEDS_ATTENTION, FAILED]
                  accuracyScore:
                    type: integer
                    nullable: true
                    description: "LLM-inferred spec-adherence score 0-100. Secondary when verifiedScore is present."
                  accuracyGrade:
                    type: string
                    nullable: true
                    enum: [A, B, C, D, F]
                  codeQualityScore: { type: integer, nullable: true }
                  testCoverageScore: { type: integer, nullable: true }
                  architectureScore: { type: integer, nullable: true }
                  securityScore: { type: integer, nullable: true }
                  performanceScore: { type: integer, nullable: true }
                  designComplianceScore: { type: integer, nullable: true }
                  finalBuildPassed:
                    type: boolean
                    nullable: true
                    description: "v2.5.10 (V106) — did ReviewerAgentV3's final build pass? Authoritative build signal."
                  testsPassed:
                    type: integer
                    nullable: true
                    description: "v2.5.10 (V106) — count of TestResult rows with status=PASS for this run."
                  testsTotal:
                    type: integer
                    nullable: true
                    description: "v2.5.10 (V106) — count of all TestResult rows for this run."
                  reviewerVerdict:
                    type: string
                    nullable: true
                    enum:
                      [CLEAN, FIXED_ISSUES, UNRESOLVED_ISSUES, REVIEW_FAILED]
                    description: "v2.5.10 (V106) — ReviewerResult.Overall enum name at terminal time."
                  verifiedScore:
                    type: integer
                    nullable: true
                    description: >
                      0-100 additive verified score. Computed from CODE_DELIVERED,
                      BUILD, TESTS, REVIEWER, and CRITICALS slots over measured
                      signals, then capped when failed review/build/test/coverage
                      evidence makes a higher headline indefensible.
                  rubricScore:
                    type: integer
                    nullable: true
                    description: "Additive multi-dimension rubric score, nullable for older reports."
                  verificationLedger:
                    type: array
                    description: "Auditable evidence rows behind the headline verifiedScore."
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: tests
                        label:
                          type: string
                          example: Test execution
                        category:
                          type: string
                          example: TESTS
                        status:
                          type: string
                          enum: [PASS, WARN, FAIL, UNKNOWN]
                        source:
                          type: string
                          enum:
                            [
                              DETERMINISTIC,
                              LLM_REVIEWER,
                              LLM_ASSESSMENT,
                              LLM_ASSISTED_COUNT,
                              INTERNAL_FORMULA,
                            ]
                        confidence:
                          type: string
                          enum: [HIGH, MEDIUM, LOW]
                        claim:
                          type: string
                        summary:
                          type: string
                        artifact:
                          type: string
                          nullable: true
                        observed:
                          type: integer
                          nullable: true
                        total:
                          type: integer
                          nullable: true
                  runGoalDecision:
                    type: object
                    nullable: true
                    description: "Conservative run-level goal proof derived from the final validation ledger."
                    properties:
                      state:
                        type: string
                        enum:
                          [
                            DONE,
                            NOT_DONE_BUT_PROGRESSING,
                            BLOCKED,
                            FAILED,
                            UNCERTAIN,
                            WASTE_RISK,
                          ]
                      recommendedDecision:
                        type: string
                        enum:
                          [
                            CONTINUE_SAME_MODEL_PROVIDER,
                            STEP_UP_MODEL,
                            STEP_DOWN_MODEL,
                            CHANGE_PROVIDER,
                            STOP_DONE,
                            STOP_BLOCKED,
                            STOP_FAILED,
                            STOP_WASTE_GUARD,
                          ]
                      reason:
                        type: string
                      recommendedNextStep:
                        type: string
                      goalSummary:
                        type: string
                      completedItems:
                        type: array
                        items: { type: string }
                      incompleteItems:
                        type: array
                        items: { type: string }
                      evidence:
                        type: array
                        items: { type: string }
                      risks:
                        type: array
                        items: { type: string }
                      userInputRequired:
                        type: boolean
                      anotherModelProviderMightHelp:
                        type: boolean

