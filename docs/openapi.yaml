openapi: 3.0.3
info:
  title: ExecuteSpec API
  description: |
    Spec-driven AI coding platform API. Customer submits a natural-language spec
    via POST /api/runs → V2 pipeline plans, codes, builds + tests, opens a PR.

    All endpoints under `/api` require a JWT Bearer token unless explicitly
    marked public (webhooks, public share links, scoped SSE tokens, public
    invites preview, OAuth callback).

    Provider enum: ANTHROPIC (default since 1.0.0-M1), OPENAI, GEMINI. The
    `GOOGLE` alias is accepted on input and rewritten to GEMINI before
    persistence (V120). YAML keys under `model-matrix` / `failover-order` use
    `gemini`.

    Tier ladder (live): FREE (5 runs/month) / PRO ($29, 30 managed runs) /
    TEAM ($39/seat, from 1 seat, BYOK) / ENTERPRISE. The Solo / MAX tiers do
    not exist on dev/main today (V185 retired Solo naming; V165 dropped MAX).

    Run modes: BUILD (default — full V2 pipeline) and PATCH (single thin-agent
    loop against a failing-test spec; powers the 4 autofix surfaces + SWE-bench
    / ProgramBench adapters).

    For the human-readable endpoint inventory grouped by capability, see
    `CLAUDE.md` § API Contracts. For the frontend consumption audit, see
    `frontend-api-usage.md`.
  version: 1.0.0-M1
  contact:
    name: ExecuteSpec
    url: https://executespec.ai

servers:
  - url: https://executespec.ai/api
    description: Production
  - url: https://dev.executespec.ai/api
    description: Development
  - url: http://localhost:8080/api
    description: Local
  - url: https://dev.executespec.ai/api
    description: Development
  - url: http://localhost:8080/api
    description: Local

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication, registration, password management
  - name: User Settings
    description: User-level credentials and preferences
  - name: Runs
    description: Pipeline run lifecycle
  - name: Run Chat
    description: Post-run copilot conversation
  - name: Run Content
    description: Files, messages, timeline for a run
  - name: Preview
    description: Preview container lifecycle (Docker/Cloud Run)
  - name: Deployment
    description: Permanent Cloud Run deployments
  - name: GCP Credentials
    description: GCP service account management for deployments
  - name: Billing
    description: Subscriptions, plans, top-ups
  - name: Invoices
    description: Invoice management and PDF downloads
  - name: Accounting
    description: Revenue, GST, trial balance
  - name: Organization
    description: Org management, members, invitations
  - name: Projects
    description: Project CRUD and member management
  - name: Integrations
    description: Jira, Confluence, Slack integrations
  - name: Validation Report
    description: Code review and test validation reports
  - name: Test Gen
    description: Test generation and execution
  - name: Metrics
    description: Dashboard metrics and analytics
  - name: Admin
    description: Super admin operations
  - name: Health
    description: Liveness and readiness probes
  - name: Models
    description: Available AI models and pricing
  - name: Conversation
    description: Pre-run requirement clarification chat
  - name: SSE
    description: Server-Sent Events for live run updates
  - name: Agent Sessions
    description: V240 — CLI / VS Code agent-session protocol (durable conversations, turns, intent, gates)
  - name: Onboarding
    description: Wave 2 — sandbox provisioning + sample specs for first-run activation
  - name: Tier Lifecycle
    description: Wave 1 — 3-state tier lifecycle admin controls (LISTED | HIDDEN | SUNSETTING)
  - name: Team Trial
    description: Wave 3 — TEAM tier trial request intake

paths:
  # ──────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT issued. Sets httpOnly refresh_token cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Uses httpOnly refresh_token cookie
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/logout:
    delete:
      tags: [Auth]
      summary: Logout
      responses:
        "204":
          description: Session cleared

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email address
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  nullable: true
                newPassword:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/me/permissions:
    get:
      tags: [Auth]
      summary: Get tier-based permissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierPermissions"

  /auth/me/provider-preference:
    get:
      tags: [Auth]
      summary: Get cross-surface AI provider preference (V242)
      description: >
        Returns the account-scoped default AI provider (`app_user.preferred_ai_provider`)
        shared by web, CLI, and VS Code. `provider` is null when no preference has been set
        (callers then fall back to project / YAML defaults).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPreferenceResponse"
    put:
      tags: [Auth]
      summary: Set cross-surface AI provider preference (V242)
      description: >
        Updates the account-scoped default AI provider. The legacy `GOOGLE` alias is accepted
        and rewritten to `GEMINI` before persistence. An unknown or blank provider is rejected
        with 400. Explicit per-run / per-chat provider input still wins and is remembered here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderPreferenceRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPreferenceResponse"
        "400":
          description: provider is required or unknown

  /auth/me/tokens:
    post:
      tags: [Auth]
      summary: Create a Personal Access Token (V215)
      description: >
        Mints a Personal Access Token for programmatic auth (CLI / VS Code / CI). The plaintext
        credential (prefix `es_pat_…`) is returned exactly once in the `token` field of this
        create response and is never persisted or retrievable again — only its SHA-256 hash is
        stored. Clients present it as `Authorization: Bearer es_pat_…` and it resolves to the
        same identity (roles + tenant) a JWT would. Per-tier active-token cap (FREE 1, others 3)
        is enforced by auto-revoking the least-recently-used token — creation never fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatRequest"
      responses:
        "201":
          description: Token created — plaintext returned once in `token`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePatResponse"
        "400":
          description: Token name is required or expiresInDays must be positive
    get:
      tags: [Auth]
      summary: List Personal Access Tokens (V215)
      description: >
        Lists the authenticated user's Personal Access Tokens, newest first. Secret-free — the
        plaintext is never returned after creation; includes revoked rows.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatDto"

  /auth/me/tokens/{tokenId}:
    delete:
      tags: [Auth]
      summary: Revoke a Personal Access Token (V215)
      description: Revokes one of the authenticated user's Personal Access Tokens. Idempotent.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked
        "404":
          description: Token not found

  # ──────────────────────────────────────────────────
  # USER SETTINGS
  # ──────────────────────────────────────────────────
  /auth/settings/github:
    put:
      tags: [User Settings]
      summary: Update GitHub PAT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                githubPat:
                  type: string
                githubOwner:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/settings/github/validate:
    post:
      tags: [User Settings]
      summary: Validate GitHub PAT
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pat:
                  type: string
                owner:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /auth/settings/ai-keys:
    put:
      tags: [User Settings]
      summary: Update AI provider API keys (PRO+ only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openAiApiKey:
                  type: string
                anthropicApiKey:
                  type: string
                geminiApiKey:
                  type: string
                deepSeekApiKey:
                  type: string
                fireworksApiKey:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/settings/jira:
    put:
      tags: [User Settings]
      summary: Update JIRA credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jiraBaseUrl:
                  type: string
                jiraEmail:
                  type: string
                jiraApiToken:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/settings/jira/validate:
    post:
      tags: [User Settings]
      summary: Validate JIRA credentials
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                email:
                  type: string
                apiToken:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /auth/settings/confluence:
    put:
      tags: [User Settings]
      summary: Update Confluence credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confluenceBaseUrl:
                  type: string
                confluenceEmail:
                  type: string
                confluenceApiToken:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  /auth/settings/confluence/validate:
    post:
      tags: [User Settings]
      summary: Validate Confluence credentials
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                email:
                  type: string
                apiToken:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /auth/settings/view-mode:
    put:
      tags: [User Settings]
      summary: Set UI view mode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                viewMode:
                  type: string
                  enum: [vibe, pro]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"

  # ──────────────────────────────────────────────────
  # RUNS
  # ──────────────────────────────────────────────────
  /runs:
    get:
      tags: [Runs]
      summary: List runs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, org]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedRunResponse"
    post:
      tags: [Runs]
      summary: Submit new run
      description: >
        Submits a run (202). Setting `localExecution=true` requests CLI local-hands mode and is
        only honoured for PAT (CLI / VS Code) sessions while the `worker.local-hands.enabled`
        feature flag is on — a browser/JWT session is rejected with 403, and any session is
        rejected with 409 when the flag is off. The response echoes `localExecutionAccepted=true`
        when the backend accepted LOCAL mode. A repeated `Idempotency-Key` header returns the
        original run instead of creating a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: A repeated submit carrying the same key returns the original run (no duplicate, no double-charge).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "403":
          description: localExecution=true requires a PAT (CLI / VS Code) session
        "409":
          description: localExecution=true but worker.local-hands.enabled is off

  /runs/{runId}:
    get:
      tags: [Runs]
      summary: Get run details
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
    delete:
      tags: [Runs]
      summary: Cancel/delete run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "204":
          description: Run deleted

  /runs/{runId}/approve:
    post:
      tags: [Runs]
      summary: Approve or reject plan
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                comment:
                  type: string
      responses:
        "200":
          description: Decision recorded

  /runs/{runId}/clarify:
    post:
      tags: [Runs]
      summary: Provide clarification to planner
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
      responses:
        "200":
          description: Clarification sent

  /runs/{runId}/merge:
    post:
      tags: [Runs]
      summary: Approve or reject merge (legacy)
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        "200":
          description: Decision recorded

  /runs/{runId}/retry:
    post:
      tags: [Runs]
      summary: Retry entire run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"

  /runs/{runId}/pause:
    post:
      tags: [Runs]
      summary: Pause running pipeline
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run paused

  /runs/{runId}/resume:
    post:
      tags: [Runs]
      summary: Resume paused run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run resumed

  /runs/{runId}/rework:
    post:
      tags: [Runs]
      summary: Rework failed run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Rework started

  /runs/{runId}/edit-and-restart:
    post:
      tags: [Runs]
      summary: Edit goal and restart
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"

  /runs/{runId}/tasks/{taskId}/retry:
    post:
      tags: [Runs]
      summary: Retry individual task
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task retry started

  /runs/{runId}/tasks/{taskId}/continuation/approve:
    post:
      tags: [Runs]
      summary: Approve a blocked model/provider continuation
      description: >
        Queues a same-task retry using the provider/model stored on the task's
        blocked continuation decision. Returns 409 unless the task has a `STOP_BLOCKED`
        continuation proposal with a selected candidate and either explicit spend confirmation
        (`policy.requireConfirmationBeforeExpensiveContinuation=true`) or benchmark-confidence
        confirmation (`policy.requireBenchmarkPriorForAutomaticContinuation=true` while the
        selected candidate lacks a benchmark quality prior). If the saved proposal has
        `policy.source=POST_REVIEW`, the approved retry also runs reviewer + validation before
        resolving terminal status.
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Approved continuation queued
          content:
            application/json:
              schema:
                type: object
                required: [status, runId, taskId, provider, model, postReview, message]
                properties:
                  status:
                    type: string
                    example: queued
                  runId:
                    type: string
                  taskId:
                    type: string
                  provider:
                    type: string
                  model:
                    type: string
                  postReview:
                    type: boolean
                    description: True when the approved proposal came from post-review continuation and will rerun reviewer/validation after the worker retry.
                  message:
                    type: string
        "409":
          description: No approval-blocked continuation proposal is available

  /runs/{runId}/archive:
    post:
      tags: [Runs]
      summary: Archive run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Run archived

  /runs/{runId}/cost:
    get:
      tags: [Runs]
      summary: Get live cost estimate
      description: >
        Live token + cost snapshot. W0 telemetry (RL-2026-06-011): live V2 in-progress responses
        (`source=live_tracker`) include cache, reasoning, and call-count fields from the in-memory
        `RunCostTracker`; terminal (`source=stored_total`) and legacy (`source=legacy_estimator`)
        responses return null for those fields. `schemaVersion` is always present.
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  costUsd:
                    type: number
                    format: double
                  schemaVersion:
                    type: integer
                    description: Cost-envelope schema version (currently 1).
                  source:
                    type: string
                    enum: [live_tracker, stored_total, legacy_estimator]
                    description: Where the snapshot came from — live V2 tracker, stored DB totals (terminal), or the legacy estimator.
                  inputTokens:
                    type: integer
                  outputTokens:
                    type: integer
                  cacheReadTokens:
                    type: integer
                    nullable: true
                    description: Cache-read input tokens. Null outside live V2 (source != live_tracker).
                  cacheWriteTokens:
                    type: integer
                    nullable: true
                    description: Cache-write input tokens. Null outside live V2 (source != live_tracker).
                  reasoningTokens:
                    type: integer
                    nullable: true
                    description: Reasoning / thinking tokens (Gemini thinking_tokens, OpenAI/DeepSeek reasoning_tokens). Null outside live V2.
                  calls:
                    type: integer
                    nullable: true
                    description: Count of LLM calls observed so far. Null outside live V2 (source != live_tracker).

  /runs/{runId}/project:
    patch:
      tags: [Runs]
      summary: Update project association
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  nullable: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"

  /runs/{runId}/edit-plan:
    post:
      tags: [Runs]
      summary: Edit run plan with feedback
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

  /runs/{runId}/plan-versions:
    get:
      tags: [Runs]
      summary: Get all plan versions
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ──────────────────────────────────────────────────
  # RUN CHAT (Post-run copilot)
  # ──────────────────────────────────────────────────
  /runs/{runId}/chat:
    get:
      tags: [Run Chat]
      summary: Get chat history
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      tags: [Run Chat]
      summary: Send chat message (PRO+, COMPLETE runs only)
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  messageCount:
                    type: integer
                  maxMessages:
                    type: integer
        "429":
          description: Chat message limit reached

  /runs/{runId}/apply:
    post:
      tags: [Run Chat]
      summary: Apply copilot suggestion (PRO+, COMPLETE runs only)
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [suggestion, source]
              properties:
                suggestion:
                  type: string
                source:
                  type: string
                  enum: [COPILOT, REVIEW]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskCount:
                    type: integer
                  tasks:
                    type: array
                    items:
                      type: object
        "422":
          description: Suggestion too large

  /runs/{runId}/iterate:
    post:
      tags: [Run Chat]
      summary: Create iteration run from source run
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string

  # ──────────────────────────────────────────────────
  # RUN CONTENT
  # ──────────────────────────────────────────────────
  /runs/{runId}/files:
    get:
      tags: [Run Content]
      summary: List workspace files
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /runs/{runId}/file:
    get:
      tags: [Run Content]
      summary: Get single file content
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string

  /runs/{runId}/download:
    get:
      tags: [Run Content]
      summary: Download workspace as ZIP
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /runs/{runId}/messages:
    get:
      tags: [Run Content]
      summary: Get agent message history
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /runs/{runId}/openapi.yaml:
    get:
      tags: [Run Content]
      summary: Get generated OpenAPI spec
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string

  /runs/{runId}/timeline:
    get:
      tags: [Run Content]
      summary: Get run timeline (Gantt chart data)
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /runs/{runId}/task-graph:
    get:
      tags: [Run Content]
      summary: Get task dependency graph
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ──────────────────────────────────────────────────
  # SSE
  # ──────────────────────────────────────────────────
  /runs/{runId}/events:
    get:
      tags: [SSE]
      summary: Subscribe to live run events
      description: |
        Server-Sent Events stream. Requires a scoped SSE token (obtain via GET /runs/{runId}/sse-token).
        Event types: RUN_STATUS, TASK_STATUS, LOG, GATE_OPENED, GATE_RESOLVED, COST_UPDATE,
        QUEUED, COMPLETE, CLARIFICATION_NEEDED, CLARIFICATION_RESOLVED, CONTEXT_EXTRACTED,
        RECOVERY_ATTEMPTED, RUN_RESTARTED, DEPLOY_STARTED, DEPLOY_BUILDING, DEPLOY_PUSHING,
        DEPLOY_LIVE, DEPLOY_FAILED, DEPLOY_DELETED, ENGINE_DEPLOY_STARTED, ENGINE_PHASE,
        ENGINE_BUILDING, ENGINE_DEPLOYING, ENGINE_DEPLOY_LIVE, ENGINE_DEPLOY_FAILED,
        API_SPEC_READY, PREVIEW_READY, VALIDATION_STARTED, VALIDATION_PASSED, VALIDATION_FAILED,
        MODEL_ESCALATED, COMPACTION_TRIGGERED, REVIEW_STARTED, REVIEW_ISSUE_FOUND,
        REVIEW_AUTO_FIX_STARTED, REVIEW_AUTO_FIX_RESULT, REVIEW_COMPLETE,
        TEST_GEN_STARTED, TEST_PLANNING_STARTED, TEST_PLANNING_COMPLETED,
        TEST_GENERATION_STARTED, TEST_COMPILATION_STARTED, TEST_COMPILATION_PASSED,
        TEST_COMPILATION_FAILED, TEST_EXECUTION_STARTED, TEST_EXECUTION_SKIPPED,
        TEST_REPORT_READY, TEST_PIPELINE_FAILED, BUDGET_EXCEEDED
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Scoped SSE token from GET /runs/{runId}/sse-token
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /runs/{runId}/sse-token:
    get:
      tags: [SSE]
      summary: Get scoped SSE token (5-min TTL)
      description: Returns a short-lived token scoped to a specific runId for use with the SSE event stream.
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  # ──────────────────────────────────────────────────
  # AGENT SESSIONS (V240 — CLI / VS Code agent protocol)
  # ──────────────────────────────────────────────────
  /agent/sessions:
    post:
      tags: [Agent Sessions]
      summary: Create an agent session
      description: >
        Creates a durable CLI / VS Code conversation shell. This is NOT a billable
        `pipeline_run` — open-ended conversation can inspect, interpret, or propose work
        without becoming an execution run. An explicit `defaultProvider` updates the
        cross-surface account provider preference; omitted input resolves from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
    get:
      tags: [Agent Sessions]
      summary: List the caller's agent sessions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSessionResponse"

  /agent/sessions/{sessionId}:
    get:
      tags: [Agent Sessions]
      summary: Get one agent session
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"

  /agent/sessions/{sessionId}/events:
    get:
      tags: [Agent Sessions]
      summary: List the session's append-only action events
      description: >
        Returns the persisted `agent_action_event` rows for the session (action + intent-decision
        history). This is a plain JSON list, not an SSE stream — live token / tool streaming is on
        `POST /agent/sessions/{sessionId}/turns/stream`.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentActionEvent"

  /agent/sessions/{sessionId}/turns:
    get:
      tags: [Agent Sessions]
      summary: List persisted turns for one agent session
      description: >
        Reloadable transcript endpoint for web, CLI, and VS Code agent sessions. Results are
        returned newest-window style with optional `before` pagination and ownership checks.
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTurnResponse"
    post:
      tags: [Agent Sessions]
      summary: Record a conversational turn (non-streaming)
      description: >
        Records one user-visible turn and returns the deterministic intent decision. Cost-bearing
        or destructive proposals (create/approve a run, local code task) are returned as typed
        confirmation-required actions and are never executed implicitly from ambiguous chat text.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResponse"

  /agent/sessions/{sessionId}/summary-email:
    post:
      tags: [Agent Sessions]
      summary: Deprecated no-op session summary email route
      description: >
        Compatibility endpoint for older local clients. New CLI / VS Code sessions keep usage and
        cost visibility locally and this route returns 202 without sending email.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSummaryEmailRequest"
      responses:
        "202":
          description: Accepted no-op

  /agent/sessions/{sessionId}/turns/stream:
    post:
      tags: [Agent Sessions]
      summary: Stream a conversational turn (SSE)
      description: |
        Server-Sent Events stream for a streaming chat turn. Records a durable turn + usage
        (`agent_usage_ledger`, `billingPolicy=INCLUDED`). Requires the `spec.chat.enabled` feature
        flag for real chat output; when off, the stream still completes with an explanatory `done`.
        When the session carries a `projectId`, the project/code tool surface is bound so the turn
        can answer grounded project questions in addition to run-control proposals.
        Event names: `ack`, `token` ({delta}), `tool_call` ({tool, args, id}),
        `tool_result` ({id, result}), `done` ({session_id, turn_id, turn_count, cost_usd,
        input_tokens, output_tokens, reasoning_tokens}), `error` ({session_id, turn_id, message}).
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamTurnRequest"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /agent/v2/capabilities:
    get:
      tags: [Agent Sessions]
      summary: List capability tools for the current surface
      description: >
        Returns the executable/readable agent tool contract visible to the caller. WEB responses
        intentionally exclude CLI/VS Code-only local-hands capabilities.
      parameters:
        - name: surface
          in: query
          required: false
          schema:
            type: string
            default: CLI
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityTool"

  /agent/v2/sessions/{sessionId}/actions/plan:
    post:
      tags: [Agent Sessions]
      summary: Plan one typed agent action
      description: Persists the proposed action lifecycle row and returns the matching capability metadata.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionPlanRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlanResponse"

  /agent/v2/sessions/{sessionId}/actions/{actionId}/events:
    post:
      tags: [Agent Sessions]
      summary: Append an action lifecycle event
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionEventRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRecordResponse"

  /agent/v2/sessions/{sessionId}/actions/{actionId}/result:
    post:
      tags: [Agent Sessions]
      summary: Record a typed action result
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResultRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRecordResponse"

  /orchestrator/turn:
    post:
      tags: [Agent Sessions]
      summary: Route one conversational turn without creating a run
      description: >
        Primary structured orchestrator endpoint for CLI, VS Code, and web agent turns. It
        authenticates the session, applies deterministic routing and policy gates, persists an
        `ORCHESTRATOR_DECISION` trace event, and returns the route/proposed action. It never
        submits a new run; clients must explicitly confirm any returned execution proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestratorTurnRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorTurnResponse"

  /orchestrator/turn/confirm:
    post:
      tags: [Agent Sessions]
      summary: Confirm a stored orchestrator run proposal
      description: >
        Explicit confirmation endpoint for a prior `CODE_RUN_REQUIRED` decision. The server replays
        the stored `ORCHESTRATOR_DECISION`, rejects non-run routes and missing confirmation, then
        submits through the confirmed run-submission gate exactly once and links the agent turn to
        the created run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestratorRunConfirmationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorRunConfirmationResponse"

  /admin/eval/orchestrator-routing/run:
    post:
      tags: [Admin]
      summary: Run optional live model-prompt eval for orchestrator routing
      description: >
        SUPER_ADMIN-only operator endpoint. Runs the routing JSONL corpus against selected provider
        prompts through live model calls. The deterministic corpus test remains the CI gate; this
        endpoint is for credentialed model-prompt evals and returns both structured JSON results
        and a Markdown report artifact.
      parameters:
        - name: providers
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated provider list, e.g. openai,anthropic,gemini,deepseek.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Optional row limit for smoke runs.
      responses:
        "200":
          description: Routing eval report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/test-managed-ai-email:
    post:
      tags: [Admin]
      summary: Dispatch a managed-AI routing email smoke
      description: >
        SUPER_ADMIN-only operator endpoint for deployed Gmail OAuth validation. Sends through the
        same BillingNotificationService path used by managed-AI routing-state transition emails,
        but does not create usage ledger rows or notification dedupe records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  format: email
                routingState:
                  type: string
                  enum: [FRONTIER_LOCKED, CHEAP_ONLY, EXHAUSTED]
                  default: CHEAP_ONLY
      responses:
        "200":
          description: Email dispatch accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /agent/actions:
    get:
      tags: [Agent Sessions]
      summary: List the agent action catalog
      description: >
        Static action descriptors used to ground CLI / VS Code intent routing (e.g. `chat_answer`,
        `list_gates`, `inspect_gate`, `approve_run`, `reject_run`, `create_run`, `local_code_task`,
        `resolve_project`).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentActionDescriptor"

  /agent/intent/interpret:
    post:
      tags: [Agent Sessions]
      summary: Interpret a message into a typed intent decision
      description: >
        Conservative rule-based first-pass intent classification. Returns the intent, a confidence,
        and — for cost-bearing or destructive intents — a typed proposed action that requires an
        explicit follow-up confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretIntentRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentDecision"

  /agent/context/resolve:
    post:
      tags: [Agent Sessions]
      summary: Resolve the current repository to a linked project
      description: Maps a git remote / repo name to a linked ExecuteSpec project + repo, when one matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextResolveRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResolveResponse"

  /agent/gates:
    get:
      tags: [Agent Sessions]
      summary: List plan gates awaiting approval
      description: Returns decision cards for runs paused at the plan-approval gate.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateDecisionCard"

  /agent/gates/{runId}:
    get:
      tags: [Agent Sessions]
      summary: Get the plan-gate decision card for one run
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateDecisionCard"

  # ──────────────────────────────────────────────────
  # PREVIEW
  # ──────────────────────────────────────────────────
  /runs/{runId}/preview/analyze:
    get:
      tags: [Preview]
      summary: Analyze preview requirements
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  databaseType:
                    type: string
                    nullable: true
                    enum: [POSTGRESQL, MYSQL, MONGODB, REDIS]
                  requiredEnvVars:
                    type: array
                    items:
                      type: string

  /runs/{runId}/preview/status:
    get:
      tags: [Preview]
      summary: Get preview status
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStatus"

  /runs/{runId}/preview/start:
    post:
      tags: [Preview]
      summary: Start preview container
      parameters:
        - $ref: "#/components/parameters/runId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                envVars:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStatus"

  /runs/{runId}/preview/stop:
    delete:
      tags: [Preview]
      summary: Stop preview container
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Preview stopped

  /runs/{runId}/preview/logs:
    get:
      tags: [Preview]
      summary: Get preview container logs
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: lines
          in: query
          schema:
            type: integer
            default: 100
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, backend, frontend, db]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  lines:
                    type: array
                    items:
                      type: string

  /runs/{runId}/preview/probe-api-docs:
    get:
      tags: [Preview]
      summary: Probe for OpenAPI/Swagger docs
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  path:
                    type: string
                  contentType:
                    type: string

  /runs/{runId}/push-github:
    post:
      tags: [Deployment]
      summary: Push workspace to GitHub (creates branch + PR)
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: repoUrl
          in: query
          schema:
            type: string
        - name: repoMode
          in: query
          schema:
            type: string
            enum: [NEW, EXISTING]
            default: NEW
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  repoUrl:
                    type: string

  # ──────────────────────────────────────────────────
  # DEPLOYMENT
  # ──────────────────────────────────────────────────
  /deployments:
    get:
      tags: [Deployment]
      summary: List deployments
      parameters:
        - name: runId
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeploymentSummary"
    post:
      tags: [Deployment]
      summary: Create deployment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runId]
              properties:
                runId:
                  type: string
                strategy:
                  type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"

  /deployments/{id}:
    get:
      tags: [Deployment]
      summary: Get deployment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"
    delete:
      tags: [Deployment]
      summary: Delete deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /deployments/analyze:
    post:
      tags: [Deployment]
      summary: Analyze run for deploy readiness
      parameters:
        - name: runId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest:
                    type: object
                  decision:
                    type: string
                  hasGcpCredentials:
                    type: boolean

  /deployments/confirm:
    post:
      tags: [Deployment]
      summary: Confirm and deploy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runId, deploymentPath]
              properties:
                runId:
                  type: string
                deploymentPath:
                  type: string
                region:
                  type: string
                envVars:
                  type: object
                  additionalProperties:
                    type: string
                manifestJson:
                  type: string
                healthCheckPath:
                  type: string
                appPort:
                  type: integer
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"

  # ──────────────────────────────────────────────────
  # GCP CREDENTIALS
  # ──────────────────────────────────────────────────
  /credentials/gcp:
