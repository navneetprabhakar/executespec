openapi: 3.0.3
info:
  title: ExecuteSpec API
  description: |
    Spec-driven AI coding platform API. Customer submits a natural-language spec
    via POST /api/runs → V2 pipeline plans, codes, builds + tests, opens a PR.

    All endpoints under `/api` require a JWT Bearer token unless explicitly
    marked public (webhooks, public share links, scoped SSE tokens, public
    invites preview, OAuth callback).

    Provider enum: ANTHROPIC (default since 1.0.0-M1), OPENAI, GEMINI. The
    `GOOGLE` alias is accepted on input and rewritten to GEMINI before
    persistence (V120). YAML keys under `model-matrix` / `failover-order` use
    `gemini`.

    Tier ladder (live): FREE / PRO (HIDDEN — grandfathered) / TEAM ($39/seat,
    min 2, BYOK) / ENTERPRISE. The Solo / MAX tiers do not exist on dev/main
    today (V179/V185 retired Solo + the V143 product-split discriminator).

    Run modes: BUILD (default — full V2 pipeline) and PATCH (single thin-agent
    loop against a failing-test spec; powers the 4 autofix surfaces + SWE-bench
    / ProgramBench adapters).

    For the human-readable endpoint inventory grouped by capability, see
    `CLAUDE.md` § API Contracts. For the frontend consumption audit, see
    `frontend-api-usage.md`.
  version: 1.0.0-M1
  contact:
    name: ExecuteSpec
    url: https://executespec.ai

servers:
  - url: https://executespec.ai/api
    description: Production
  - url: https://dev.executespec.ai/api
    description: Development
  - url: http://localhost:8080/api
    description: Local
  - url: https://dev.executespec.ai/api
    description: Development
  - url: http://localhost:8080/api
    description: Local

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication, registration, password management
  - name: User Settings
    description: User-level credentials and preferences
  - name: Runs
    description: Pipeline run lifecycle
  - name: Run Chat
    description: Post-run copilot conversation
  - name: Run Content
    description: Files, messages, timeline for a run
  - name: Preview
    description: Preview container lifecycle (Docker/Cloud Run)
  - name: Deployment
    description: Permanent Cloud Run deployments
  - name: GCP Credentials
    description: GCP service account management for deployments
  - name: Billing
    description: Subscriptions, plans, top-ups
  - name: Invoices
    description: Invoice management and PDF downloads
  - name: Accounting
    description: Revenue, GST, trial balance
  - name: Organization
    description: Org management, members, invitations
  - name: Projects
    description: Project CRUD and member management
  - name: Integrations
    description: Jira, Confluence, Slack integrations
  - name: Validation Report
    description: Code review and test validation reports
  - name: Test Gen
    description: Test generation and execution
  - name: Metrics
    description: Dashboard metrics and analytics
  - name: Admin
    description: Super admin operations
  - name: Health
    description: Liveness and readiness probes
  - name: Models
    description: Available AI models and pricing
  - name: Conversation
    description: Pre-run requirement clarification chat
  - name: SSE
    description: Server-Sent Events for live run updates
  - name: Onboarding
    description: Wave 2 — sandbox provisioning + sample specs for first-run activation
  - name: Tier Lifecycle
    description: Wave 1 — 3-state tier lifecycle admin controls (LISTED | HIDDEN | SUNSETTING)
  - name: Team Trial
    description: Wave 3 — TEAM tier trial request intake

paths:
  # ──────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued. Sets httpOnly refresh_token cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Uses httpOnly refresh_token cookie
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/logout:
    delete:
      tags: [Auth]
      summary: Logout
      responses:
        '204':
          description: Session cleared

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email address
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification email
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  nullable: true
                newPassword:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/me/permissions:
    get:
      tags: [Auth]
      summary: Get tier-based permissions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierPermissions'

  # ──────────────────────────────────────────────────
  # USER SETTINGS
  # ──────────────────────────────────────────────────
  /auth/settings/github:
    put:
      tags: [User Settings]
      summary: Update GitHub PAT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                githubPat:
                  type: string
                githubOwner:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/settings/github/validate:
    post:
      tags: [User Settings]
      summary: Validate GitHub PAT
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pat:
                  type: string
                owner:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /auth/settings/ai-keys:
    put:
      tags: [User Settings]
      summary: Update AI provider API keys (PRO+ only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openAiApiKey:
                  type: string
                anthropicApiKey:
                  type: string
                geminiApiKey:
                  type: string
                deepSeekApiKey:
                  type: string
                fireworksApiKey:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/settings/jira:
    put:
      tags: [User Settings]
      summary: Update JIRA credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jiraBaseUrl:
                  type: string
                jiraEmail:
                  type: string
                jiraApiToken:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/settings/jira/validate:
    post:
      tags: [User Settings]
      summary: Validate JIRA credentials
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                email:
                  type: string
                apiToken:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /auth/settings/confluence:
    put:
      tags: [User Settings]
      summary: Update Confluence credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confluenceBaseUrl:
                  type: string
                confluenceEmail:
                  type: string
                confluenceApiToken:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /auth/settings/confluence/validate:
    post:
      tags: [User Settings]
      summary: Validate Confluence credentials
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                email:
                  type: string
                apiToken:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /auth/settings/view-mode:
    put:
      tags: [User Settings]
      summary: Set UI view mode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                viewMode:
                  type: string
                  enum: [vibe, pro]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  # ──────────────────────────────────────────────────
  # RUNS
  # ──────────────────────────────────────────────────
  /runs:
    get:
      tags: [Runs]
      summary: List runs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, org]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRunResponse'
    post:
      tags: [Runs]
      summary: Submit new run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'

  /runs/{runId}:
    get:
      tags: [Runs]
      summary: Get run details
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
    delete:
      tags: [Runs]
      summary: Cancel/delete run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '204':
          description: Run deleted

  /runs/{runId}/approve:
    post:
      tags: [Runs]
      summary: Approve or reject plan
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                comment:
                  type: string
      responses:
        '200':
          description: Decision recorded

  /runs/{runId}/clarify:
    post:
      tags: [Runs]
      summary: Provide clarification to planner
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
      responses:
        '200':
          description: Clarification sent

  /runs/{runId}/merge:
    post:
      tags: [Runs]
      summary: Approve or reject merge (legacy)
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        '200':
          description: Decision recorded

  /runs/{runId}/retry:
    post:
      tags: [Runs]
      summary: Retry entire run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'

  /runs/{runId}/pause:
    post:
      tags: [Runs]
      summary: Pause running pipeline
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Run paused

  /runs/{runId}/resume:
    post:
      tags: [Runs]
      summary: Resume paused run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Run resumed

  /runs/{runId}/rework:
    post:
      tags: [Runs]
      summary: Rework failed run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Rework started

  /runs/{runId}/edit-and-restart:
    post:
      tags: [Runs]
      summary: Edit goal and restart
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'

  /runs/{runId}/tasks/{taskId}/retry:
    post:
      tags: [Runs]
      summary: Retry individual task
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task retry started

  /runs/{runId}/archive:
    post:
      tags: [Runs]
      summary: Archive run
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: Run archived

  /runs/{runId}/cost:
    get:
      tags: [Runs]
      summary: Get live cost estimate
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  costUsd:
                    type: number
                    format: double

  /runs/{runId}/project:
    patch:
      tags: [Runs]
      summary: Update project association
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'

  /runs/{runId}/edit-plan:
    post:
      tags: [Runs]
      summary: Edit run plan with feedback
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

  /runs/{runId}/plan-versions:
    get:
      tags: [Runs]
      summary: Get all plan versions
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ──────────────────────────────────────────────────
  # RUN CHAT (Post-run copilot)
  # ──────────────────────────────────────────────────
  /runs/{runId}/chat:
    get:
      tags: [Run Chat]
      summary: Get chat history
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
    post:
      tags: [Run Chat]
      summary: Send chat message (PRO+, COMPLETE runs only)
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  messageCount:
                    type: integer
                  maxMessages:
                    type: integer
        '429':
          description: Chat message limit reached

  /runs/{runId}/apply:
    post:
      tags: [Run Chat]
      summary: Apply copilot suggestion (PRO+, COMPLETE runs only)
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [suggestion, source]
              properties:
                suggestion:
                  type: string
                source:
                  type: string
                  enum: [COPILOT, REVIEW]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskCount:
                    type: integer
                  tasks:
                    type: array
                    items:
                      type: object
        '422':
          description: Suggestion too large

  /runs/{runId}/iterate:
    post:
      tags: [Run Chat]
      summary: Create iteration run from source run
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userRequest]
              properties:
                userRequest:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string

  # ──────────────────────────────────────────────────
  # RUN CONTENT
  # ──────────────────────────────────────────────────
  /runs/{runId}/files:
    get:
      tags: [Run Content]
      summary: List workspace files
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /runs/{runId}/file:
    get:
      tags: [Run Content]
      summary: Get single file content
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string

  /runs/{runId}/download:
    get:
      tags: [Run Content]
      summary: Download workspace as ZIP
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /runs/{runId}/messages:
    get:
      tags: [Run Content]
      summary: Get agent message history
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /runs/{runId}/openapi.yaml:
    get:
      tags: [Run Content]
      summary: Get generated OpenAPI spec
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string

  /runs/{runId}/timeline:
    get:
      tags: [Run Content]
      summary: Get run timeline (Gantt chart data)
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /runs/{runId}/task-graph:
    get:
      tags: [Run Content]
      summary: Get task dependency graph
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ──────────────────────────────────────────────────
  # SSE
  # ──────────────────────────────────────────────────
  /runs/{runId}/events:
    get:
      tags: [SSE]
      summary: Subscribe to live run events
      description: |
        Server-Sent Events stream. Requires a scoped SSE token (obtain via GET /runs/{runId}/sse-token).
        Event types: RUN_STATUS, TASK_STATUS, LOG, GATE_OPENED, GATE_RESOLVED, COST_UPDATE,
        QUEUED, COMPLETE, CLARIFICATION_NEEDED, CLARIFICATION_RESOLVED, CONTEXT_EXTRACTED,
        RECOVERY_ATTEMPTED, RUN_RESTARTED, DEPLOY_STARTED, DEPLOY_BUILDING, DEPLOY_PUSHING,
        DEPLOY_LIVE, DEPLOY_FAILED, DEPLOY_DELETED, ENGINE_DEPLOY_STARTED, ENGINE_PHASE,
        ENGINE_BUILDING, ENGINE_DEPLOYING, ENGINE_DEPLOY_LIVE, ENGINE_DEPLOY_FAILED,
        API_SPEC_READY, PREVIEW_READY, VALIDATION_STARTED, VALIDATION_PASSED, VALIDATION_FAILED,
        MODEL_ESCALATED, COMPACTION_TRIGGERED, REVIEW_STARTED, REVIEW_ISSUE_FOUND,
        REVIEW_AUTO_FIX_STARTED, REVIEW_AUTO_FIX_RESULT, REVIEW_COMPLETE,
        TEST_GEN_STARTED, TEST_PLANNING_STARTED, TEST_PLANNING_COMPLETED,
        TEST_GENERATION_STARTED, TEST_COMPILATION_STARTED, TEST_COMPILATION_PASSED,
        TEST_COMPILATION_FAILED, TEST_EXECUTION_STARTED, TEST_EXECUTION_SKIPPED,
        TEST_REPORT_READY, TEST_PIPELINE_FAILED, BUDGET_EXCEEDED
      parameters:
        - $ref: '#/components/parameters/runId'
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Scoped SSE token from GET /runs/{runId}/sse-token
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /runs/{runId}/sse-token:
    get:
      tags: [SSE]
      summary: Get scoped SSE token (5-min TTL)
      description: Returns a short-lived token scoped to a specific runId for use with the SSE event stream.
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  # ──────────────────────────────────────────────────
  # PREVIEW
  # ──────────────────────────────────────────────────
  /runs/{runId}/preview/analyze:
    get:
      tags: [Preview]
      summary: Analyze preview requirements
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          content:
