      tags: [Integrations]
      summary: Send test notification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ──────────────────────────────────────────────────
  # CONVERSATION (Pre-run)
  # ──────────────────────────────────────────────────
  /conversation:
    post:
      tags: [Conversation]
      summary: Pre-run requirement clarification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string

  # ──────────────────────────────────────────────────
  # MODELS & PRICING
  # ──────────────────────────────────────────────────
  /models/available:
    get:
      tags: [Models]
      summary: List available AI models
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /pricing:
    get:
      tags: [Models]
      summary: List all model pricing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /feasibility:
    post:
      tags: [Models]
      summary: Pre-run feasibility estimate
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
                provider:
                  type: string
                model:
                  type: string
                budgetUsd:
                  type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────────
  # HEALTH
  # ──────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [UP, DEGRADED]
                  uptimeMs:
                    type: integer
                    format: int64
                  uptime:
                    type: string
                  activeRuns:
                    type: integer
                  db:
                    type: string
                  redis:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database not reachable

  # ──────────────────────────────────────────────────
  # WEBHOOKS
  # ──────────────────────────────────────────────────
  /webhooks/razorpay:
    post:
      tags: [Billing]
      summary: Razorpay payment webhook (HMAC verified)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  /webhooks/stripe:
    post:
      tags: [Billing]
      summary: Stripe payment webhook (Stripe-Signature verified)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Webhook processed

  # ──────────────────────────────────────────────────
  # FEATURE FLAGS
  # ──────────────────────────────────────────────────
  /admin/feature-flags:
    get:
      tags: [Admin]
      summary: List all feature flags (SUPER_ADMIN)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    flagKey:
                      type: string
                    flagValue:
                      type: string
                    valueType:
                      type: string
                    scope:
                      type: string
                    description:
                      type: string
                    updatedBy:
                      type: string
                    updatedAt:
                      type: string

  /admin/feature-flags/{key}:
    put:
      tags: [Admin]
      summary: Update feature flag value (SUPER_ADMIN)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────────
  # ADMIN
  # ──────────────────────────────────────────────────
  /admin/payment-audit:
    get:
      tags: [Admin]
      summary: Payment audit log (paginated, SUPER_ADMIN)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /admin/payment-audit/export:
    get:
      tags: [Admin]
      summary: Export payment audit as CSV (SUPER_ADMIN)
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string

  /admin/webhook-events:
    get:
      tags: [Admin]
      summary: Webhook event log (filterable, SUPER_ADMIN)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: gateway
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  /billing/payment-history:
    get:
      tags: [Billing]
      summary: Org-scoped payment history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────────
  # OAUTH2
  # ──────────────────────────────────────────────────
  /auth/oauth2/authorize:
    get:
      tags: [Auth]
      summary: OAuth2 authorization redirect (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        '302':
          description: Redirect to OAuth2 provider

  /auth/oauth2/callback/{provider}:
    get:
      tags: [Auth]
      summary: OAuth2 callback (Google/GitHub)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JWT issued on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

# ──────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (1h TTL). Obtain via POST /auth/login. Refresh token (7d TTL) set as httpOnly cookie.

  parameters:
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required: [email, firstName, lastName, password]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        accessToken:
          type: string

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tier:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        role:
          type: string
        orgId:
          type: string
          nullable: true
        githubOwner:
          type: string
          nullable: true
        hasGithubPat:
          type: boolean
        hasOpenAiKey:
          type: boolean
        hasAnthropicKey:
          type: boolean
        hasGeminiKey:
          type: boolean
        hasJiraCredentials:
          type: boolean
        hasConfluenceCredentials:
          type: boolean
        viewMode:
          type: string
          enum: [vibe, pro]
        emailVerified:
          type: boolean

    TierPermissions:
      type: object
      properties:
        canCreateRun:
          type: boolean
        canChat:
          type: boolean
        canApplySuggestions:
          type: boolean
        canPreview:
          type: boolean
        canDeploy:
          type: boolean
        monthlyRunLimit:
          type: integer
        runsUsed:
          type: integer
        runsRemaining:
          type: integer

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string

    RunRequest:
      type: object
      required: [userRequest]
      properties:
        userRequest:
          type: string
        executionMode:
          type: string
          enum: [PROTOTYPE, PRODUCTION]
        skipApproval:
          type: boolean
        autoMerge:
          type: boolean
        modelName:
          type: string
        aiProvider:
          type: string
          enum: [ANTHROPIC, GOOGLE, OPENAI]
        projectId:
          type: string
          format: uuid
        repoMode:
          type: string
          enum: [FRESH, EXISTING]
        repoUrl:
          type: string

    RunSummary:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, PLANNING, AWAITING_APPROVAL, AWAITING_CLARIFICATION, WORKING, COMPILING, MERGING, REVIEWING, TESTING, COMPLETE, FAILED, CANCELLED, PAUSED]
        userRequest:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          nullable: true
        aiProvider:
          type: string
        executionMode:
          type: string
        approvedExecutionMode:
          type: string
          nullable: true
          description: "REALTIME or BATCH. Null for pre-V61 runs or runs not yet approved."

    RunDetail:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
        userRequest:
          type: string
        plan:
          type: object
          nullable: true
        tasks:
          type: array
          items:
            type: object
        review:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
          nullable: true
        aiProvider:
          type: string
        executionMode:
          type: string
        actualCostUsd:
          type: number
          nullable: true
        githubPrUrl:
          type: string
          nullable: true
          description: GitHub PR URL for existing-repo runs

    PagedRunResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    PreviewStatus:
      type: object
      properties:
        status:
          type: string
          enum: [STARTING, RUNNING, FAILED, STOPPED, TIMED_OUT]
        url:
          type: string
          nullable: true
        projectType:
          type: string
          nullable: true
        databaseType:
          type: string
          nullable: true
        ttlRemainingSeconds:
          type: integer
        error:
          type: string
          nullable: true

    DeploymentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        status:
          type: string
        serviceUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    BillingPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        monthlyPriceInr:
          type: integer
        monthlyPriceUsd:
          type: integer
        monthlyRunLimit:
          type: integer
        features:
          type: array
          items:
            type: string

    BillingStatus:
      type: object
      properties:
        subscription:
          type: object
          nullable: true
        plan:
          $ref: '#/components/schemas/BillingPlan'
        usage:
          type: array
          items:
            type: object
        bonusRuns:
          type: integer
        tier:
          type: string

    OrgDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        tier:
          type: string
        status:
          type: string
        keySourceMode:
          type: string
        enabledProviders:
          type: array
          items:
            type: string

    ProjectDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        aiProvider:
          type: string
          nullable: true
        orgId:
          type: string
          format: uuid
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
