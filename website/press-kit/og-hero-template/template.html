<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --surface: #14171C;
    --surface-2: #1B1F26;
    --surface-border: #242A33;
    --text-main: #ECEEF2;
    --text-muted: #8A94A6;
    --text-secondary: #C9D1DB;
    --blue: #5B8DEF;
    --blue-light: #7AA5F5;
    --purple: #A78BFA;
    --yellow: #FBBF24;
    --green: #17B169;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Subtle radial glow bg */
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(91,141,239,0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(167,139,250,0.06) 0%, transparent 45%);
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 540px 1fr;
    width: 1200px; height: 630px;
  }
  /* LEFT: text panel */
  .left {
    padding: 56px 40px 48px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, #5B8DEF 0%, #7AD1C8 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'JetBrains Mono', monospace;
    font-weight: 900; font-size: 16px; letter-spacing: -0.5px;
    box-shadow: 0 2px 10px rgba(91,141,239,0.35);
  }
  .brand-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 600;
    color: var(--text-main); letter-spacing: -0.3px;
  }
  .chip {
    display: inline-flex; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 999px;
    color: var(--yellow);
    border: 1px solid var(--yellow);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(251, 191, 36, 0.05);
    align-self: flex-start;
  }
  .headline {
    font-size: 52px; font-weight: 700;
    line-height: 1.07; letter-spacing: -0.02em;
    color: var(--text-main);
    margin-top: 14px;
  }
  .headline .it {
    font-family: 'Instrument Serif', serif;
    font-style: italic; font-weight: 400;
    background: linear-gradient(to right, #F97316, #FBBF24);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0;
  }
  .sub {
    font-size: 17px; line-height: 1.5;
    color: var(--text-secondary);
    margin-top: 18px;
    max-width: 410px;
  }
  .foot {
    display: flex; flex-direction: column; gap: 14px;
    align-items: flex-start;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 500;
    padding: 10px 16px; border-radius: 999px;
    color: var(--text-main);
    background: rgba(91,141,239,0.12);
    border: 1px solid rgba(91,141,239,0.35);
    white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: var(--blue-light); font-weight: 500;
    letter-spacing: 0.02em;
  }
  /* RIGHT: screenshot panel */
  .right {
    position: relative;
    padding: 56px 52px 56px 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .frame {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(91,141,239,0.08),
      0 0 80px rgba(91,141,239,0.08);
  }
  /* window chrome */
  .chrome {
    position: absolute; top: 0; left: 0; right: 0; height: 28px;
    background: #0E1116;
    border-bottom: 1px solid var(--surface-border);
    display: flex; align-items: center; padding: 0 12px; gap: 6px;
    z-index: 2;
  }
  .chrome i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chrome i:nth-child(1) { background: #FF5F57; }
  .chrome i:nth-child(2) { background: #FEBC2E; }
  .chrome i:nth-child(3) { background: #28C840; }
  /* screenshot — tight crop on Verified Score + Quality Dimensions panel */
  .shot-wrap {
    position: absolute;
    top: 28px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: #0B0D10;
  }
  .shot-wrap img {
    position: absolute;
    /* Source is 2880x1800 retina (1440x900 CSS).
       Crop focal: starts just above "Validation Report" header (~y=440 retina)
       and shows the full BUILD | Verified-80 ring | REVIEWER row +
       QUALITY DIMENSIONS bars (~y=1500 retina).
       Horizontal: right pane begins ~x=940 retina, content ends ~x=2800.
       That's a 1860×1060 region, fitting the 588×490 frame at ~0.48 width-scale
       (favours showing the score ring big rather than the whole panel). */
    width: 1520px;   /* scale = 1520/2880 ≈ 0.528 */
    height: auto;
    top: -230px;     /* −(440 retina × 0.528) ≈ −232 */
    left: -500px;    /* −(940 retina × 0.528) ≈ −496 */
  }
  /* Soft bottom gradient to draw eye upward */
  .frame::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
    background: linear-gradient(to top, rgba(11,13,16,0.55), transparent);
    pointer-events: none;
    z-index: 1;
  }
  /* Accent glow behind the frame */
  .right::before {
    content: ''; position: absolute;
    top: 50%; right: 52px; transform: translateY(-50%);
    width: 60%; height: 60%;
    background: radial-gradient(ellipse at center, rgba(122,209,200,0.15) 0%, transparent 65%);
    filter: blur(40px); pointer-events: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div>
        <div class="brand">
          <div class="brand-mark">ES</div>
          <div class="brand-name">ExecuteSpec</div>
        </div>
        <span class="chip" style="margin-top: 32px;">Beta · Launch week</span>
        <h1 class="headline" style="margin-top: 20px;">
          Specify once.<br>
          Ship <span class="it">verified</span> code.
        </h1>
        <p class="sub">
          Spec-driven AI coding with deterministic 0–100 scoring.
          Multi-agent pipeline. Multi-repo projects. BYOK.
        </p>
      </div>
      <div class="foot">
        <div class="pill"><span class="dot"></span>$20/mo · 20 credits · 3 providers</div>
        <div class="url">executespec.ai</div>
      </div>
    </div>
    <div class="right">
      <div class="frame">
        <div class="chrome"><i></i><i></i><i></i></div>
        <div class="shot-wrap"><img src="screenshot.png" alt=""></div>
      </div>
    </div>
  </div>
</body>
</html>
