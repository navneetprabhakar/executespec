# wrangler.toml — deploys the static site to Cloudflare Worker `square-bar-e1dc`.
#
# The Worker is bound to executespec.ai + www.executespec.ai via dashboard-managed
# Custom Domains. Since we don't declare `routes` here, those bindings are preserved.
#
# Deploy: npx wrangler deploy --config website/wrangler.toml
# (or `cd website && npx wrangler deploy`)

name = "square-bar-e1dc"
compatibility_date = "2025-04-21"

[assets]
# Serve everything in this folder as static assets.
directory = "./"
# When a URL doesn't match a file, serve the site-supplied 404 (or fall back to index.html
# if no /404.html exists). "404-page" matches typical marketing-site behaviour.
not_found_handling = "404-page"
# Exclude planning docs + the toml itself from deployment.
# Cloudflare Workers Static Assets doesn't have a native ignore glob, so we rely on
# the `.assetsignore` file sitting next to this toml.
