# 2026-05-14 — Dependency update automation.
#
# Three ecosystems are tracked: npm (frontend/), Maven (root pom.xml), and
# the GitHub Actions in .github/workflows/. Each gets a weekly batched PR
# rather than one PR per dependency — at ~67 backend deps + ~42 frontend
# deps the daily / per-package noise floor would drown the actual review
# signal.
#
# Grouping strategy:
#   - Patch + minor updates: bundled into a single weekly "patch-minor" PR
#     per ecosystem. These are low-risk and ship as a batch.
#   - Major updates: separate PR per dependency. Reviewer treats each as a
#     potential breaking change.
#   - Security advisories (Dependabot alerts → automated security PRs): NOT
#     grouped — those land immediately, one per CVE.
#
# Reviewers + assignees deliberately left unset so the team's existing PR
# auto-assign rules apply. CHANGE THE `target-branch` if dev ever shifts
# away from `dev` as the integration branch.
#
# Rationale for weekly cadence: the team's `lint.yml` already runs on every
# PR, and `deploy.yml` runs on push to dev — daily Dependabot PRs would
# saturate that pipeline without giving meaningful velocity (most upstream
# patches don't matter the moment they ship). Weekly hits the sweet spot
# of "fresh enough for security backports, sparse enough to actually
# review".

version: 2
updates:
  # ── Frontend npm ────────────────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Kolkata'
    target-branch: 'dev'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'frontend'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      patch-minor:
        update-types:
          - 'patch'
          - 'minor'
      types:
        # @types/* + TypeScript / ESLint ecosystem batched together so PRs
        # don't fragment when TS releases drag the type packages along.
        patterns:
          - '@types/*'
          - 'typescript'
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'prettier'
    ignore:
      # Vite 6.x is a major rewrite; gate the move behind a deliberate PR
      # rather than letting Dependabot file it as a batched minor.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      # React 19 ditto — coordinate with the recharts / framer-motion
      # ecosystem first.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # ── Backend Maven ──────────────────────────────────────────────────────────────────
  - package-ecosystem: 'maven'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Kolkata'
    target-branch: 'dev'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'backend'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      patch-minor:
        update-types:
          - 'patch'
          - 'minor'
      spring:
        # Spring Boot drags ~30 transitives — group them so the weekly PR
        # reads as one coherent upgrade instead of a dozen partial bumps.
        patterns:
          - 'org.springframework.*'
          - 'org.springframework.boot:*'
          - 'org.springframework.security:*'
          - 'org.springframework.ai:*'
      google-cloud:
        patterns:
          - 'com.google.cloud:*'
          - 'com.google.cloud.opentelemetry:*'
          - 'com.google.api*'
          - 'com.google.oauth-client:*'
      observability:
        patterns:
          - 'io.micrometer:*'
          - 'io.opentelemetry:*'
          - 'net.logstash.logback:*'
    ignore:
      # Spring Boot 3.4 → 3.5 majors come with framework changes that need
      # a deliberate review pass. Patch + minor updates within 3.3.x / 3.4.x
      # still flow through the `spring` group above.
      - dependency-name: 'org.springframework.boot:spring-boot-starter-parent'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions ─────────────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Kolkata'
    target-branch: 'dev'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    groups:
      actions:
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
