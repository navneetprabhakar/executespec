name: Build & Deploy

on:
  push:
    branches: [ main, dev ]

env:
  JAVA_VERSION: '21'
  DEPLOY_BUCKET_PREFIX: executespec    # Bucket: executespec-{env}-deploy

jobs:
  build-and-deploy:
    name: Build → Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest

    # ── Environment: main → production, dev → development ───────────────────
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    env:
      DEPLOY_ENV:    ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      GCP_PROJECT:   ${{ secrets.GCP_PROJECT }}
      GCP_REGION:    ${{ secrets.GCP_REGION }}
      GCE_INSTANCE:  ${{ secrets.GCE_INSTANCE }}
      GCE_ZONE:      ${{ secrets.GCE_ZONE }}

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java setup ────────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ── Node.js setup (for frontend build) ────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Frontend build ────────────────────────────────────────────────────
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # ── Backend build ─────────────────────────────────────────────────────
      - name: Build JAR (skip tests)
        run: mvn package -DskipTests -q

      # ── Authenticate to GCP (Workload Identity Federation — no keys) ─────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Determine deploy bucket ───────────────────────────────────────────
      - name: Set deploy bucket
        run: |
          DEPLOY_BUCKET="gs://${{ env.DEPLOY_BUCKET_PREFIX }}-${{ env.DEPLOY_ENV }}-deploy"
          echo "DEPLOY_BUCKET=$DEPLOY_BUCKET" >> $GITHUB_ENV
          echo "Deploy bucket: $DEPLOY_BUCKET"

      # ── Upload JAR keyed by commit SHA ────────────────────────────────────
      # JAR is stored permanently by SHA — never overwritten — full rollback history.
      - name: Upload JAR to GCS
        run: |
          JAR=$(ls target/*.jar | head -1)
          gsutil cp "$JAR" ${{ env.DEPLOY_BUCKET }}/releases/app-${{ github.sha }}.jar
          echo "${{ github.sha }}" | gsutil cp - ${{ env.DEPLOY_BUCKET }}/CURRENT_SHA
          echo "Uploaded: ${{ env.DEPLOY_BUCKET }}/releases/app-${{ github.sha }}.jar"

      # ── Ensure validator toolchains on GCE (idempotent) ───────────────────
      # The code validator needs Node.js (npx/tsc/eslint) and Python3 (mypy/ruff/pytest)
      # installed on the VM. This step is idempotent — skips if already present.
      - name: Ensure validator toolchains on GCE
        run: |
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e

              # ── Node.js (LTS via NodeSource) ──────────────────────────────
              if ! command -v node &>/dev/null; then
                echo 'Installing Node.js LTS...'
                curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
              echo \"Node: \$(node --version)  npm: \$(npm --version)  npx: \$(npx --version)\"

              # ── Python3 + pip ─────────────────────────────────────────────
              if ! command -v python3 &>/dev/null; then
                echo 'Installing Python3...'
                sudo apt-get update -y
                sudo apt-get install -y python3 python3-pip python3-venv
              fi
              echo \"Python: \$(python3 --version)\"

              # ── Global Python linting/typing tools ────────────────────────
              pip3 install --quiet --break-system-packages mypy ruff pytest 2>/dev/null \
                || pip3 install --quiet mypy ruff pytest 2>/dev/null \
                || echo 'pip install skipped (tools may already be present)'
              echo 'Validator toolchains OK'
            "

      # ── Determine public URL for CORS / dashboard links ─────────────────
      - name: Set public URL
        run: |
          if [ "${{ env.DEPLOY_ENV }}" = "prod" ]; then
            echo "APP_PUBLIC_URL=https://app.executespec.ai" >> $GITHUB_ENV
          else
            echo "APP_PUBLIC_URL=https://dev.executespec.ai" >> $GITHUB_ENV
          fi

      # ── Deploy JAR and restart service ──────────────────────────────────────
      - name: Write env patch script
        run: |
          cat > /tmp/env-patch.sh << 'SCRIPT'
          #!/bin/bash
          # Upsert a key=value into the env file
          ENV_FILE="/opt/app/executespec.env"
          touch "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          upsert() {
            local key="${1%%=*}"
            local kv="$1"
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${kv}|" "$ENV_FILE"
            else
              echo "${kv}" >> "$ENV_FILE"
            fi
          }

          # ── App settings ──────────────────────────────────────────────
          upsert "CORS_ALLOWED_ORIGINS=https://app.executespec.ai,https://dev.executespec.ai,http://localhost:5173"
          upsert "DASHBOARD_URL=$1"
          upsert "APP_BASE_URL=$1"
          upsert "MAIL_TRANSPORT=smtp"
          upsert "MAIL_FROM=admin@executespec.ai"

          # ── API keys from GCS (never committed to repo) ──────────────
          DEPLOY_BUCKET="$2"
          if [ -n "$DEPLOY_BUCKET" ]; then
            API_KEYS_FILE="/tmp/api-keys-$$"
            if gsutil -q stat "gs://${DEPLOY_BUCKET}/config/api-keys" 2>/dev/null; then
              gsutil cp "gs://${DEPLOY_BUCKET}/config/api-keys" "$API_KEYS_FILE" 2>/dev/null
              while IFS= read -r line; do
                # Skip comments and blank lines
                [[ -z "$line" || "$line" == \#* ]] && continue
                upsert "$line"
              done < "$API_KEYS_FILE"
              rm -f "$API_KEYS_FILE"
              echo "API keys loaded from GCS"
            else
              echo "WARN: gs://${DEPLOY_BUCKET}/config/api-keys not found — keys must already be in env file"
            fi

            # ── SMTP credentials from GCS ──────────────────────────────
            SMTP_FILE="/tmp/smtp-creds-$$"
            if gsutil -q stat "gs://${DEPLOY_BUCKET}/config/smtp-credentials" 2>/dev/null; then
              gsutil cp "gs://${DEPLOY_BUCKET}/config/smtp-credentials" "$SMTP_FILE" 2>/dev/null
              while IFS= read -r line; do
                [[ -z "$line" || "$line" == \#* ]] && continue
                upsert "$line"
              done < "$SMTP_FILE"
              rm -f "$SMTP_FILE"
              echo "SMTP credentials loaded from GCS"
            fi
          fi
          SCRIPT
          chmod +x /tmp/env-patch.sh

      - name: Deploy JAR to GCE (${{ env.DEPLOY_ENV }})
        run: |
          # Upload env-patch script to the VM
          gcloud compute scp /tmp/env-patch.sh ${{ env.GCE_INSTANCE }}:/tmp/env-patch.sh \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap

          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              sudo mkdir -p /opt/app/releases
              sudo gsutil cp ${{ env.DEPLOY_BUCKET }}/releases/app-${{ github.sha }}.jar /opt/app/releases/
              sudo bash /tmp/env-patch.sh '${{ env.APP_PUBLIC_URL }}' '${{ env.DEPLOY_BUCKET_PREFIX }}-${{ env.DEPLOY_ENV }}-deploy'
              rm -f /tmp/env-patch.sh
              sudo ln -sf /opt/app/releases/app-${{ github.sha }}.jar /opt/app/app.jar
              echo '${{ github.sha }}' | sudo tee /opt/app/RUNNING_SHA
              sudo systemctl restart executespec
              echo 'Deploy done — service restarting'
            "

      # ── Wait for app to boot (local sleep, not over SSH) ─────────────────
      - name: Wait for app startup
        run: sleep 30

      # ── Health check (separate short SSH session) ────────────────────────
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "Health check attempt $i..."
            RESULT=$(gcloud compute ssh ${{ env.GCE_INSTANCE }} \
              --zone ${{ env.GCE_ZONE }} \
              --tunnel-through-iap \
              --command="curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8080/api/health 2>/dev/null; echo \"HTTP_CODE=\$?:\$(cat /tmp/health.json 2>/dev/null)\"" \
              2>/dev/null) || RESULT="SSH_FAIL"
            echo "  Result: $RESULT"
            if echo "$RESULT" | grep -q '"status":"UP"'; then
              echo "Health OK"
              exit 0
            fi
            sleep 10
          done
          echo "Health check FAILED after 8 attempts"
          exit 1

      # ── Dump logs on failure ─────────────────────────────────────────────
      - name: Dump app logs (on failure)
        if: failure()
        run: |
          echo "── systemctl status ──"
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="sudo systemctl status executespec --no-pager 2>&1 || true" \
            2>/dev/null || echo "SSH failed"
          echo ""
          echo "── Last 150 lines of app log ──"
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="sudo journalctl -u executespec --no-pager -n 150 2>&1 || true" \
            2>/dev/null || echo "SSH failed"
          echo ""
          echo "── Environment file (redacted) ──"
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone ${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --command="sudo cat /opt/app/executespec.env 2>/dev/null | sed 's/=.*/=***/' || echo 'No env file'" \
            2>/dev/null || echo "SSH failed"

      # ── Prune old releases (keep last 10) ─────────────────────────────────
      - name: Prune old JAR releases
        run: |
          CURRENT_JAR="app-${{ github.sha }}.jar"
          ALL_JARS=$(gsutil ls ${{ env.DEPLOY_BUCKET }}/releases/ | sort)
          COUNT=$(echo "$ALL_JARS" | wc -l)
          if [ "$COUNT" -gt 10 ]; then
            echo "$ALL_JARS" \
              | head -n -10 \
              | grep -v "$CURRENT_JAR" \
              | xargs -r gsutil rm
            echo "Pruned old release(s), kept current ($CURRENT_JAR) + last 10"
          else
            echo "Only $COUNT release(s) — no pruning needed"
          fi

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "✅ Deployed commit ${{ github.sha }} to ${{ env.GCE_INSTANCE }} (${{ env.DEPLOY_ENV }})"
          echo "   JAR: ${{ env.DEPLOY_BUCKET }}/releases/app-${{ github.sha }}.jar"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   Environment: ${{ env.DEPLOY_ENV }}"

      # ── Slack notifications ────────────────────────────────────────────────
      - name: Notify Slack (success)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && echo "No SLACK_WEBHOOK_URL — skipping" && exit 0
          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 80)
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Build payload with jq to handle escaping safely
          PAYLOAD=$(jq -nc \
            --arg env "${{ env.DEPLOY_ENV }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "$COMMIT_MSG" \
            --arg commit_url "$COMMIT_URL" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "$RUN_URL" \
            '{blocks:[{type:"section",text:{type:"mrkdwn",text:(
              ":white_check_mark: *Deploy succeeded* — `" + $env + "`\n" +
              "*Branch:* `" + $branch + "`\n" +
              "*Commit:* <" + $commit_url + "|" + $commit + ">\n" +
              "*By:* " + $actor + "\n" +
              "<" + $run_url + "|View workflow>"
            )}}]}')
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || echo "Slack notification failed (non-blocking)"

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && echo "No SLACK_WEBHOOK_URL — skipping" && exit 0
          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 80)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -nc \
            --arg env "${{ env.DEPLOY_ENV }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "$RUN_URL" \
            '{blocks:[{type:"section",text:{type:"mrkdwn",text:(
              ":x: *Deploy FAILED* — `" + $env + "`\n" +
              "*Branch:* `" + $branch + "`\n" +
              "*Commit:* " + $commit + "\n" +
              "*By:* " + $actor + "\n" +
              "<" + $run_url + "|View logs>"
            )}}]}')
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || echo "Slack notification failed (non-blocking)"
