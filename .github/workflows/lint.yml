name: Lint

# 2026-05-01 — Google Java + TypeScript style guide enforcement on PRs.
# Catches format / lint violations before merge so the deploy pipeline
# (deploy.yml) never has to fail on style. Cheap, fast feedback loop:
# typically <2min vs. ~12min for the full deploy job.
#
# Triggers:
#   - Every pull request opened against dev or main
#   - Manual workflow_dispatch for ad-hoc runs (debugging the workflow itself)
#
# Reference: docs/design/code-style.md (lists the deviations the configs
# already encode — D-J1 wildcards, D-T1 default exports for *.tsx, etc.)

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  java-lint:
    name: Java · spotless:check (google-java-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # spotless:check fails on any drift. Run via spotless-maven-plugin
      # directly (not the full verify phase) so this job stays fast — the
      # check itself completes in seconds; the cost is Maven download + the
      # google-java-format jar fetch (cached after the first PR).
      - name: Run spotless:check
        run: mvn -B spotless:check

      - name: Failure hint
        if: failure()
        run: |
          echo "::error::Run 'mvn spotless:apply' locally and commit the result."
          echo "::error::See docs/design/code-style.md for the documented deviations."

  frontend-lint:
    name: Frontend · prettier + eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Prettier first (the cheap gate). ESLint second (slower but catches
      # the Google TS Style guide rules that aren't whitespace).
      - name: Prettier format check
        run: cd frontend && npm run format:check

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Failure hint
        if: failure()
        run: |
          echo "::error::Run the following locally to fix:"
          echo "::error::  npm --prefix frontend run format"
          echo "::error::  npm --prefix frontend run lint:fix"
          echo "::error::See docs/design/code-style.md for the documented deviations."

  # 2026-05-14 — npm audit gate, warn-only initially.
  #
  # Runs `npm audit` against the resolved package-lock.json on every PR so
  # newly-disclosed CVEs in our frontend dependencies surface in the PR
  # checks tab without anyone having to remember to run audit locally.
  #
  # Why warn-only (`continue-on-error: true`) right now:
  #   1. There's a known existing backlog of high-severity advisories in
  #      dev-only transitives (esbuild dev-server XSS via vite 5.x — see
  #      the 2026-05-14 security triage). Flipping straight to enforcing
  #      would block every unrelated PR on day-one until the backlog clears.
  #   2. New CVEs can land between a PR opening and merging — those should
  #      be a signal, not a wall.
  #
  # To flip to enforcing once the backlog is clear:
  #   - Remove the `continue-on-error: true` line below.
  #   - (Optional) raise `--audit-level=high` to `critical` for a stricter
  #     gate, or drop to `moderate` if we want broader coverage.
  #
  # Dev-deps are included via the default audit scope. `--omit=dev` would
  # mirror the production bundle, but dev-deps like vite/esbuild are still
  # exposed during local development on team laptops, so we want visibility
  # there. Use `--production` flag if that ever changes.
  frontend-audit:
    name: Frontend · npm audit (warn-only)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm audit` doesn't need a full install — it consults the registry
      # using package-lock.json directly. Skipping install keeps this job
      # under 30s.
      - name: npm audit (high + critical)
        id: audit
        continue-on-error: true
        run: |
          cd frontend
          # --audit-level=high → only flag high + critical findings.
          # JSON output captured for the summary step; pretty output streamed
          # to the log for human readers.
          npm audit --audit-level=high
          echo "audit_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::warning::npm audit reported high or critical findings."
            echo "::warning::This job is currently WARN-ONLY — see docs/security/audit-policy.md (TBD)."
            echo "::warning::Run \`npm --prefix frontend audit\` locally for details."
          else
            echo "::notice::npm audit clean (no high/critical advisories)."
          fi
