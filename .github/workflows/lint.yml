name: Lint

# 2026-05-01 — TypeScript style-guide enforcement on PRs (frontend only).
# 2026-06-18 (CI-minutes pass) — the Java spotless:check job moved into the
# Test workflow (test.yml) so a single Java runner does spotless + the unit
# suite in one Maven invocation, and the warn-only npm-audit job was removed
# (it never gated anything). See docs/reason-log/2026-06.md.
# Cheap, fast feedback loop so the deploy pipeline never fails on style.
#
# Triggers:
#   - Every pull request opened against dev, main, or benchmark
#   - Manual workflow_dispatch for ad-hoc runs (debugging the workflow itself)
#
# Reference: docs/design/code-style.md (lists the deviations the configs
# already encode — D-T1 default exports for *.tsx, etc.)

on:
  pull_request:
    branches: [dev, main, benchmark]
  workflow_dispatch:

# 2026-06-18 — cancel superseded runs: a new push to the same PR cancels the
# in-flight Lint run instead of letting both finish. This is the single
# biggest Actions-minute saver on actively-pushed branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend · prettier + eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Prettier first (the cheap gate). ESLint second (slower but catches
      # the Google TS Style guide rules that aren't whitespace).
      - name: Prettier format check
        run: cd frontend && npm run format:check

      - name: ESLint
        run: cd frontend && npm run lint

      # RL-2026-05-041 (audit #17) — vitest unit suite. The WCAG-contrast
      # regression guard (+ future component tests) run here.
      - name: Vitest
        run: cd frontend && npm test

      - name: Failure hint
        if: failure()
        run: |
          echo "::error::Run the following locally to fix:"
          echo "::error::  npm --prefix frontend run format"
          echo "::error::  npm --prefix frontend run lint:fix"
          echo "::error::  npm --prefix frontend test"
          echo "::error::See docs/design/code-style.md for the documented deviations."
