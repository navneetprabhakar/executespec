name: Test

# 2026-05-29 — Java lint + unit-test gate on PRs.
# 2026-06-18 (CI-minutes pass) — absorbed the spotless:check job from
# lint.yml so ONE Java runner does `mvn spotless:check test` in a single
# invocation (one Maven setup instead of two). See docs/reason-log/2026-06.md.
# The pom.xml Surefire config sets <excludedGroups>e2e,integration,chaos</…>,
# so this runs the fast in-process unit suite only — no real LLM API calls,
# no Testcontainers, no real Postgres.
#
# Cost: $0 in LLM tokens — every LlmRouter / provider client in the unit
# tests is mocked via Mockito. Real-API tests live under @Tag("e2e") and are
# excluded by Surefire (run manually with `mvn test -Dgroups=e2e`).
#
# Triggers:
#   - Every pull request opened against dev, main, or benchmark
#   - Manual workflow_dispatch for ad-hoc runs

on:
  pull_request:
    branches: [dev, main, benchmark]
  workflow_dispatch:

# 2026-06-18 — cancel superseded runs (see lint.yml for rationale).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  java-test:
    name: Java · spotless:check + mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # One invocation: spotless:check (google-java-format drift) runs first
      # and fails fast, then the `test` phase runs the unit suite. spotless is
      # bound only to the `verify` phase in pom.xml, so this explicit goal is
      # the single spotless run — no double execution. `-B` (batch mode)
      # silences download-progress noise without losing failure summaries.
      - name: Run spotless:check + unit tests
        run: mvn -B spotless:check test

      # Upload the Surefire reports on failure so reviewers can see the full
      # per-method stack trace without re-running the workflow locally.
      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Failure hint
        if: failure()
        run: |
          echo "::error::Format drift?  Run 'mvn spotless:apply' locally and commit the result."
          echo "::error::Test failure?  Run 'mvn test' locally to reproduce (Surefire reports uploaded above)."
          echo "::error::Known pre-existing flake/regression? Mark it @Disabled with a clear TODO."
          echo "::error::See docs/design/code-style.md for the documented style deviations."
